version = 1

# Vendored json-stream keeps upstream's files without licence headers, so their licence and
# copyright live here.
[[annotations]]
path = "vendor/json-stream/**"
SPDX-FileCopyrightText = "2015 Ondrej Palkovsky"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["vendor/json-stream/Data/JsonStream/CLexer.hs", "vendor/json-stream/c_lib/lexer.c"]
SPDX-FileCopyrightText = ["2015 Ondrej Palkovsky", "2026 Alexandra de Wit"]
SPDX-License-Identifier = "BSD-3-Clause"

# Écluse's own files beside the vendored ones.
[[annotations]]
path = ["vendor/json-stream/README.md", "vendor/json-stream/json-stream.freeze", "vendor/json-stream.sha256"]
SPDX-FileCopyrightText = "2026 Alexandra de Wit"
SPDX-License-Identifier = "MIT"
