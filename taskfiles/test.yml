version: '3'
tasks:
  artifact-tool:
    cmds:
      - cabal build exe:ecluse-artifact

  e2e-prepare:
    vars: &identity-vars
      SOURCE: &source
        sh: if [ -n "${ECLTEST_SOURCE:-}" ]; then printf '%s\n' "$ECLTEST_SOURCE"; else git rev-parse HEAD; fi
      ARCHITECTURE: &architecture
        sh: if [ -n "${ECLTEST_ARCHITECTURE:-}" ]; then printf '%s\n' "$ECLTEST_ARCHITECTURE"; else uname -m; fi
    env: &identity-env
      ECLTEST_SOURCE: '{{.SOURCE}}'
      ECLTEST_ARCHITECTURE: '{{.ARCHITECTURE}}'
      ECLTEST_REQUIRED: '1'
      ECLTEST_ARGUMENTS: '{{env "ECLTEST_ARGUMENTS" | default .CLI_ARGS}}'
    cmds:
      - bash scripts/artifact-lock.sh "${ECLTEST_ARTIFACT_DIR:?set ECLTEST_ARTIFACT_DIR}" task --exit-code test:e2e-prepare-locked

  e2e:
    vars:
      SOURCE: *source
      ARCHITECTURE: *architecture
      ROOT:
        sh: if [ -n "${ECLTEST_ARTIFACT_DIR:-}" ]; then printf '%s\n' "$ECLTEST_ARTIFACT_DIR"; else mkdir -p scratchpad/e2e; mktemp -d scratchpad/e2e/run.XXXXXXXXXX; fi
    env:
      ECLTEST_SOURCE: '{{.SOURCE}}'
      ECLTEST_ARCHITECTURE: '{{.ARCHITECTURE}}'
      ECLTEST_REQUIRED: '1'
      ECLTEST_ARGUMENTS: '{{env "ECLTEST_ARGUMENTS" | default .CLI_ARGS}}'
      ECLTEST_ARTIFACT_DIR: '{{.ROOT}}'
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - 'printf "E2E artifacts: %s\n" "$ECLTEST_ARTIFACT_DIR"'
      - bash scripts/artifact-lock.sh "$ECLTEST_ARTIFACT_DIR" task --exit-code test:e2e-locked

  e2e-locked:
    cmds:
      - task: e2e-prepare-locked
      - task: e2e-load-locked
      - bash scripts/process-capture.sh "$ECLTEST_ARTIFACT_DIR/npm.status" "$ECLTEST_ARTIFACT_DIR/npm.log" env ECLTEST_SHARD=npm ECLTEST_COMPONENT=ecluse-e2e-npm task --exit-code test:e2e-attempt
      - '"$(cabal list-bin exe:ecluse-artifact)" attempt-continue "$ECLTEST_ARTIFACT_DIR" npm "$(cat "$ECLTEST_ARTIFACT_DIR/reports/npm.attempt")"'
      - bash scripts/process-capture.sh "$ECLTEST_ARTIFACT_DIR/pypi.status" "$ECLTEST_ARTIFACT_DIR/pypi.log" env ECLTEST_SHARD=pypi ECLTEST_COMPONENT=ecluse-e2e-pypi task --exit-code test:e2e-attempt
      - '"$(cabal list-bin exe:ecluse-artifact)" attempt-continue "$ECLTEST_ARTIFACT_DIR" pypi "$(cat "$ECLTEST_ARTIFACT_DIR/reports/pypi.attempt")"'
      - bash scripts/process-capture.sh "$ECLTEST_ARTIFACT_DIR/cargo.status" "$ECLTEST_ARTIFACT_DIR/cargo.log" env ECLTEST_SHARD=cargo ECLTEST_COMPONENT=ecluse-e2e-cargo task --exit-code test:e2e-attempt
      - '"$(cabal list-bin exe:ecluse-artifact)" attempt-continue "$ECLTEST_ARTIFACT_DIR" cargo "$(cat "$ECLTEST_ARTIFACT_DIR/reports/cargo.attempt")"'
      - bash scripts/process-capture.sh "$ECLTEST_ARTIFACT_DIR/rubygems.status" "$ECLTEST_ARTIFACT_DIR/rubygems.log" env ECLTEST_SHARD=rubygems ECLTEST_COMPONENT=ecluse-e2e-rubygems task --exit-code test:e2e-attempt
      - '"$(cabal list-bin exe:ecluse-artifact)" attempt-continue "$ECLTEST_ARTIFACT_DIR" rubygems "$(cat "$ECLTEST_ARTIFACT_DIR/reports/rubygems.attempt")"'
      - bash scripts/process-capture.sh "$ECLTEST_ARTIFACT_DIR/shared-system.status" "$ECLTEST_ARTIFACT_DIR/shared-system.log" env ECLTEST_SHARD=shared-system ECLTEST_COMPONENT=ecluse-e2e-shared-system task --exit-code test:e2e-attempt
      - '"$(cabal list-bin exe:ecluse-artifact)" attempt-continue "$ECLTEST_ARTIFACT_DIR" shared-system "$(cat "$ECLTEST_ARTIFACT_DIR/reports/shared-system.attempt")"'
      - bash scripts/process-capture.sh "$ECLTEST_ARTIFACT_DIR/audit.status" "$ECLTEST_ARTIFACT_DIR/audit.log" task --exit-code test:e2e-audit-locked
      - bash scripts/process-status.sh "$ECLTEST_ARTIFACT_DIR/npm.status" "$ECLTEST_ARTIFACT_DIR/pypi.status" "$ECLTEST_ARTIFACT_DIR/cargo.status" "$ECLTEST_ARTIFACT_DIR/rubygems.status" "$ECLTEST_ARTIFACT_DIR/shared-system.status" "$ECLTEST_ARTIFACT_DIR/audit.status"

  e2e-prepare-locked:
    vars:
      RUN_ID: &run-id
        sh: if [ -n "${ECLTEST_RUN_ID:-}" ]; then printf '%s\n' "$ECLTEST_RUN_ID"; else bash scripts/test-containers.sh run-id; fi
    env:
      ECLTEST_RUN_ID: '{{.RUN_ID}}'
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - mkdir "$ECLTEST_ARTIFACT_DIR/.bootstrap"
      - bash scripts/image-build-alongside.sh "$ECLTEST_ARTIFACT_DIR/archive-path" task --exit-code test:e2e-prepare-plan
      - cp "$(cat "$ECLTEST_ARTIFACT_DIR/archive-path")" "$ECLTEST_ARTIFACT_DIR/docker-image.tar"
      - '"$(cabal list-bin exe:ecluse-artifact)" prepare-finish "$ECLTEST_ARTIFACT_DIR" "$(bash scripts/image-archive.sh configuration "$ECLTEST_ARTIFACT_DIR/docker-image.tar")"'

  e2e-prepare-plan:
    cmds:
      - task: artifact-tool
      - '"$(cabal list-bin exe:ecluse-artifact)" prepare-begin "$ECLTEST_ARTIFACT_DIR"'
      - cabal build ecluse-e2e-manifest
      - '"$(cabal list-bin ecluse-e2e-manifest)" > "$ECLTEST_ARTIFACT_DIR/plan.json"'

  e2e-load:
    vars: *identity-vars
    env: *identity-env
    cmds:
      - bash scripts/artifact-lock.sh "${ECLTEST_ARTIFACT_DIR:?set ECLTEST_ARTIFACT_DIR}" task --exit-code test:e2e-load-locked

  e2e-load-locked:
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - task: artifact-tool
      - '"$(cabal list-bin exe:ecluse-artifact)" verify "$ECLTEST_ARTIFACT_DIR"'
      - bash scripts/docker-load.sh "$ECLTEST_ARTIFACT_DIR/docker-image.tar" > "$ECLTEST_ARTIFACT_DIR/load-ref"
      - bash scripts/docker-image-config.sh "$ECLTEST_ARTIFACT_DIR" "$(cat "$ECLTEST_ARTIFACT_DIR/load-ref")"
      - '"$(cabal list-bin exe:ecluse-artifact)" verify "$ECLTEST_ARTIFACT_DIR" "$(cat "$ECLTEST_ARTIFACT_DIR/loaded-config")"'
      - cp "$ECLTEST_ARTIFACT_DIR/loaded-ref" "$ECLTEST_ARTIFACT_DIR/image-ref"

  e2e-npm:
    vars: *identity-vars
    env: *identity-env
    cmds:
      - env ECLTEST_SHARD=npm ECLTEST_COMPONENT=ecluse-e2e-npm bash scripts/artifact-lock.sh "${ECLTEST_ARTIFACT_DIR:?set ECLTEST_ARTIFACT_DIR}" task --exit-code test:e2e-attempt

  e2e-pypi:
    vars: *identity-vars
    env: *identity-env
    cmds:
      - env ECLTEST_SHARD=pypi ECLTEST_COMPONENT=ecluse-e2e-pypi bash scripts/artifact-lock.sh "${ECLTEST_ARTIFACT_DIR:?set ECLTEST_ARTIFACT_DIR}" task --exit-code test:e2e-attempt

  e2e-cargo:
    vars: *identity-vars
    env: *identity-env
    cmds:
      - env ECLTEST_SHARD=cargo ECLTEST_COMPONENT=ecluse-e2e-cargo bash scripts/artifact-lock.sh "${ECLTEST_ARTIFACT_DIR:?set ECLTEST_ARTIFACT_DIR}" task --exit-code test:e2e-attempt

  e2e-rubygems:
    vars: *identity-vars
    env: *identity-env
    cmds:
      - env ECLTEST_SHARD=rubygems ECLTEST_COMPONENT=ecluse-e2e-rubygems bash scripts/artifact-lock.sh "${ECLTEST_ARTIFACT_DIR:?set ECLTEST_ARTIFACT_DIR}" task --exit-code test:e2e-attempt

  e2e-shared-system:
    vars: *identity-vars
    env: *identity-env
    cmds:
      - env ECLTEST_SHARD=shared-system ECLTEST_COMPONENT=ecluse-e2e-shared-system bash scripts/artifact-lock.sh "${ECLTEST_ARTIFACT_DIR:?set ECLTEST_ARTIFACT_DIR}" task --exit-code test:e2e-attempt

  e2e-attempt:
    vars:
      ATTEMPT:
        sh: mkdir -p "$ECLTEST_ARTIFACT_DIR/reports/attempts"; mktemp -d "$ECLTEST_ARTIFACT_DIR/reports/attempts/$ECLTEST_SHARD.XXXXXXXXXX"
    env:
      ECLTEST_ATTEMPT_DIR: '{{.ATTEMPT}}'
      ECLTEST_REPORT_PATH: '{{.ATTEMPT}}/report.json'
      ECLTEST_CLEANUP_STATUS_PATH: '{{.ATTEMPT}}/cleanup-status'
    cmds:
      - bash scripts/artifact-invalidate.sh "$ECLTEST_ARTIFACT_DIR" "$ECLTEST_SHARD" "$ECLTEST_ATTEMPT_DIR"
      - task: artifact-tool
      - '"$(cabal list-bin exe:ecluse-artifact)" attempt-begin "$ECLTEST_ARTIFACT_DIR" "$ECLTEST_SHARD" "$ECLTEST_ATTEMPT_DIR"'
      - bash scripts/process-capture.sh "$ECLTEST_ATTEMPT_DIR/native-status" "$ECLTEST_ATTEMPT_DIR/run.log" task --exit-code test:e2e-run
      - cp "$ECLTEST_ATTEMPT_DIR/run.log" "$ECLTEST_ARTIFACT_DIR/reports/$ECLTEST_SHARD.log"
      - '"$(cabal list-bin exe:ecluse-artifact)" attempt-finish "$ECLTEST_ARTIFACT_DIR" "$ECLTEST_SHARD" "$ECLTEST_ATTEMPT_DIR" "$(cat "$ECLTEST_ATTEMPT_DIR/native-status")"'

  e2e-run:
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - '"$(cabal list-bin exe:ecluse-artifact)" verify "$ECLTEST_ARTIFACT_DIR"'
      - cabal build "$ECLTEST_COMPONENT"
      - bash scripts/test-containers.sh run task --exit-code test:e2e-native

  e2e-native:
    cmds:
      - bash scripts/docker-image-config.sh "$ECLTEST_ARTIFACT_DIR" "$(cat "$ECLTEST_ARTIFACT_DIR/image-ref")"
      - '"$(cabal list-bin exe:ecluse-artifact)" verify "$ECLTEST_ARTIFACT_DIR" "$(cat "$ECLTEST_ARTIFACT_DIR/loaded-config")"'
      - '. "$ECLTEST_ARTIFACT_DIR/identity.env"; ECLTEST_E2E_IMAGE="$(cat "$ECLTEST_ARTIFACT_DIR/loaded-ref")" "$(cabal list-bin "$ECLTEST_COMPONENT")"'

  e2e-audit:
    vars: *identity-vars
    env: *identity-env
    cmds:
      - bash scripts/artifact-lock.sh "${ECLTEST_ARTIFACT_DIR:?set ECLTEST_ARTIFACT_DIR}" task --exit-code test:e2e-audit-locked

  e2e-audit-locked:
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - task: artifact-tool
      - '"$(cabal list-bin exe:ecluse-artifact)" verify-plan "$ECLTEST_ARTIFACT_DIR"'
      - cabal build ecluse-e2e-audit
      - '. "$ECLTEST_ARTIFACT_DIR/identity.env"; "$(cabal list-bin ecluse-e2e-audit)" "$ECLTEST_ARTIFACT_DIR/plan.json" "$ECLTEST_ARTIFACT_DIR/reports/npm.json" "$ECLTEST_ARTIFACT_DIR/reports/pypi.json" "$ECLTEST_ARTIFACT_DIR/reports/cargo.json" "$ECLTEST_ARTIFACT_DIR/reports/rubygems.json" "$ECLTEST_ARTIFACT_DIR/reports/shared-system.json"'

  e2e-diagnostics:
    cmds:
      - mkdir -p "$ECLTEST_ARTIFACT_DIR/reports"
      - 'printf "source=%s\nrun=%s\ncomponent=%s\njob-status=%s\n" "${ECLTEST_SOURCE:-unknown}" "${ECLTEST_RUN_ID:-unknown}" "${ECLTEST_COMPONENT:-unknown}" "${ECLTEST_JOB_STATUS:-unknown}" > "$ECLTEST_ARTIFACT_DIR/reports/${ECLTEST_COMPONENT:-unknown}-job.log"'

  npm-completion:
    cmds:
      - task: ecosystem-completion
        vars: {ECOSYSTEM: npm}

  pypi-completion:
    cmds:
      - task: ecosystem-completion
        vars: {ECOSYSTEM: pypi}

  cargo-completion:
    cmds:
      - task: ecosystem-completion
        vars: {ECOSYSTEM: cargo}

  rubygems-completion:
    cmds:
      - task: ecosystem-completion
        vars: {ECOSYSTEM: rubygems}

  ecosystem-completion:
    vars: *identity-vars
    env: *identity-env
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - task: artifact-tool
      - '"$(cabal list-bin exe:ecluse-artifact)" verify "$ECLTEST_ARTIFACT_DIR"'
      - cabal build ecluse-completion-{{.ECOSYSTEM}}-audit
      - >-
        . "$ECLTEST_ARTIFACT_DIR/identity.env";
        "$(cabal list-bin ecluse-completion-{{.ECOSYSTEM}}-audit)"
        "${ECLTEST_CORE_UNIT_ARTIFACT_DIR:?}/unit-plan.json"
        "$ECLTEST_CORE_UNIT_ARTIFACT_DIR/unit-report.json"
        "${ECLTEST_RUNTIME_UNIT_ARTIFACT_DIR:?}/unit-plan.json"
        "$ECLTEST_RUNTIME_UNIT_ARTIFACT_DIR/unit-report.json"
        "${ECLTEST_INTEGRATION_ARTIFACT_DIR:?}/plan.json"
        "$ECLTEST_INTEGRATION_ARTIFACT_DIR/report.json"
        "$ECLTEST_ARTIFACT_DIR/plan.json"
        "$ECLTEST_ARTIFACT_DIR/reports/{{.ECOSYSTEM}}.json"

  conformance-verdaccio:
    vars:
      SOURCE: *source
      ARCHITECTURE: *architecture
      RUN_ID: *run-id
      ROOT:
        sh: mkdir -p scratchpad/backend-conformance; mktemp -d scratchpad/backend-conformance/verdaccio.XXXXXXXXXX
    env:
      ECLTEST_SOURCE: '{{.SOURCE}}'
      ECLTEST_ARCHITECTURE: '{{.ARCHITECTURE}}'
      ECLTEST_REQUIRED: '1'
      ECLTEST_ARGUMENTS: '{{env "ECLTEST_ARGUMENTS" | default .CLI_ARGS}}'
      ECLTEST_BACKEND_DIR: '{{.ROOT}}'
      ECLTEST_REPORT_PATH: '{{.ROOT}}/report.json'
      ECLTEST_RUN_ID: '{{.RUN_ID}}'
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - 'printf "Package-store conformance artifacts: %s\n" "$ECLTEST_BACKEND_DIR"'
      - cabal build ecluse-conformance-verdaccio-manifest ecluse-conformance-verdaccio ecluse-conformance-verdaccio-audit
      - '"$(cabal list-bin ecluse-conformance-verdaccio-manifest)" > "$ECLTEST_BACKEND_DIR/plan.json"'
      - bash scripts/process-capture.sh "$ECLTEST_BACKEND_DIR/native-status" "$ECLTEST_BACKEND_DIR/run.log" task --exit-code test:conformance-verdaccio-native
      - bash scripts/process-capture.sh "$ECLTEST_BACKEND_DIR/audit-status" "$ECLTEST_BACKEND_DIR/audit.log" task --exit-code test:conformance-verdaccio-audit
      - bash scripts/process-status.sh "$ECLTEST_BACKEND_DIR/native-status" "$ECLTEST_BACKEND_DIR/audit-status"

  conformance-verdaccio-native:
    cmds:
      - 'ECLTEST_PLAN_DIGEST="$(sha256sum "$ECLTEST_BACKEND_DIR/plan.json" | cut -d" " -f1)" "$(cabal list-bin ecluse-conformance-verdaccio)"'

  conformance-verdaccio-audit:
    cmds:
      - 'ECLTEST_PLAN_DIGEST="$(sha256sum "$ECLTEST_BACKEND_DIR/plan.json" | cut -d" " -f1)" "$(cabal list-bin ecluse-conformance-verdaccio-audit)" "$ECLTEST_BACKEND_DIR/plan.json" "$ECLTEST_REPORT_PATH"'

  conformance-codeartifact:
    vars:
      SOURCE: *source
      ARCHITECTURE: *architecture
      RUN_ID: *run-id
      ROOT:
        sh: mkdir -p scratchpad/backend-conformance; mktemp -d scratchpad/backend-conformance/codeartifact.XXXXXXXXXX
    env:
      ECLTEST_SOURCE: '{{.SOURCE}}'
      ECLTEST_ARCHITECTURE: '{{.ARCHITECTURE}}'
      ECLTEST_REQUIRED: '1'
      ECLTEST_ARGUMENTS: '{{env "ECLTEST_ARGUMENTS" | default .CLI_ARGS}}'
      ECLTEST_BACKEND_DIR: '{{.ROOT}}'
      ECLTEST_REPORT_PATH: '{{.ROOT}}/report.json'
      ECLTEST_RUN_ID: '{{.RUN_ID}}'
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - 'printf "Package-store conformance artifacts: %s\n" "$ECLTEST_BACKEND_DIR"'
      - cabal build ecluse-conformance-codeartifact-manifest ecluse-conformance-codeartifact ecluse-conformance-codeartifact-audit
      - '"$(cabal list-bin ecluse-conformance-codeartifact-manifest)" > "$ECLTEST_BACKEND_DIR/plan.json"'
      - bash scripts/process-capture.sh "$ECLTEST_BACKEND_DIR/native-status" "$ECLTEST_BACKEND_DIR/run.log" task --exit-code test:conformance-codeartifact-native
      - bash scripts/process-capture.sh "$ECLTEST_BACKEND_DIR/audit-status" "$ECLTEST_BACKEND_DIR/audit.log" task --exit-code test:conformance-codeartifact-audit
      - bash scripts/process-status.sh "$ECLTEST_BACKEND_DIR/native-status" "$ECLTEST_BACKEND_DIR/audit-status"

  conformance-codeartifact-native:
    cmds:
      - 'ECLTEST_PLAN_DIGEST="$(sha256sum "$ECLTEST_BACKEND_DIR/plan.json" | cut -d" " -f1)" "$(cabal list-bin ecluse-conformance-codeartifact)"'

  conformance-codeartifact-audit:
    cmds:
      - 'ECLTEST_PLAN_DIGEST="$(sha256sum "$ECLTEST_BACKEND_DIR/plan.json" | cut -d" " -f1)" "$(cabal list-bin ecluse-conformance-codeartifact-audit)" "$ECLTEST_BACKEND_DIR/plan.json" "$ECLTEST_REPORT_PATH"'

  integration:
    vars:
      SOURCE: *source
      ARCHITECTURE: *architecture
      RUN_ID: *run-id
      ROOT: '{{.ECLTEST_INTEGRATION_ARTIFACT_DIR | default (printf "scratchpad/integration/%s" .RUN_ID)}}'
    env:
      ECLTEST_SOURCE: '{{.SOURCE}}'
      ECLTEST_ARCHITECTURE: '{{.ARCHITECTURE}}'
      ECLTEST_REQUIRED: '1'
      ECLTEST_ARGUMENTS: '{{env "ECLTEST_ARGUMENTS" | default .CLI_ARGS}}'
      ECLTEST_INTEGRATION_ARTIFACT_DIR: '{{.ROOT}}'
      ECLTEST_REPORT_PATH: '{{.ROOT}}/report.json'
      ECLTEST_RUN_ID: '{{.RUN_ID}}'
      ECLTEST_SHARD: integration
    cmds:
      - test -z "$ECLTEST_ARGUMENTS"
      - task --exit-code test:integration-prepare
      - bash scripts/process-capture.sh "$ECLTEST_INTEGRATION_ARTIFACT_DIR/native-status" "$ECLTEST_INTEGRATION_ARTIFACT_DIR/run.log" bash scripts/test-containers.sh run task --exit-code test:integration-native
      - task --exit-code test:integration-audit-capture
      - bash scripts/process-status.sh "$ECLTEST_INTEGRATION_ARTIFACT_DIR/native-status" "$ECLTEST_INTEGRATION_ARTIFACT_DIR/audit-status"

  integration-prepare:
    cmds:
      - mkdir -p "$ECLTEST_INTEGRATION_ARTIFACT_DIR"
      - rm -f "$ECLTEST_REPORT_PATH" "$ECLTEST_INTEGRATION_ARTIFACT_DIR/plan.json"
      - cabal build ecluse-integration-manifest ecluse-integration-audit
      - 'bash scripts/metadata-ticks.sh "$(cabal list-bin ecluse-integration-manifest)" > "$ECLTEST_INTEGRATION_ARTIFACT_DIR/plan.json"'

  integration-native:
    cmds:
      - 'ECLTEST_PLAN_DIGEST="$(sha256sum "$ECLTEST_INTEGRATION_ARTIFACT_DIR/plan.json" | cut -d" " -f1)" cabal test ecluse-integration --test-show-details=direct'

  integration-audit-capture:
    cmds:
      - bash scripts/process-capture.sh "$ECLTEST_INTEGRATION_ARTIFACT_DIR/audit-status" "$ECLTEST_INTEGRATION_ARTIFACT_DIR/audit.log" task --exit-code test:integration-audit

  integration-audit:
    cmds:
      - 'ECLTEST_PLAN_DIGEST="$(sha256sum "$ECLTEST_INTEGRATION_ARTIFACT_DIR/plan.json" | cut -d" " -f1)" bash scripts/metadata-ticks.sh "$(cabal list-bin ecluse-integration-audit)" "$ECLTEST_INTEGRATION_ARTIFACT_DIR/plan.json" "$ECLTEST_REPORT_PATH"'
