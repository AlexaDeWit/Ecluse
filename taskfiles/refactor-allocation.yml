version: '3'
vars:
  ALLOC_DIAG_ROOT: '{{.ROOT_DIR}}/scratchpad/refactor-allocation'
  ALLOC_DIAG_EVIDENCE: '{{.ALLOC_DIAG_ROOT}}/evidence'
  ALLOC_DIAG_BASELINE: 690a4cd522f3146fc04ae42d6abac684a44a422c
  ALLOC_DIAG_CANDIDATE: ab5f4af6e55b90ae79392f3d10a9505295f1239f
  ALLOC_DIAG_REACT_ROW: 'All.ecluse-core (work-per-request).ecosystem: npm.single-version metadata (per package).react (large).selective decode'
  ALLOC_DIAG_HASKELL: bench/report/Main.hs bench/report/src/Ecluse/BenchReport/AllocationDiagnostic.hs bench/report/src/Ecluse/BenchReport/AllocationDiagnostic/*.hs taskfiles/refactor-allocation/Diagnostic.hs
tasks:
  run:
    desc: Run the temporary React allocation diagnostic on one ARM64 worker
    preconditions:
      - test "$(uname -m)" = aarch64
      - test -z "${GHCRTS:-}"
      - test ! -e '{{.ALLOC_DIAG_ROOT}}'
      - test "$GITHUB_REF" = refs/heads/measure/refactor-allocation-diagnostics
    cmds:
      - mkdir -p '{{.ALLOC_DIAG_EVIDENCE}}/dependency' '{{.ALLOC_DIAG_EVIDENCE}}/inputs'
      - |
        set -euo pipefail
        git rev-parse HEAD HEAD^{tree} > '{{.ALLOC_DIAG_EVIDENCE}}/controller.txt'
        printf '%s\n' "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" "runner=$RUNNER_NAME" "image=${ImageVersion:-unknown}" > '{{.ALLOC_DIAG_EVIDENCE}}/worker.txt'
        uname -a >> '{{.ALLOC_DIAG_EVIDENCE}}/worker.txt'
        lscpu >> '{{.ALLOC_DIAG_EVIDENCE}}/worker.txt'
        git archive '{{.ALLOC_DIAG_BASELINE}}' | gzip > '{{.ALLOC_DIAG_EVIDENCE}}/source-A.tar.gz'
        git archive '{{.ALLOC_DIAG_CANDIDATE}}' | gzip > '{{.ALLOC_DIAG_EVIDENCE}}/source-B.tar.gz'
        cp -a taskfiles/refactor-allocation '{{.ALLOC_DIAG_EVIDENCE}}/overlay'
        cp taskfiles/refactor-allocation.yml '{{.ALLOC_DIAG_EVIDENCE}}/overlay/controller-task.yml'
        cp .github/workflows/bench.yml '{{.ALLOC_DIAG_EVIDENCE}}/overlay/controller-workflow.yml'
      - "printf '%s\\n' cabal build exe:bench-report > '{{.ALLOC_DIAG_EVIDENCE}}/controller-command.txt'"
      - bash scripts/process-capture.sh '{{.ALLOC_DIAG_EVIDENCE}}/controller-build.status' '{{.ALLOC_DIAG_EVIDENCE}}/controller-build.log' cabal build exe:bench-report
      - bash scripts/process-status.sh '{{.ALLOC_DIAG_EVIDENCE}}/controller-build.status'
      - cabal list-bin exe:bench-report > '{{.ALLOC_DIAG_EVIDENCE}}/reporter-path.txt'
      - cp "$(cat '{{.ALLOC_DIAG_EVIDENCE}}/reporter-path.txt')" '{{.ALLOC_DIAG_EVIDENCE}}/bench-report'
      - task: dependency
      - bash scripts/process-capture.sh '{{.ALLOC_DIAG_EVIDENCE}}/controls.status' '{{.ALLOC_DIAG_EVIDENCE}}/controls.log' '{{.ALLOC_DIAG_EVIDENCE}}/bench-report' allocation-diagnostic-controls '{{.ALLOC_DIAG_EVIDENCE}}'
      - bash scripts/process-status.sh '{{.ALLOC_DIAG_EVIDENCE}}/controls.status'
      - task: prepare
        vars: {ALLOC_DIAG_SIDE: A, ALLOC_DIAG_VARIANT: C}
      - task: prepare
        vars: {ALLOC_DIAG_SIDE: B, ALLOC_DIAG_VARIANT: C}
      - task: prepare
        vars: {ALLOC_DIAG_SIDE: A, ALLOC_DIAG_VARIANT: I}
      - task: prepare
        vars: {ALLOC_DIAG_SIDE: B, ALLOC_DIAG_VARIANT: I}
      - cmp '{{.ALLOC_DIAG_EVIDENCE}}/build-C-A/identity/corpus.sha256' '{{.ALLOC_DIAG_EVIDENCE}}/build-C-B/identity/corpus.sha256'
      - cmp '{{.ALLOC_DIAG_EVIDENCE}}/build-C-A/identity/locks.sha256' '{{.ALLOC_DIAG_EVIDENCE}}/build-C-B/identity/locks.sha256'
      - cp -a '{{.ALLOC_DIAG_ROOT}}/source-C-A/bench/corpus' '{{.ALLOC_DIAG_EVIDENCE}}/inputs/'
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: A, ALLOC_DIAG_VARIANT: C, ALLOC_DIAG_PASS: C-A1, ALLOC_DIAG_MODE: native}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: B, ALLOC_DIAG_VARIANT: C, ALLOC_DIAG_PASS: C-B1, ALLOC_DIAG_MODE: native}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: B, ALLOC_DIAG_VARIANT: C, ALLOC_DIAG_PASS: C-B2, ALLOC_DIAG_MODE: native}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: A, ALLOC_DIAG_VARIANT: C, ALLOC_DIAG_PASS: C-A2, ALLOC_DIAG_MODE: native}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: A, ALLOC_DIAG_VARIANT: I, ALLOC_DIAG_PASS: I-A1, ALLOC_DIAG_MODE: record}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: B, ALLOC_DIAG_VARIANT: I, ALLOC_DIAG_PASS: I-B1, ALLOC_DIAG_MODE: record}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: B, ALLOC_DIAG_VARIANT: I, ALLOC_DIAG_PASS: I-B2, ALLOC_DIAG_MODE: record}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: A, ALLOC_DIAG_VARIANT: I, ALLOC_DIAG_PASS: I-A2, ALLOC_DIAG_MODE: record}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: A, ALLOC_DIAG_VARIANT: I, ALLOC_DIAG_PASS: O-A-native, ALLOC_DIAG_MODE: empty-native}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: A, ALLOC_DIAG_VARIANT: I, ALLOC_DIAG_PASS: O-A-record, ALLOC_DIAG_MODE: empty-record}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: B, ALLOC_DIAG_VARIANT: I, ALLOC_DIAG_PASS: O-B-native, ALLOC_DIAG_MODE: empty-native}
      - task: record-pass
        vars: {ALLOC_DIAG_SIDE: B, ALLOC_DIAG_VARIANT: I, ALLOC_DIAG_PASS: O-B-record, ALLOC_DIAG_MODE: empty-record}
      - '"{{.ALLOC_DIAG_EVIDENCE}}/bench-report" allocation-diagnostic-run-bind "{{.ALLOC_DIAG_EVIDENCE}}"'
      - bash scripts/process-capture.sh '{{.ALLOC_DIAG_EVIDENCE}}/audit.status' '{{.ALLOC_DIAG_EVIDENCE}}/audit.log' '{{.ALLOC_DIAG_EVIDENCE}}/bench-report' allocation-diagnostic-audit '{{.ALLOC_DIAG_EVIDENCE}}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - bash scripts/process-status.sh '{{.ALLOC_DIAG_EVIDENCE}}/audit.status'

  dependency:
    cmds:
      - curl --fail --location --silent --show-error https://hackage-content.haskell.org/package/tasty-bench-0.4.1/tasty-bench-0.4.1.tar.gz -o '{{.ALLOC_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1.tar.gz'
      - curl --fail --location --silent --show-error https://hackage-content.haskell.org/package/tasty-bench-0.4.1/revision/1.cabal -o '{{.ALLOC_DIAG_EVIDENCE}}/dependency/revision-1.cabal'
      - |
        set -euo pipefail
        printf '%s  %s\n' 315c77e1f0f5fddf3b8465060867bb30c6d6562867b8609afdc7f6e14e295777 '{{.ALLOC_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1.tar.gz' c38a77747f14e8d26ca99869b879ee56099b04e5381a74a62255dcbab85aab84 '{{.ALLOC_DIAG_EVIDENCE}}/dependency/revision-1.cabal' | sha256sum --check
        tar -xzf '{{.ALLOC_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1.tar.gz' -C '{{.ALLOC_DIAG_EVIDENCE}}/dependency'
        tr -d '\r' < '{{.ALLOC_DIAG_EVIDENCE}}/dependency/revision-1.cabal' > '{{.ALLOC_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1/tasty-bench.cabal'
        patch --batch --fuzz=0 -d '{{.ALLOC_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1' -p1 < taskfiles/refactor-allocation/tasty-bench.patch
        mkdir -p '{{.ALLOC_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1/src/Test/Tasty/Bench'
        cp taskfiles/refactor-allocation/Diagnostic.hs '{{.ALLOC_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1/src/Test/Tasty/Bench/Diagnostic.hs'

  prepare:
    vars: &diagnostic
      ALLOC_DIAG_SOURCE: '{{if eq .ALLOC_DIAG_SIDE "A"}}{{.ALLOC_DIAG_BASELINE}}{{else}}{{.ALLOC_DIAG_CANDIDATE}}{{end}}'
      ALLOC_DIAG_SOURCE_DIR: '{{.ALLOC_DIAG_ROOT}}/source-{{.ALLOC_DIAG_VARIANT}}-{{.ALLOC_DIAG_SIDE}}'
      ALLOC_DIAG_BUILD_DIR: '{{.ALLOC_DIAG_EVIDENCE}}/build-{{.ALLOC_DIAG_VARIANT}}-{{.ALLOC_DIAG_SIDE}}'
      ALLOC_DIAG_PASS_DIR: '{{.ALLOC_DIAG_EVIDENCE}}/{{.ALLOC_DIAG_PASS}}'
    cmds:
      - git worktree add --detach '{{.ALLOC_DIAG_SOURCE_DIR}}' '{{.ALLOC_DIAG_SOURCE}}'
      - mkdir -p '{{.ALLOC_DIAG_BUILD_DIR}}/config'
      - |
        set -euo pipefail
        if [ '{{.ALLOC_DIAG_VARIANT}}' = I ]; then
          printf 'packages: %s\n' '{{.ALLOC_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1' > '{{.ALLOC_DIAG_SOURCE_DIR}}/cabal.project.local'
          cp '{{.ALLOC_DIAG_SOURCE_DIR}}/cabal.project.local' '{{.ALLOC_DIAG_BUILD_DIR}}/config/'
        fi
        cp '{{.ALLOC_DIAG_SOURCE_DIR}}/'{ecluse.cabal,cabal.project,cabal.project.freeze,flake.lock} '{{.ALLOC_DIAG_BUILD_DIR}}/config/'
      - bash scripts/process-capture.sh '{{.ALLOC_DIAG_BUILD_DIR}}/status' '{{.ALLOC_DIAG_BUILD_DIR}}/build.log' task --exit-code performance:allocation-diagnostics:build ALLOC_DIAG_SIDE={{.ALLOC_DIAG_SIDE}} ALLOC_DIAG_VARIANT={{.ALLOC_DIAG_VARIANT}}
      - bash scripts/process-status.sh '{{.ALLOC_DIAG_BUILD_DIR}}/status'
      - '"{{.ALLOC_DIAG_EVIDENCE}}/bench-report" allocation-diagnostic-build "{{.ALLOC_DIAG_EVIDENCE}}" "{{.ALLOC_DIAG_VARIANT}}-{{.ALLOC_DIAG_SIDE}}" "{{.ALLOC_DIAG_SOURCE}}"'

  build:
    vars: *diagnostic
    dir: '{{.ALLOC_DIAG_SOURCE_DIR}}'
    cmds:
      - git diff --exit-code HEAD
      - "printf '%s\\n' cabal build bench:ecluse-bench --enable-optimization=1 --disable-profiling > '{{.ALLOC_DIAG_BUILD_DIR}}/command.txt'"
      - cabal build bench:ecluse-bench --enable-optimization=1 --disable-profiling
      - cabal list-bin bench:ecluse-bench > '{{.ALLOC_DIAG_BUILD_DIR}}/binary-path.txt'
      - cp "$(cat '{{.ALLOC_DIAG_BUILD_DIR}}/binary-path.txt')" '{{.ALLOC_DIAG_BUILD_DIR}}/ecluse-bench'
      - task: snapshot
        vars: {ALLOC_DIAG_SIDE: '{{.ALLOC_DIAG_SIDE}}', ALLOC_DIAG_VARIANT: '{{.ALLOC_DIAG_VARIANT}}', ALLOC_DIAG_PASS: '{{.ALLOC_DIAG_PASS}}', ALLOC_DIAG_MODE: '{{.ALLOC_DIAG_MODE}}', ALLOC_DIAG_DEST: '{{.ALLOC_DIAG_BUILD_DIR}}/identity'}

  snapshot:
    vars: *diagnostic
    dir: '{{.ALLOC_DIAG_SOURCE_DIR}}'
    cmds:
      - mkdir '{{.ALLOC_DIAG_DEST}}'
      - |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = '{{.ALLOC_DIAG_SOURCE}}'
        git diff --exit-code HEAD
        git rev-parse HEAD HEAD^{tree} > '{{.ALLOC_DIAG_DEST}}/source.txt'
        git ls-files -z bench/corpus | sort -z | xargs -0 sha256sum > '{{.ALLOC_DIAG_DEST}}/corpus.sha256'
        sha256sum flake.lock cabal.project cabal.project.freeze > '{{.ALLOC_DIAG_DEST}}/locks.sha256'
        sha256sum ecluse.cabal > '{{.ALLOC_DIAG_DEST}}/cabal.sha256'
        if [ '{{.ALLOC_DIAG_VARIANT}}' = I ]; then
          sha256sum cabal.project.local > '{{.ALLOC_DIAG_DEST}}/project-local.sha256'
        else
          test ! -e cabal.project.local
          printf 'none\n' > '{{.ALLOC_DIAG_DEST}}/project-local.sha256'
        fi
        cp dist-newstyle/cache/plan.json '{{.ALLOC_DIAG_DEST}}/plan.json'
        sha256sum "$(cat '{{.ALLOC_DIAG_BUILD_DIR}}/binary-path.txt')" | cut -d ' ' -f 1 > '{{.ALLOC_DIAG_DEST}}/binary.sha256'
        ghc --version > '{{.ALLOC_DIAG_DEST}}/toolchain.txt'
        cabal --version >> '{{.ALLOC_DIAG_DEST}}/toolchain.txt'
        cd '{{.ALLOC_DIAG_EVIDENCE}}/dependency'
        find . -type f -print0 | sort -z | xargs -0 sha256sum > '{{.ALLOC_DIAG_DEST}}/dependency.sha256'

  record-pass:
    vars: *diagnostic
    cmds:
      - mkdir '{{.ALLOC_DIAG_PASS_DIR}}'
      - task: snapshot
        vars: {ALLOC_DIAG_SIDE: '{{.ALLOC_DIAG_SIDE}}', ALLOC_DIAG_VARIANT: '{{.ALLOC_DIAG_VARIANT}}', ALLOC_DIAG_PASS: '{{.ALLOC_DIAG_PASS}}', ALLOC_DIAG_MODE: '{{.ALLOC_DIAG_MODE}}', ALLOC_DIAG_DEST: '{{.ALLOC_DIAG_PASS_DIR}}/before'}
      - '"{{.ALLOC_DIAG_EVIDENCE}}/bench-report" allocation-diagnostic-conditions "{{.ALLOC_DIAG_EVIDENCE}}" "{{.ALLOC_DIAG_PASS}}"'
      - 'printf "%s start %s\n" "$(date --iso-8601=ns)" "{{.ALLOC_DIAG_PASS}}" >> "{{.ALLOC_DIAG_EVIDENCE}}/order.txt"'
      - bash scripts/process-capture.sh '{{.ALLOC_DIAG_PASS_DIR}}/measure.status' '{{.ALLOC_DIAG_PASS_DIR}}/measure.log' task --exit-code performance:allocation-diagnostics:measure ALLOC_DIAG_SIDE={{.ALLOC_DIAG_SIDE}} ALLOC_DIAG_VARIANT={{.ALLOC_DIAG_VARIANT}} ALLOC_DIAG_PASS={{.ALLOC_DIAG_PASS}} ALLOC_DIAG_MODE={{.ALLOC_DIAG_MODE}}
      - 'printf "%s end %s\n" "$(date --iso-8601=ns)" "{{.ALLOC_DIAG_PASS}}" >> "{{.ALLOC_DIAG_EVIDENCE}}/order.txt"'
      - task: snapshot
        vars: {ALLOC_DIAG_SIDE: '{{.ALLOC_DIAG_SIDE}}', ALLOC_DIAG_VARIANT: '{{.ALLOC_DIAG_VARIANT}}', ALLOC_DIAG_PASS: '{{.ALLOC_DIAG_PASS}}', ALLOC_DIAG_MODE: '{{.ALLOC_DIAG_MODE}}', ALLOC_DIAG_DEST: '{{.ALLOC_DIAG_PASS_DIR}}/after'}
      - '"{{.ALLOC_DIAG_EVIDENCE}}/bench-report" allocation-diagnostic-bind "{{.ALLOC_DIAG_EVIDENCE}}" "{{.ALLOC_DIAG_PASS}}"'

  measure:
    vars: *diagnostic
    dir: '{{.ALLOC_DIAG_SOURCE_DIR}}'
    env:
      ECLUSE_BATCH_MODE: '{{.ALLOC_DIAG_MODE}}'
      ECLUSE_BATCH_OUTPUT: '{{.ALLOC_DIAG_PASS_DIR}}/batches.csv'
    cmds:
      - |
        set -euo pipefail
        executable="$(cat '{{.ALLOC_DIAG_BUILD_DIR}}/binary-path.txt')"
        args=(--csv '{{.ALLOC_DIAG_PASS_DIR}}/native.csv' --stdev 10 -p '$0 == "{{.ALLOC_DIAG_REACT_ROW}}"' +RTS -T -RTS)
        printf '%s\n' "ECLUSE_BATCH_MODE=$ECLUSE_BATCH_MODE" "ECLUSE_BATCH_OUTPUT=$ECLUSE_BATCH_OUTPUT" "GHCRTS=${GHCRTS:-}" timeout=600 kill-after=30 > '{{.ALLOC_DIAG_PASS_DIR}}/environment.txt'
        printf '%s\n' "$executable" "${args[@]}" > '{{.ALLOC_DIAG_PASS_DIR}}/command.txt'
        bash '{{.ROOT_DIR}}/scripts/process-capture.sh' '{{.ALLOC_DIAG_PASS_DIR}}/native.status' '{{.ALLOC_DIAG_PASS_DIR}}/native.log' timeout --signal=TERM --kill-after=30s 10m "$executable" "${args[@]}"
        bash '{{.ROOT_DIR}}/scripts/process-status.sh' '{{.ALLOC_DIAG_PASS_DIR}}/native.status'

  format:
    cmds:
      - fourmolu --mode inplace {{.ALLOC_DIAG_HASKELL}}

  wiring-check:
    desc: Verify resolved diagnostic commands without executing target actions
    cmds:
      - bash scripts/refactor-allocation-wiring.test.sh

  static:
    desc: Check only the temporary diagnostic source and workflow wiring
    cmds:
      - fourmolu --mode check {{.ALLOC_DIAG_HASKELL}}
      - hlint bench/report/Main.hs bench/report/src/Ecluse/BenchReport/AllocationDiagnostic.hs bench/report/src/Ecluse/BenchReport/AllocationDiagnostic/*.hs taskfiles/refactor-allocation/Diagnostic.hs
      - actionlint .github/workflows/bench.yml
      - zizmor .github/workflows/bench.yml
      - bash scripts/ci-runner-policy.sh
      - shellcheck --severity=warning scripts/refactor-allocation-wiring.test.sh
      - task: wiring-check
