version: '3'
vars:
  COMPARISON_ROOT: '{{.ROOT_DIR}}/scratchpad/refactor-comparison'
  BASELINE: 690a4cd522f3146fc04ae42d6abac684a44a422c
  CANDIDATE: '{{env "REFRACTOR_CANDIDATE"}}'
  EVIDENCE: '{{.COMPARISON_ROOT}}/evidence'
  COMPARISON_HASKELL: bench/report/Main.hs bench/report/src/Ecluse/BenchReport/RefactorComparison.hs bench/report/src/Ecluse/BenchReport/RefactorInputs.hs bench/report/src/Ecluse/BenchReport/RefactorInputAudit.hs bench/report/src/Ecluse/BenchReport/RefactorInputControls.hs bench/report/src/Ecluse/BenchReport/RefactorMetrics.hs bench/report/src/Ecluse/BenchReport/RefactorFiles.hs bench/report/src/Ecluse/BenchReport/RefactorEvidence.hs bench/report/src/Ecluse/BenchReport/RefactorEvidenceControls.hs taskfiles/refactor-performance/listing/Main.hs taskfiles/refactor-performance/listing/Before.hs taskfiles/refactor-performance/listing/After.hs
tasks:
  run:
    desc: Run the temporary issue 1565 comparison on one ARM64 worker
    preconditions:
      - test "$(uname -m)" = aarch64
      - test -z "${GHCRTS:-}"
      - '[[ "$REFRACTOR_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]'
      - git cat-file -e "$REFRACTOR_CANDIDATE^{commit}"
      - test ! -e '{{.COMPARISON_ROOT}}'
    cmds:
      - mkdir -p '{{.EVIDENCE}}'
      - |
        set -euo pipefail
        git rev-parse HEAD HEAD^{tree} > '{{.EVIDENCE}}/controller.txt'
        printf '%s\n' "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" "runner=$RUNNER_NAME" "image=${ImageVersion:-unknown}" > '{{.EVIDENCE}}/worker.txt'
        uname -a >> '{{.EVIDENCE}}/worker.txt'
        lscpu >> '{{.EVIDENCE}}/worker.txt'
      - task: controller
      - '"$(cat ''{{.EVIDENCE}}/validator-path.txt'')" comparison-inputs ''{{.EVIDENCE}}/inputs'''
      - |
        set -euo pipefail
        "$(cat '{{.EVIDENCE}}/validator-path.txt')" conditions '{{.EVIDENCE}}/run.json' \
          run="$GITHUB_RUN_ID" attempt="$GITHUB_RUN_ATTEMPT" architecture="$(uname -m)" \
          runner="$RUNNER_NAME" image="${ImageVersion:-unknown}" \
          controllerSource="$(git rev-parse HEAD)" controllerTree="$(git rev-parse HEAD^{tree})" \
          sourceA='{{.BASELINE}}' treeA="$(git rev-parse '{{.BASELINE}}^{tree}')" \
          sourceB='{{.CANDIDATE}}' treeB="$(git rev-parse '{{.CANDIDATE}}^{tree}')"
      - task: prepare
        vars: {SIDE: A}
      - task: prepare
        vars: {SIDE: B}
      - cmp '{{.EVIDENCE}}/build-A/locks.sha256' '{{.EVIDENCE}}/build-B/locks.sha256'
      - cmp '{{.EVIDENCE}}/build-A/corpus.sha256' '{{.EVIDENCE}}/build-B/corpus.sha256'
      - task: record-pass
        vars: {SIDE: A, KIND: benchmark, PASS: A1}
      - task: record-pass
        vars: {SIDE: A, KIND: benchmark, PASS: A2}
      - task: record-pass
        vars: {SIDE: B, KIND: benchmark, PASS: B1}
      - task: record-pass
        vars: {SIDE: A, KIND: benchmark, PASS: A3}
      - task: record-pass
        vars: {SIDE: B, KIND: benchmark, PASS: B2}
      - task: record-pass
        vars: {SIDE: B, KIND: benchmark, PASS: B3}
      - task: record-pass
        vars: {SIDE: A, KIND: allocation, PASS: A1}
      - task: record-pass
        vars: {SIDE: B, KIND: allocation, PASS: B1}
      - task: record-pass
        vars: {SIDE: A, KIND: allocation, PASS: A2}
      - task: record-pass
        vars: {SIDE: B, KIND: allocation, PASS: B2}
      - task: record-pass
        vars: {SIDE: A, KIND: residency, PASS: A1}
      - task: record-pass
        vars: {SIDE: B, KIND: residency, PASS: B1}
      - task: record-pass
        vars: {SIDE: A, KIND: residency, PASS: A2}
      - task: record-pass
        vars: {SIDE: B, KIND: residency, PASS: B2}
      - task: record-pass
        vars: {SIDE: A, KIND: versions, PASS: A1}
      - task: record-pass
        vars: {SIDE: B, KIND: versions, PASS: B1}
      - task: record-pass
        vars: {SIDE: A, KIND: versions, PASS: A2}
      - task: record-pass
        vars: {SIDE: B, KIND: versions, PASS: B2}
      - task: listing-prepare
        vars: {SIDE: A}
      - task: listing-prepare
        vars: {SIDE: B}
      - task: record-pass
        vars: {SIDE: A, KIND: listing, PASS: A1}
      - task: record-pass
        vars: {SIDE: B, KIND: listing, PASS: B1}
      - task: record-pass
        vars: {SIDE: A, KIND: listing, PASS: A2}
      - task: record-pass
        vars: {SIDE: B, KIND: listing, PASS: B2}
      - |
        set -euo pipefail
        find '{{.EVIDENCE}}' -type f -name receipt.json -printf '%P\n' | sort > '{{.EVIDENCE}}/receipt-paths.txt'
        bash scripts/process-capture.sh '{{.EVIDENCE}}/comparison-audit.status' '{{.EVIDENCE}}/comparison-audit.log' \
          "$(cat '{{.EVIDENCE}}/validator-path.txt')" comparison-audit '{{.EVIDENCE}}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
          '{{.BASELINE}}' "$(git rev-parse '{{.BASELINE}}^{tree}')" '{{.CANDIDATE}}' "$(git rev-parse '{{.CANDIDATE}}^{tree}')" \
          taskfiles/refactor-performance/expected-rows.txt
      - |
        set -euo pipefail
        bash scripts/process-status.sh \
          '{{.EVIDENCE}}/comparison-audit.status' \
          '{{.EVIDENCE}}'/benchmark-{A1,A2,B1,A3,B2,B3}/pass.status \
          '{{.EVIDENCE}}'/allocation-{A1,B1,A2,B2}/pass.status \
          '{{.EVIDENCE}}'/residency-{A1,B1,A2,B2}/pass.status \
          '{{.EVIDENCE}}'/{versions,listing}-{A1,B1,A2,B2}/pass.status

  controller:
    cmds:
      - task: wiring-controls
      - bash scripts/process-capture.sh '{{.EVIDENCE}}/controller-build.status' '{{.EVIDENCE}}/controller-build.log' task --exit-code performance:reporter
      - bash scripts/process-status.sh '{{.EVIDENCE}}/controller-build.status'
      - cabal list-bin exe:bench-report > '{{.EVIDENCE}}/validator-path.txt'
      - |
        set -euo pipefail
        sha256sum "$(cat '{{.EVIDENCE}}/validator-path.txt')" taskfiles/refactor-performance/expected-rows.txt > '{{.EVIDENCE}}/validator.sha256'
        bash scripts/process-capture.sh '{{.EVIDENCE}}/controls.status' '{{.EVIDENCE}}/controls.log' \
          "$(cat '{{.EVIDENCE}}/validator-path.txt')" comparison-controls taskfiles/refactor-performance/expected-rows.txt
      - bash scripts/process-status.sh '{{.EVIDENCE}}/controls.status'

  prepare:
    vars: &comparison
      SOURCE: '{{if eq .SIDE "A"}}{{.BASELINE}}{{else}}{{.CANDIDATE}}{{end}}'
      SOURCE_DIR: '{{.COMPARISON_ROOT}}/source-{{.SIDE}}'
      PASS_DIR: '{{.EVIDENCE}}/{{.KIND}}-{{.PASS}}'
      LISTING_DIR: '{{.COMPARISON_ROOT}}/listing-{{.SIDE}}'
    cmds:
      - git worktree add --detach '{{.SOURCE_DIR}}' '{{.SOURCE}}'
      - mkdir -p '{{.EVIDENCE}}/build-{{.SIDE}}'
      - mkdir -p '{{.EVIDENCE}}/source-inputs-{{.SIDE}}/bench' '{{.EVIDENCE}}/source-inputs-{{.SIDE}}/acceptance'
      - cp -a '{{.SOURCE_DIR}}/bench/corpus' '{{.EVIDENCE}}/source-inputs-{{.SIDE}}/bench/'
      - cp '{{.SOURCE_DIR}}/acceptance/criteria.json' '{{.EVIDENCE}}/source-inputs-{{.SIDE}}/acceptance/'
      - bash scripts/process-capture.sh '{{.EVIDENCE}}/build-{{.SIDE}}/status' '{{.EVIDENCE}}/build-{{.SIDE}}/output.txt' task --exit-code performance:comparison:build SIDE={{.SIDE}}
      - bash scripts/process-status.sh '{{.EVIDENCE}}/build-{{.SIDE}}/status'

  verify-source:
    vars: *comparison
    dir: '{{.SOURCE_DIR}}'
    cmds:
      - test "$(git rev-parse HEAD)" = '{{.SOURCE}}'
      - test "$(git write-tree)" = "$(git rev-parse '{{.SOURCE}}^{tree}')"
      - git diff --exit-code HEAD
      - |
        set -euo pipefail
        git ls-files --others --exclude-standard | while IFS= read -r path; do
          case "$path" in
            bench-results.csv|bench-output.txt|perf-allocation-report.md|perf-allocation-observations.json) ;;
            *) printf 'Unexpected untracked file: %s\n' "$path" >&2; exit 1 ;;
          esac
        done

  build:
    vars: *comparison
    dir: '{{.SOURCE_DIR}}'
    cmds:
      - task: verify-source
      - test ! -d dist-newstyle
      - mkdir '{{.EVIDENCE}}/build-{{.SIDE}}/config'
      - cp ecluse.cabal cabal.project cabal.project.freeze flake.lock '{{.EVIDENCE}}/build-{{.SIDE}}/config/'
      - task --exit-code performance:reporter
      - cabal build bench:ecluse-bench --enable-optimization=1 --disable-profiling
      - cabal build exe:perf-acceptance --enable-optimization=1 --disable-profiling
      - cabal build test:ecluse-residency
      - task: identity
        vars: {IDENTITY_DIR: '{{.EVIDENCE}}/build-{{.SIDE}}'}

  identity:
    vars: *comparison
    dir: '{{.SOURCE_DIR}}'
    cmds:
      - mkdir -p '{{.IDENTITY_DIR}}'
      - |
        set -euo pipefail
        git rev-parse HEAD HEAD^{tree} > '{{.IDENTITY_DIR}}/source.txt'
        git ls-files -z bench/corpus | sort -z | xargs -0 sha256sum > '{{.IDENTITY_DIR}}/corpus.sha256'
        sha256sum flake.lock cabal.project cabal.project.freeze > '{{.IDENTITY_DIR}}/locks.sha256'
        cp dist-newstyle/cache/plan.json '{{.IDENTITY_DIR}}/plan.json'
        sha256sum dist-newstyle/cache/plan.json > '{{.IDENTITY_DIR}}/plan.sha256'
        for target in exe:bench-report bench:ecluse-bench exe:perf-acceptance test:ecluse-residency; do
          executable="$(cabal list-bin "$target")"
          sha256sum "$executable"
        done > '{{.IDENTITY_DIR}}/executables.sha256'
        ghc --version > '{{.IDENTITY_DIR}}/toolchain.txt'
        cabal --version >> '{{.IDENTITY_DIR}}/toolchain.txt'

  record-pass:
    vars: *comparison
    cmds:
      - mkdir '{{.PASS_DIR}}'
      - bash scripts/process-capture.sh '{{.PASS_DIR}}/conditions.status' '{{.PASS_DIR}}/conditions.log' "$(cat '{{.EVIDENCE}}/validator-path.txt')" comparison-pass-conditions '{{.EVIDENCE}}' '{{.KIND}}' '{{.PASS}}'
      - 'printf "%s start %s %s\n" "$(date --iso-8601=ns)" "{{.KIND}}" "{{.PASS}}" | tee -a "{{.PASS_DIR}}/events.txt" >> "{{.EVIDENCE}}/order.txt"'
      - bash scripts/process-capture.sh '{{.PASS_DIR}}/pass.status' '{{.PASS_DIR}}/pass.log' task --exit-code performance:comparison:pass SIDE={{.SIDE}} KIND={{.KIND}} PASS={{.PASS}}
      - 'printf "%s end %s %s status=%s\n" "$(date --iso-8601=ns)" "{{.KIND}}" "{{.PASS}}" "$(cat "{{.PASS_DIR}}/pass.status")" | tee -a "{{.PASS_DIR}}/events.txt" >> "{{.EVIDENCE}}/order.txt"'
      - bash scripts/process-capture.sh '{{.PASS_DIR}}/binding.status' '{{.PASS_DIR}}/binding.log' "$(cat '{{.EVIDENCE}}/validator-path.txt')" comparison-bind '{{.EVIDENCE}}' '{{.KIND}}' '{{.PASS}}'

  pass:
    vars: *comparison
    dir: '{{.SOURCE_DIR}}'
    cmds:
      - bash '{{.ROOT_DIR}}/scripts/process-status.sh' '{{.PASS_DIR}}/conditions.status'
      - task: verify-source
      - task: identity
        vars: {IDENTITY_DIR: '{{.PASS_DIR}}/before'}
      - cmp '{{.EVIDENCE}}/build-{{.SIDE}}/executables.sha256' '{{.PASS_DIR}}/before/executables.sha256'
      - task: '{{if eq .KIND "residency"}}residency{{else if or (eq .KIND "versions") (eq .KIND "listing")}}probes{{else}}measure{{end}}'
      - task: identity
        vars: {IDENTITY_DIR: '{{.PASS_DIR}}/after'}
      - task: verify-source
      - cmp '{{.PASS_DIR}}/before/executables.sha256' '{{.PASS_DIR}}/after/executables.sha256'
      - |
        set -euo pipefail
        {{if or (eq .KIND "benchmark") (eq .KIND "allocation")}}
        test -s '{{.PASS_DIR}}/receipts/ecosystem-npm/receipt.json'
        test -s '{{.PASS_DIR}}/receipts/ecosystem-pypi/receipt.json'
        {{end}}
        bash scripts/process-status.sh '{{.PASS_DIR}}/measure.status' '{{.PASS_DIR}}/audit.status'

  measure:
    vars: *comparison
    dir: '{{.SOURCE_DIR}}'
    cmds:
      - bash scripts/process-capture.sh '{{.PASS_DIR}}/measure.status' '{{.PASS_DIR}}/measure.log' env ECLTEST_SOURCE='{{.SOURCE}}' ECLTEST_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-{{.KIND}}-{{.PASS}}" task --exit-code performance:{{.KIND}}-measure PERF_ARTIFACT_DIR='{{.PASS_DIR}}/receipts'
      - |
        set -euo pipefail
        outcome=failure
        if [ "$(cat '{{.PASS_DIR}}/measure.status')" = 0 ]; then outcome=success; fi
        bash scripts/process-capture.sh '{{.PASS_DIR}}/audit.status' '{{.PASS_DIR}}/audit.log' \
          env PERF_NATIVE_OUTCOME="$outcome" ECLTEST_SOURCE='{{.SOURCE}}' ECLTEST_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-{{.KIND}}-{{.PASS}}" task --exit-code performance:{{.KIND}}-receipt PERF_ARTIFACT_DIR='{{.PASS_DIR}}/receipts'
      - |
        set -euo pipefail
        for path in {{if eq .KIND "benchmark"}}bench-results.csv bench-output.txt{{else}}perf-allocation-report.md perf-allocation-observations.json{{end}}; do
          if [ -f "$path" ]; then cp "$path" '{{.PASS_DIR}}/'; fi
        done

  residency:
    vars: *comparison
    dir: '{{.SOURCE_DIR}}'
    cmds:
      - bash scripts/process-capture.sh '{{.PASS_DIR}}/measure.status' '{{.PASS_DIR}}/measure.log' task --exit-code test-residency
      - cp '{{.PASS_DIR}}/measure.status' '{{.PASS_DIR}}/audit.status'
      - find dist-newstyle -type f -path '*/test/*.log' -exec cp --parents '{}' '{{.PASS_DIR}}/' \;

  listing-prepare:
    vars: *comparison
    cmds:
      - git worktree add --detach '{{.LISTING_DIR}}' '{{.SOURCE}}'
      - mkdir -p '{{.EVIDENCE}}/listing-build-{{.SIDE}}'
      - cp taskfiles/refactor-performance/listing/Main.hs '{{.LISTING_DIR}}/test/residency/Main.hs'
      - cp 'taskfiles/refactor-performance/listing/{{if eq .SIDE "A"}}Before{{else}}After{{end}}.hs' '{{.LISTING_DIR}}/test/residency/ListingAdapter.hs'
      - |
        sed -i '/^test-suite ecluse-residency$/,/^  build-depends:/{
          /^  other-modules:$/a\    ListingAdapter
        }' '{{.LISTING_DIR}}/ecluse.cabal'
      - |
        set -euo pipefail
        git -C '{{.LISTING_DIR}}' diff --binary HEAD > '{{.EVIDENCE}}/listing-build-{{.SIDE}}/overlay.patch'
        cp '{{.LISTING_DIR}}/test/residency/ListingAdapter.hs' '{{.EVIDENCE}}/listing-build-{{.SIDE}}/ListingAdapter.hs'
        cp '{{.LISTING_DIR}}/test/residency/Main.hs' '{{.EVIDENCE}}/listing-build-{{.SIDE}}/Main.hs'
        sha256sum '{{.LISTING_DIR}}'/test/residency/{Main,ListingAdapter}.hs > '{{.EVIDENCE}}/listing-build-{{.SIDE}}/overlay.sha256'
        git -C '{{.LISTING_DIR}}' rev-parse HEAD HEAD^{tree} > '{{.EVIDENCE}}/listing-build-{{.SIDE}}/source.txt'
      - bash scripts/process-capture.sh '{{.EVIDENCE}}/listing-build-{{.SIDE}}/status' '{{.EVIDENCE}}/listing-build-{{.SIDE}}/output.txt' task --exit-code performance:comparison:listing-build SIDE={{.SIDE}}

  listing-build:
    vars: *comparison
    dir: '{{.LISTING_DIR}}'
    cmds:
      - test ! -d dist-newstyle
      - cabal build test:ecluse-residency
      - cabal list-bin test:ecluse-residency > '{{.EVIDENCE}}/listing-build-{{.SIDE}}/executable.txt'
      - cp dist-newstyle/cache/plan.json '{{.EVIDENCE}}/listing-build-{{.SIDE}}/plan.json'
      - sha256sum "$(cat '{{.EVIDENCE}}/listing-build-{{.SIDE}}/executable.txt')" > '{{.EVIDENCE}}/listing-build-{{.SIDE}}/executable.sha256'

  probes:
    vars: *comparison
    dir: '{{.SOURCE_DIR}}'
    cmds:
      - bash '{{.ROOT_DIR}}/scripts/process-capture.sh' '{{.PASS_DIR}}/measure.status' '{{.PASS_DIR}}/measure.log' task --dir '{{.ROOT_DIR}}' --exit-code performance:comparison:{{.KIND}}-measure SIDE={{.SIDE}} KIND={{.KIND}} PASS={{.PASS}}
      - cp '{{.PASS_DIR}}/measure.status' '{{.PASS_DIR}}/audit.status'

  versions-measure:
    vars: *comparison
    dir: '{{.SOURCE_DIR}}'
    cmds:
      - |
        set -euo pipefail
        executable="$(cabal list-bin test:ecluse-residency)"
        while IFS=$'\t' read -r input package version path; do
          bash '{{.ROOT_DIR}}/scripts/process-capture.sh' "{{.PASS_DIR}}/$input.status" "{{.PASS_DIR}}/$input.json" \
            /usr/bin/time -f '%M' -o "{{.PASS_DIR}}/$input.rss" "$executable" \
            --metadata-source-probe npm StreamedVersions "$package" "$version" 134217728 "$path" +RTS -N1 -A4m -T -RTS
        done < '{{.EVIDENCE}}/inputs/versions.tsv'
        bash '{{.ROOT_DIR}}/scripts/process-status.sh' '{{.PASS_DIR}}'/*.status

  listing-measure:
    vars: *comparison
    dir: '{{.LISTING_DIR}}'
    cmds:
      - bash '{{.ROOT_DIR}}/scripts/process-status.sh' '{{.EVIDENCE}}/listing-build-{{.SIDE}}/status'
      - test "$(git rev-parse HEAD)" = '{{.SOURCE}}'
      - git diff --binary HEAD > '{{.PASS_DIR}}/overlay.patch'
      - cmp '{{.EVIDENCE}}/listing-build-{{.SIDE}}/overlay.patch' '{{.PASS_DIR}}/overlay.patch'
      - sha256sum --check '{{.EVIDENCE}}/listing-build-{{.SIDE}}/overlay.sha256'
      - sha256sum --check '{{.EVIDENCE}}/listing-build-{{.SIDE}}/executable.sha256'
      - sha256sum "$(cat '{{.EVIDENCE}}/listing-build-{{.SIDE}}/executable.txt')" > '{{.PASS_DIR}}/listing-before.sha256'
      - |
        set -euo pipefail
        executable="$(cat '{{.EVIDENCE}}/listing-build-{{.SIDE}}/executable.txt')"
        for input in small large; do
          bash '{{.ROOT_DIR}}/scripts/process-capture.sh' "{{.PASS_DIR}}/$input.status" "{{.PASS_DIR}}/$input.json" \
            /usr/bin/time -f '%M' -o "{{.PASS_DIR}}/$input.rss" "$executable" \
            "{{.EVIDENCE}}/inputs/$input.json" "{{.EVIDENCE}}/inputs/$input.expected" +RTS -N1 -A4m -T -RTS
        done
        bash '{{.ROOT_DIR}}/scripts/process-status.sh' '{{.PASS_DIR}}'/*.status
      - sha256sum --check '{{.EVIDENCE}}/listing-build-{{.SIDE}}/executable.sha256'
      - sha256sum "$(cat '{{.EVIDENCE}}/listing-build-{{.SIDE}}/executable.txt')" > '{{.PASS_DIR}}/listing-after.sha256'
      - git diff --binary HEAD > '{{.PASS_DIR}}/overlay-after.patch'
      - cmp '{{.PASS_DIR}}/overlay.patch' '{{.PASS_DIR}}/overlay-after.patch'
      - sha256sum --check '{{.EVIDENCE}}/listing-build-{{.SIDE}}/overlay.sha256'

  format:
    cmds:
      - hlint {{.COMPARISON_HASKELL}}
      - fourmolu --mode inplace {{.COMPARISON_HASKELL}}

  wiring-controls:
    cmds:
      - |
        set -euo pipefail
        mkdir -p scratchpad
        trial_dir="$(mktemp -d scratchpad/refactor-wiring.XXXXXX)"
        cp ecluse.cabal "$trial_dir/original.cabal"
        sed '/^test-suite ecluse-residency$/,/^  build-depends:/{
          /^  other-modules:$/a\    ListingAdapter
        }' "$trial_dir/original.cabal" > "$trial_dir/overlay.cabal"
        test "$(grep -c '^    ListingAdapter$' "$trial_dir/overlay.cabal")" = 1
        sed '/^    ListingAdapter$/d' "$trial_dir/overlay.cabal" > "$trial_dir/restored.cabal"
        cmp "$trial_dir/original.cabal" "$trial_dir/restored.cabal"
        bash scripts/process-capture.sh "$trial_dir/failed.status" "$trial_dir/failed.log" bash -c 'printf "retained failure output\n"; exit 7'
        test "$(cat "$trial_dir/failed.status")" = 7
        test "$(cat "$trial_dir/failed.log")" = 'retained failure output'
        if bash scripts/process-status.sh "$trial_dir/failed.status"; then exit 1; fi
        printf 'comparison wiring controls passed\n'

  lint:
    cmds:
      - hlint {{.COMPARISON_HASKELL}}
      - fourmolu --mode check {{.COMPARISON_HASKELL}}
      - actionlint .github/workflows/bench.yml
      - zizmor .github/workflows/bench.yml
      - task --dry performance:comparison:record-pass SIDE=A KIND=benchmark PASS=A1
      - task --dry performance:comparison:pass SIDE=A KIND=benchmark PASS=A1 SOURCE_DIR='{{.ROOT_DIR}}'
      - task --dry performance:comparison:pass SIDE=B KIND=allocation PASS=B1 SOURCE_DIR='{{.ROOT_DIR}}'
      - task --dry performance:comparison:pass SIDE=B KIND=residency PASS=B1 SOURCE_DIR='{{.ROOT_DIR}}'
      - task --dry performance:comparison:pass SIDE=A KIND=versions PASS=A1 SOURCE_DIR='{{.ROOT_DIR}}'
      - task --dry performance:comparison:pass SIDE=B KIND=listing PASS=B1 SOURCE_DIR='{{.ROOT_DIR}}' LISTING_DIR='{{.ROOT_DIR}}'
      - task --dry performance:comparison:listing-prepare SIDE=B
      - task --dry performance:comparison:versions-measure SIDE=A KIND=versions PASS=A1 SOURCE_DIR='{{.ROOT_DIR}}'
      - task --dry performance:comparison:listing-measure SIDE=B KIND=listing PASS=B1 LISTING_DIR='{{.ROOT_DIR}}'
