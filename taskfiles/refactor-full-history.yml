version: '3'
vars:
  FULL_DIAG_ROOT: '{{.ROOT_DIR}}/scratchpad/refactor-full-history'
  FULL_DIAG_EVIDENCE: '{{.FULL_DIAG_ROOT}}/evidence'
  FULL_DIAG_BASELINE: 690a4cd522f3146fc04ae42d6abac684a44a422c
  FULL_DIAG_CANDIDATE: ab5f4af6e55b90ae79392f3d10a9505295f1239f
  FULL_DIAG_REACT_ROW: 'All.ecluse-core (work-per-request).ecosystem: npm.single-version metadata (per package).react (large).selective decode'
  FULL_DIAG_HASKELL: bench/report/Main.hs bench/report/src/Ecluse/BenchReport/AllocationDiagnostic.hs bench/report/src/Ecluse/BenchReport/AllocationDiagnostic/*.hs bench/report/src/Ecluse/BenchReport/FullHistory/*.hs taskfiles/refactor-full-history/*.hs
tasks:
  run:
    desc: Run the temporary React allocation diagnostic on one ARM64 worker
    preconditions:
      - test "$(uname -m)" = aarch64
      - test -z "${GHCRTS:-}"
      - test ! -e '{{.FULL_DIAG_ROOT}}'
      - test "$GITHUB_REF" = refs/heads/measure/refactor-full-history
    cmds:
      - mkdir -p '{{.FULL_DIAG_EVIDENCE}}/dependency' '{{.FULL_DIAG_EVIDENCE}}/inputs'
      - |
        set -euo pipefail
        git rev-parse HEAD HEAD^{tree} > '{{.FULL_DIAG_EVIDENCE}}/controller.txt'
        git archive HEAD | gzip > '{{.FULL_DIAG_EVIDENCE}}/controller-source.tar.gz'
        printf '%s\n' "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" "runner=$RUNNER_NAME" "image=${ImageVersion:-unknown}" > '{{.FULL_DIAG_EVIDENCE}}/worker.txt'
        uname -a >> '{{.FULL_DIAG_EVIDENCE}}/worker.txt'
        lscpu >> '{{.FULL_DIAG_EVIDENCE}}/worker.txt'
        git archive '{{.FULL_DIAG_BASELINE}}' | gzip > '{{.FULL_DIAG_EVIDENCE}}/source-A.tar.gz'
        git archive '{{.FULL_DIAG_CANDIDATE}}' | gzip > '{{.FULL_DIAG_EVIDENCE}}/source-B.tar.gz'
        cp -a taskfiles/refactor-full-history '{{.FULL_DIAG_EVIDENCE}}/overlay'
        cp taskfiles/refactor-full-history.yml '{{.FULL_DIAG_EVIDENCE}}/overlay/controller-task.yml'
        cp .github/workflows/bench.yml '{{.FULL_DIAG_EVIDENCE}}/overlay/controller-workflow.yml'
      - "printf '%s\\n' cabal build exe:bench-report > '{{.FULL_DIAG_EVIDENCE}}/controller-command.txt'"
      - bash scripts/process-capture.sh '{{.FULL_DIAG_EVIDENCE}}/controller-build.status' '{{.FULL_DIAG_EVIDENCE}}/controller-build.log' cabal build exe:bench-report
      - bash scripts/process-status.sh '{{.FULL_DIAG_EVIDENCE}}/controller-build.status'
      - cabal list-bin exe:bench-report > '{{.FULL_DIAG_EVIDENCE}}/reporter-path.txt'
      - cp "$(cat '{{.FULL_DIAG_EVIDENCE}}/reporter-path.txt')" '{{.FULL_DIAG_EVIDENCE}}/bench-report'
      - task: dependency
      - bash scripts/process-capture.sh '{{.FULL_DIAG_EVIDENCE}}/overlay/source-audit.status' '{{.FULL_DIAG_EVIDENCE}}/overlay/source-audit.log' '{{.FULL_DIAG_EVIDENCE}}/bench-report' full-history-source-audit '{{.FULL_DIAG_EVIDENCE}}' "$RUNNER_NAME" "$GITHUB_SHA"
      - bash scripts/process-status.sh '{{.FULL_DIAG_EVIDENCE}}/overlay/source-audit.status'
      - task: prepare
        vars: {FULL_DIAG_SIDE: A, FULL_DIAG_VARIANT: C}
      - task: prepare
        vars: {FULL_DIAG_SIDE: B, FULL_DIAG_VARIANT: C}
      - task: prepare
        vars: {FULL_DIAG_SIDE: A, FULL_DIAG_VARIANT: I}
      - task: prepare
        vars: {FULL_DIAG_SIDE: B, FULL_DIAG_VARIANT: I}
      - cmp '{{.FULL_DIAG_EVIDENCE}}/build-C-A/identity/corpus.sha256' '{{.FULL_DIAG_EVIDENCE}}/build-C-B/identity/corpus.sha256'
      - cmp '{{.FULL_DIAG_EVIDENCE}}/build-C-A/identity/locks.sha256' '{{.FULL_DIAG_EVIDENCE}}/build-C-B/identity/locks.sha256'
      - cp -a '{{.FULL_DIAG_ROOT}}/source-C-A/bench/corpus' '{{.FULL_DIAG_EVIDENCE}}/inputs/'
      - bash scripts/process-capture.sh '{{.FULL_DIAG_EVIDENCE}}/controls.status' '{{.FULL_DIAG_EVIDENCE}}/controls.log' '{{.FULL_DIAG_EVIDENCE}}/bench-report' full-history-controls '{{.FULL_DIAG_EVIDENCE}}'
      - bash scripts/process-status.sh '{{.FULL_DIAG_EVIDENCE}}/controls.status'
      - task: record-pass
        vars: {FULL_DIAG_SIDE: A, FULL_DIAG_VARIANT: C, FULL_DIAG_PASS: C-A1, FULL_DIAG_MODE: native}
      - task: record-pass
        vars: {FULL_DIAG_SIDE: B, FULL_DIAG_VARIANT: C, FULL_DIAG_PASS: C-B1, FULL_DIAG_MODE: native}
      - task: record-pass
        vars: {FULL_DIAG_SIDE: B, FULL_DIAG_VARIANT: I, FULL_DIAG_PASS: M-B1, FULL_DIAG_MODE: marker-only}
      - task: record-pass
        vars: {FULL_DIAG_SIDE: A, FULL_DIAG_VARIANT: I, FULL_DIAG_PASS: M-A1, FULL_DIAG_MODE: marker-only}
      - task: record-pass
        vars: {FULL_DIAG_SIDE: A, FULL_DIAG_VARIANT: I, FULL_DIAG_PASS: I-A1, FULL_DIAG_MODE: record}
      - task: record-pass
        vars: {FULL_DIAG_SIDE: B, FULL_DIAG_VARIANT: I, FULL_DIAG_PASS: I-B1, FULL_DIAG_MODE: record}
      - task: record-pass
        vars: {FULL_DIAG_SIDE: B, FULL_DIAG_VARIANT: I, FULL_DIAG_PASS: I-B2, FULL_DIAG_MODE: record}
      - task: record-pass
        vars: {FULL_DIAG_SIDE: A, FULL_DIAG_VARIANT: I, FULL_DIAG_PASS: I-A2, FULL_DIAG_MODE: record}
      - '"{{.FULL_DIAG_EVIDENCE}}/bench-report" full-history-run-bind "{{.FULL_DIAG_EVIDENCE}}"'
      - bash scripts/process-capture.sh '{{.FULL_DIAG_EVIDENCE}}/audit.status' '{{.FULL_DIAG_EVIDENCE}}/audit.log' '{{.FULL_DIAG_EVIDENCE}}/bench-report' full-history-audit '{{.FULL_DIAG_EVIDENCE}}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME" "$GITHUB_SHA"
      - bash scripts/process-status.sh '{{.FULL_DIAG_EVIDENCE}}/audit.status'

  dependency:
    cmds:
      - curl --fail --location --silent --show-error https://hackage-content.haskell.org/package/tasty-bench-0.4.1/tasty-bench-0.4.1.tar.gz -o '{{.FULL_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1.tar.gz'
      - curl --fail --location --silent --show-error https://hackage-content.haskell.org/package/tasty-bench-0.4.1/revision/1.cabal -o '{{.FULL_DIAG_EVIDENCE}}/dependency/revision-1.cabal'
      - |
        set -euo pipefail
        printf '%s  %s\n' 315c77e1f0f5fddf3b8465060867bb30c6d6562867b8609afdc7f6e14e295777 '{{.FULL_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1.tar.gz' c38a77747f14e8d26ca99869b879ee56099b04e5381a74a62255dcbab85aab84 '{{.FULL_DIAG_EVIDENCE}}/dependency/revision-1.cabal' | sha256sum --check
        tar -xzf '{{.FULL_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1.tar.gz' -C '{{.FULL_DIAG_EVIDENCE}}/dependency'
        tr -d '\r' < '{{.FULL_DIAG_EVIDENCE}}/dependency/revision-1.cabal' > '{{.FULL_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1/tasty-bench.cabal'
        patch --batch --fuzz=0 -d '{{.FULL_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1' -p1 < taskfiles/refactor-full-history/tasty-bench.patch
        mkdir -p '{{.FULL_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1/src/Test/Tasty/Bench'
        cp taskfiles/refactor-full-history/{Diagnostic,FullHistory}.hs '{{.FULL_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1/src/Test/Tasty/Bench/'

  prepare:
    vars: &diagnostic
      FULL_DIAG_SOURCE: '{{if eq .FULL_DIAG_SIDE "A"}}{{.FULL_DIAG_BASELINE}}{{else}}{{.FULL_DIAG_CANDIDATE}}{{end}}'
      FULL_DIAG_SOURCE_DIR: '{{.FULL_DIAG_ROOT}}/source-{{.FULL_DIAG_VARIANT}}-{{.FULL_DIAG_SIDE}}'
      FULL_DIAG_BUILD_DIR: '{{.FULL_DIAG_EVIDENCE}}/build-{{.FULL_DIAG_VARIANT}}-{{.FULL_DIAG_SIDE}}'
      FULL_DIAG_PASS_DIR: '{{.FULL_DIAG_EVIDENCE}}/{{.FULL_DIAG_PASS}}'
    cmds:
      - git worktree add --detach '{{.FULL_DIAG_SOURCE_DIR}}' '{{.FULL_DIAG_SOURCE}}'
      - mkdir -p '{{.FULL_DIAG_BUILD_DIR}}/config'
      - |
        set -euo pipefail
        if [ '{{.FULL_DIAG_VARIANT}}' = I ]; then
          printf 'packages: %s\n' '{{.FULL_DIAG_EVIDENCE}}/dependency/tasty-bench-0.4.1' > '{{.FULL_DIAG_SOURCE_DIR}}/cabal.project.local'
          cp '{{.FULL_DIAG_SOURCE_DIR}}/cabal.project.local' '{{.FULL_DIAG_BUILD_DIR}}/config/'
        fi
        cp '{{.FULL_DIAG_SOURCE_DIR}}/'{ecluse.cabal,cabal.project,cabal.project.freeze,flake.lock} '{{.FULL_DIAG_BUILD_DIR}}/config/'
      - bash scripts/process-capture.sh '{{.FULL_DIAG_BUILD_DIR}}/status' '{{.FULL_DIAG_BUILD_DIR}}/build.log' task --exit-code performance:full-history-diagnostic:build FULL_DIAG_SIDE={{.FULL_DIAG_SIDE}} FULL_DIAG_VARIANT={{.FULL_DIAG_VARIANT}}
      - bash scripts/process-status.sh '{{.FULL_DIAG_BUILD_DIR}}/status'
      - '"{{.FULL_DIAG_EVIDENCE}}/bench-report" full-history-build "{{.FULL_DIAG_EVIDENCE}}" "{{.FULL_DIAG_VARIANT}}-{{.FULL_DIAG_SIDE}}" "{{.FULL_DIAG_SOURCE}}"'

  build:
    vars: *diagnostic
    dir: '{{.FULL_DIAG_SOURCE_DIR}}'
    cmds:
      - git diff --exit-code HEAD
      - "printf '%s\\n' cabal build bench:ecluse-bench --enable-optimization=1 --disable-profiling > '{{.FULL_DIAG_BUILD_DIR}}/command.txt'"
      - cabal build bench:ecluse-bench --enable-optimization=1 --disable-profiling
      - cabal list-bin bench:ecluse-bench > '{{.FULL_DIAG_BUILD_DIR}}/binary-path.txt'
      - cp "$(cat '{{.FULL_DIAG_BUILD_DIR}}/binary-path.txt')" '{{.FULL_DIAG_BUILD_DIR}}/ecluse-bench'
      - task: snapshot
        vars: {FULL_DIAG_SIDE: '{{.FULL_DIAG_SIDE}}', FULL_DIAG_VARIANT: '{{.FULL_DIAG_VARIANT}}', FULL_DIAG_PASS: '{{.FULL_DIAG_PASS}}', FULL_DIAG_MODE: '{{.FULL_DIAG_MODE}}', FULL_DIAG_DEST: '{{.FULL_DIAG_BUILD_DIR}}/identity'}

  snapshot:
    vars: *diagnostic
    dir: '{{.FULL_DIAG_SOURCE_DIR}}'
    cmds:
      - mkdir '{{.FULL_DIAG_DEST}}'
      - |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = '{{.FULL_DIAG_SOURCE}}'
        git diff --exit-code HEAD
        git rev-parse HEAD HEAD^{tree} > '{{.FULL_DIAG_DEST}}/source.txt'
        git ls-files -z bench/corpus | sort -z | xargs -0 sha256sum > '{{.FULL_DIAG_DEST}}/corpus.sha256'
        sha256sum flake.lock cabal.project cabal.project.freeze > '{{.FULL_DIAG_DEST}}/locks.sha256'
        sha256sum ecluse.cabal > '{{.FULL_DIAG_DEST}}/cabal.sha256'
        if [ '{{.FULL_DIAG_VARIANT}}' = I ]; then
          sha256sum cabal.project.local > '{{.FULL_DIAG_DEST}}/project-local.sha256'
        else
          test ! -e cabal.project.local
          printf 'none\n' > '{{.FULL_DIAG_DEST}}/project-local.sha256'
        fi
        cp dist-newstyle/cache/plan.json '{{.FULL_DIAG_DEST}}/plan.json'
        sha256sum "$(cat '{{.FULL_DIAG_BUILD_DIR}}/binary-path.txt')" | cut -d ' ' -f 1 > '{{.FULL_DIAG_DEST}}/binary.sha256'
        ghc --version > '{{.FULL_DIAG_DEST}}/toolchain.txt'
        cabal --version >> '{{.FULL_DIAG_DEST}}/toolchain.txt'
        cd '{{.FULL_DIAG_EVIDENCE}}/dependency'
        find . -type f -print0 | sort -z | xargs -0 sha256sum > '{{.FULL_DIAG_DEST}}/dependency.sha256'

  record-pass:
    vars: *diagnostic
    cmds:
      - mkdir '{{.FULL_DIAG_PASS_DIR}}'
      - task: snapshot
        vars: {FULL_DIAG_SIDE: '{{.FULL_DIAG_SIDE}}', FULL_DIAG_VARIANT: '{{.FULL_DIAG_VARIANT}}', FULL_DIAG_PASS: '{{.FULL_DIAG_PASS}}', FULL_DIAG_MODE: '{{.FULL_DIAG_MODE}}', FULL_DIAG_DEST: '{{.FULL_DIAG_PASS_DIR}}/before'}
      - '"{{.FULL_DIAG_EVIDENCE}}/bench-report" full-history-conditions "{{.FULL_DIAG_EVIDENCE}}" "{{.FULL_DIAG_PASS}}"'
      - 'printf "%s start %s\n" "$(date --iso-8601=ns)" "{{.FULL_DIAG_PASS}}" >> "{{.FULL_DIAG_EVIDENCE}}/order.txt"'
      - bash scripts/process-capture.sh '{{.FULL_DIAG_PASS_DIR}}/measure.status' '{{.FULL_DIAG_PASS_DIR}}/measure.log' task --exit-code performance:full-history-diagnostic:measure FULL_DIAG_SIDE={{.FULL_DIAG_SIDE}} FULL_DIAG_VARIANT={{.FULL_DIAG_VARIANT}} FULL_DIAG_PASS={{.FULL_DIAG_PASS}} FULL_DIAG_MODE={{.FULL_DIAG_MODE}}
      - 'printf "%s end %s\n" "$(date --iso-8601=ns)" "{{.FULL_DIAG_PASS}}" >> "{{.FULL_DIAG_EVIDENCE}}/order.txt"'
      - task: snapshot
        vars: {FULL_DIAG_SIDE: '{{.FULL_DIAG_SIDE}}', FULL_DIAG_VARIANT: '{{.FULL_DIAG_VARIANT}}', FULL_DIAG_PASS: '{{.FULL_DIAG_PASS}}', FULL_DIAG_MODE: '{{.FULL_DIAG_MODE}}', FULL_DIAG_DEST: '{{.FULL_DIAG_PASS_DIR}}/after'}
      - '"{{.FULL_DIAG_EVIDENCE}}/bench-report" full-history-bind "{{.FULL_DIAG_EVIDENCE}}" "{{.FULL_DIAG_PASS}}"'

  measure:
    vars: *diagnostic
    dir: '{{.FULL_DIAG_SOURCE_DIR}}'
    cmds:
      - bash '{{.ROOT_DIR}}/scripts/full-history-measure.sh' '{{.ROOT_DIR}}' '{{.FULL_DIAG_EVIDENCE}}' '{{.FULL_DIAG_BUILD_DIR}}' '{{.FULL_DIAG_PASS_DIR}}' '{{.FULL_DIAG_MODE}}'

  format:
    cmds:
      - fourmolu --mode inplace {{.FULL_DIAG_HASKELL}}

  wiring-check:
    desc: Verify resolved diagnostic commands without executing target actions
    cmds:
      - bash scripts/refactor-full-history-wiring.test.sh

  static:
    desc: Check only the temporary diagnostic source and workflow wiring
    cmds:
      - hlint {{.FULL_DIAG_HASKELL}}
      - fourmolu --mode check {{.FULL_DIAG_HASKELL}}
      - actionlint .github/workflows/bench.yml
      - zizmor .github/workflows/bench.yml
      - bash scripts/ci-runner-policy.sh
      - shellcheck --severity=warning scripts/refactor-full-history-wiring.test.sh scripts/refactor-allocation-wiring.test.sh scripts/refactor-diagnostic-wiring.sh scripts/full-history-measure.sh scripts/full-history-measure.test.sh
      - task: wiring-check
      - bash scripts/refactor-allocation-wiring.test.sh
      - bash scripts/full-history-measure.test.sh
