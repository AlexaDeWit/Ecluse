version: '3'
includes:
  test: taskfiles/test.yml
  coverage: taskfiles/coverage.yml
  performance: taskfiles/performance.yml
  datadog: taskfiles/datadog.yml
vars:
  DOCS_BUILDDIR: dist-newstyle
  BENCH_PROFILE_DIR: dist-bench-prof
  SUITE: ecluse-unit
  COVERAGE_FLAGS: -fdev-http-egress
  HADDOCK_FLAGS: --haddock-hyperlink-source --haddock-quickjump
  NIX_BENCH: '{{if env "IN_NIX_SHELL"}}{{else}}nix develop ".#ci" --command{{end}}'
tasks:
  default:
    cmds:
      - task --list
  version:
    desc: Print the release version (ecluse.cabal `version:`)
    silent: true
    cmds:
      - |
        v="$(cabal info ./ecluse.cabal 2>/dev/null | sed -n -E 's/^\* ecluse-([0-9.]+).*/\1/p' | head -n1)"
        [ -n "$v" ] && echo "$v" || { echo "task version: could not read from 'cabal info'" >&2; exit 1; }
  release-validate-version:
    desc: Check the release version and write canonical tags to GITHUB_OUTPUT
    silent: true
    cmds:
      - bash scripts/release-gate.sh "$(task version)" "$GITHUB_OUTPUT"
  tag:
    desc: Create the signed tag from the cabal version (RELEASE_TAG=/RELEASE_COMMIT= override it)
    silent: true
    # go-task also resolves a template variable from the ambient environment, so these
    # carry a RELEASE_ prefix. A bare TAG= would let a stray exported TAG retag a release.
    env:
      RELEASE_TAG: '{{.RELEASE_TAG}}'
      RELEASE_COMMIT: '{{.RELEASE_COMMIT}}'
    cmds:
      - |
        # A candidate tags vX.Y.Z-rc.N while the cabal field stays X.Y.Z, so the tag
        # cannot always be derived from the field.
        v="${RELEASE_TAG:-}"
        [ -n "$v" ] || v="v$(task version)"
        git tag -s -m "Release $v" "$v" ${RELEASE_COMMIT:+"$RELEASE_COMMIT"}
        echo "created $v. Push to release:  git push origin $v"
  init-release:
    desc: Cut and push the signed release tag for VERSION, guardrails first (DRY_RUN=1 rehearses)
    requires:
      vars: [VERSION]
    # Through the environment, never spliced into the command, so a version carrying
    # shell metacharacters reaches the script's parser as one argument and is refused.
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - bash scripts/init-release.sh "$VERSION"
  verify-release:
    desc: Verify a published release for VERSION, including the path with no credential
    requires:
      vars: [VERSION]
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - bash scripts/verify-release.sh "$VERSION"
  update:
    desc: Refresh the cabal package index
    cmds:
      - cabal update
  freeze:
    desc: Regenerate cabal.project.freeze from the Nix package set (the version authority)
    cmds:
      - cp --no-preserve=mode,timestamps "$(nix build .#cabal-freeze --print-out-paths --no-link)" cabal.project.freeze
  bump-index-state:
    desc: Advance cabal.project's index-state to the newest Hackage index (needed only when a freeze pin postdates it)
    cmds:
      - cabal update
      - |
        bash -c 'ts=$(cabal update 2>&1 | sed -n "s/.*index-state is set to \(.*\)\.$/\1/p" | tail -1); \
        [ -n "$ts" ] && sed -i "s/^index-state:.*/index-state: $ts/" cabal.project'
  build:
    desc: Build library, executable, and all test suites
    cmds:
      - cabal build all --enable-tests
  test:
    desc: Run the fast, gating unit suites (core + app)
    cmds:
      - cabal test ecluse-core-unit ecluse-runtime-unit ecluse-unit --test-show-details=direct
  test-unit-core-receipt:
    desc: Run core unit tests and write their completion plan and report
    env:
      ECLTEST_UNIT_PLAN_PATH: scratchpad/unit/core/unit-plan.json
      ECLTEST_UNIT_REPORT_PATH: scratchpad/unit/core/unit-report.json
    cmds:
      - mkdir -p scratchpad/unit/core
      - rm -f scratchpad/unit/core/unit-plan.json scratchpad/unit/core/unit-report.json
      - cabal test ecluse-core-unit --test-show-details=direct
  test-unit-runtime-receipt:
    desc: Run runtime unit tests and write their completion plan and report
    env:
      ECLTEST_UNIT_PLAN_PATH: scratchpad/unit/runtime/unit-plan.json
      ECLTEST_UNIT_REPORT_PATH: scratchpad/unit/runtime/unit-report.json
    cmds:
      - mkdir -p scratchpad/unit/runtime
      - rm -f scratchpad/unit/runtime/unit-plan.json scratchpad/unit/runtime/unit-report.json
      - cabal test ecluse-runtime-unit --test-show-details=direct
  test-integration:
    desc: Run the complete fixed integration suite
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:integration
  test-residency:
    desc: Run the bounded-memory streaming gate (own process, RTS -T)
    cmds:
      - cabal test ecluse-residency --test-show-details=direct
  test-smoke:
    desc: Run the smoke suite (live registries, non-gating)
    cmds:
      - cabal test ecluse-smoke --test-show-details=direct
  test-e2e-prepare:
    desc: Build one immutable image archive and the E2E plan
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e-prepare
  test-e2e-load:
    desc: Verify and load the prepared E2E image archive
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e-load
  test-e2e-npm:
    desc: Run the fixed npm E2E subject
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e-npm
  test-e2e-pypi:
    desc: Run the fixed PyPI E2E subject
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e-pypi
  test-e2e-cargo:
    desc: Run the fixed Cargo E2E subject
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e-cargo
  test-e2e-rubygems:
    desc: Run the fixed RubyGems E2E subject
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e-rubygems
  test-e2e-shared-system:
    desc: Run the fixed shared-system E2E subject
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e-shared-system
  test-e2e-npm-completion:
    desc: Audit npm completion against unit, integration and E2E reports
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:npm-completion
  test-e2e-pypi-completion:
    desc: Audit PyPI completion against unit, integration and E2E reports
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:pypi-completion
  test-e2e-cargo-completion:
    desc: Audit Cargo completion against unit, integration and E2E reports
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:cargo-completion
  test-e2e-rubygems-completion:
    desc: Audit RubyGems completion against unit, integration and E2E reports
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:rubygems-completion
  test-conformance-verdaccio:
    desc: Run the fixed Verdaccio package-store contract
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:conformance-verdaccio
  test-conformance-codeartifact:
    desc: Run the fixed CodeArtifact package-store contract
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:conformance-codeartifact
  test-e2e-audit:
    desc: Check subject reports against the complete prepared plan
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e-audit
  test-e2e:
    desc: Collect every fixed E2E subject report and audit the complete execution
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: test:e2e
  test-clean:
    desc: Wait for active planes, then reap this worktree's stale test resources
    cmds:
      - bash scripts/test-containers.sh reap
  test-clean-all:
    desc: Wait for active planes, then reap all labelled test resources
    cmds:
      - bash scripts/test-containers.sh reap --all
  test-all:
    desc: Run the unit, integration, and smoke suites
    cmds:
      - task: test
      - task: test-integration
      - task: test-smoke
  bench:
    desc: Run the work-per-request benchmarks
    cmds:
      - '{{.NIX_BENCH}} cabal bench ecluse-bench --benchmark-options="{{.BENCH_OPTS}}"'
  bench-report:
    desc: Render the work-per-request bench CSV as a Markdown report
    cmds:
      - '{{.NIX_BENCH}} cabal run -v0 bench-report -- {{.BENCH_CSV | default "bench-results.csv"}} {{.BENCH_LOG | default "bench-output.txt"}}'
  against-main:
    desc: Set a performance report beside the latest run on main (KIND=bench|acceptance|load, BASELINE=<dir>, REPORT=<file>)
    requires:
      vars: [KIND, BASELINE, REPORT]
    # Through the environment, never spliced into the command, so a path reaches the tool as one argument.
    env:
      KIND: '{{.KIND}}'
      BASELINE: '{{.BASELINE}}'
      REPORT: '{{.REPORT}}'
    cmds:
      - '{{.NIX_BENCH}} cabal run -v0 bench-report -- against-main "$KIND" "$BASELINE" "$REPORT"'
  bench-profile:
    desc: Profiling build -> run -> cost-centre flame graph
    cmds:
      - '{{.NIX_BENCH}} cabal build ecluse-bench --enable-profiling --profiling-detail=late --builddir={{.BENCH_PROFILE_DIR}}'
      - |
        {{.NIX_BENCH}} bash -c 'set -euo pipefail; \
        bin=$(cabal list-bin ecluse-bench --enable-profiling --builddir={{.BENCH_PROFILE_DIR}}); \
        "$bin" {{.BENCH_PROFILE_OPTS | default "-p express"}} +RTS -p -RTS; \
        ghc-prof-flamegraph ecluse-bench.prof -o ecluse-bench.svg; \
        echo "flame graph: ecluse-bench.svg  (cost-centre profile: ecluse-bench.prof)"'
  bench-load:
    desc: Run the throughput and latency load tests
    cmds:
      - '{{.NIX_BENCH}} cabal run -v0 bench-load'
  perf-acceptance:
    desc: Report allocation and time over live registry documents (informational)
    cmds:
      - cabal run -v0 perf-acceptance -- live
  perf-allocation:
    desc: Hold allocation over the committed captures to the budgets in acceptance/criteria.json (gating)
    cmds:
      - cabal run -v0 perf-acceptance -- captures
  doctest:
    desc: Run the Haddock >>> examples as tests
    # doctest reads one component per repl. Cabal passes the project's -Werror after the repl options,
    # so a load warning fails the examples. GHCi drops the fork's -fspec-constr pragma with a warning.
    cmds:
      - for: ['lib:ecluse-json-stream', 'lib:ecluse-core', 'lib:ecluse-runtime', 'lib:ecluse']
        cmd: cabal repl --with-ghc=doctest --repl-options="-Wno-missing-export-lists -Wno-inconsistent-flags" {{.ITEM}}
  coverage:
    desc: Combined unit and integration coverage matching Codecov
    cmds:
      - task: coverage:combined
  coverage-unit:
    desc: Fast, Docker-free unit-only coverage
    cmds:
      - task: coverage:unit
  coverage-integration:
    desc: Full integration coverage under the shared daemon lock
    env:
      ECLTEST_ARGUMENTS: '{{.CLI_ARGS}}'
    cmds:
      - task: coverage:integration
  gen-version-fixtures:
    desc: Regenerate version-ordering fixtures
    cmds:
      - bash scripts/gen-version-fixtures.sh
  gen-bench-corpus:
    desc: Re-capture the real-world packument benchmark corpus
    cmds:
      - bash scripts/gen-bench-corpus.sh
  new-worktree:
    desc: Create an agent worktree on BRANCH and warm its HLS index
    requires:
      vars: [BRANCH]
    cmds:
      - bash scripts/new-worktree.sh "{{.BRANCH}}" "{{.BASE}}" "{{.DIR}}"
  rm-worktree:
    desc: Retire BRANCH's agent worktree and reap its HLS cache, keeping the branch (FORCE=1 discards local changes)
    requires:
      vars: [BRANCH]
    cmds:
      - bash scripts/rm-worktree.sh "{{.BRANCH}}" "{{.DIR}}"
  worktree-clean:
    desc: Reap HLS caches stranded by deleted worktrees and prune stale registrations (safe while other worktrees build, --dry-run to preview)
    cmds:
      - bash scripts/reap-hls-caches.sh {{.CLI_ARGS}}
  format:
    desc: Reformat Haskell sources in place
    cmds:
      - bash scripts/source-inventory.sh run hs fourmolu --mode inplace
  format-check:
    desc: Check formatting without writing
    vars:
      SOURCE_MANIFEST:
        sh: bash scripts/source-inventory.sh manifest hs
    sources:
      - '{{.SOURCE_MANIFEST}}'
      - 'scripts/source-inventory.sh'
      - 'Taskfile.yml'
      - 'fourmolu.yaml'
      - 'flake.lock'
      - 'ecluse.cabal'
      - 'cabal.project.freeze'
    cmds:
      - bash scripts/source-inventory.sh run hs fourmolu --mode check
  lint:
    desc: Run hlint
    vars:
      SOURCE_MANIFEST:
        sh: bash scripts/source-inventory.sh manifest hs
    sources:
      - '{{.SOURCE_MANIFEST}}'
      - 'scripts/source-inventory.sh'
      - 'Taskfile.yml'
      - '.hlint.yaml'
      - 'flake.lock'
      - 'ecluse.cabal'
      - 'cabal.project.freeze'
    cmds:
      - bash scripts/source-inventory.sh run hs hlint
  sast:
    desc: Static analysis (Semgrep)
    sources:
      - '**/*.hs'
      - '**/*.sh'
      - '**/*.yaml'
      - '.github/**/*.yml'
      - '.github/**/*.yaml'
      - 'Taskfile.yml'
      - 'flake.nix'
      - '**/*.json'
      - 'flake.lock'
      - 'ecluse.cabal'
      - 'cabal.project.freeze'
      - exclude: 'dist-*/**'
      - exclude: '.git/**'
      - exclude: '.agents/**'
      - exclude: 'coverage/**'
      - exclude: '_site/**'
      - exclude: 'scratchpad/**'
      - exclude: 'sbom/**'
      - exclude: '*.json'
    cmds:
      - task: test-sast
      # The site fetches no external subresources, so missing-integrity does not apply.
      # Replace the registry's action-pinning rule with the pinned fix from upstream #4042.
      - >-
        semgrep scan --config auto --config "$ECLTEST_SEMGREP_ACTION_RULE"
        --severity ERROR --severity WARNING
        --exclude-rule html.security.audit.missing-integrity.missing-integrity
        --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        --sarif-output=semgrep.sarif --error .
  test-sast:
    desc: Test the pinned action-pinning rule
    sources:
      - 'Taskfile.yml'
      - 'flake.nix'
      - 'flake.lock'
    cmds:
      - semgrep --test --config "$ECLTEST_SEMGREP_ACTION_RULE" "$ECLTEST_SEMGREP_ACTION_TEST"
  cabal-check:
    desc: Validate the .cabal package metadata
    sources:
      - ecluse.cabal
      - cabal.project
      - flake.lock
    cmds:
      - |
        cabal_check_status=0
        cabal_check_output=$(cabal check 2>&1) || cabal_check_status=$?
        printf '%s\n' "$cabal_check_output"
        if [ "$cabal_check_status" -ne 0 ]; then
          exit "$cabal_check_status"
        fi
        case "$cabal_check_output" in
          *Warning:*|*Error:*) exit 1 ;;
        esac
  lint-workflows:
    desc: Lint GitHub Actions workflows and check their runners
    sources:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/.*.yml'
      - '.github/workflows/.*.yaml'
      - '.github/actionlint.yaml'
      - '.github/zizmor.yml'
      - 'scripts/ci-runner-policy.sh'
      - 'flake.lock'
    cmds:
      - actionlint
      - zizmor .github/workflows/
      - bash scripts/ci-runner-policy.sh
  lint-scripts:
    desc: Lint shell scripts
    vars:
      SOURCE_MANIFEST:
        sh: bash scripts/source-inventory.sh manifest sh
    sources:
      - '{{.SOURCE_MANIFEST}}'
      - 'scripts/source-inventory.sh'
      - 'Taskfile.yml'
      - 'flake.lock'
    cmds:
      - bash scripts/source-inventory.sh run sh shellcheck --severity=warning
  lint-spdx:
    desc: Check SPDX licence headers on tracked Haskell sources
    sources:
      - '**/*.hs'
      - 'LICENSES/**'
      - 'flake.lock'
      - exclude: 'dist-*/**'
      - exclude: '.git/**'
      - exclude: '.agents/**'
      - exclude: 'coverage/**'
      - exclude: '_site/**'
      - exclude: 'scratchpad/**'
    cmds:
      # The file list comes from git at run time, never a static list. The gate then
      # stays correct while concurrent work adds, moves, or splits modules.
      - git ls-files -z -- '*.hs' | xargs -0 -r reuse lint-file
  spdx-fix:
    desc: Insert missing SPDX licence headers into tracked Haskell sources
    cmds:
      # Annotate only untagged files: re-annotation can discard a comment fourmolu joined to the
      # header, and the fork's BSD headers stay. git grep exits 1 when every file carries the tag.
      - '{ git grep -z -L "SPDX-License-Identifier:" -- "*.hs" || true; } | xargs -0 -r reuse annotate --license MIT --copyright "Alexandra de Wit" --year 2026'
  test-task-composition:
    desc: Check Task sequencing and lifecycle with stubbed processes
    cmds:
      - bash scripts/task-composition.test.sh
  test-scripts:
    desc: Run the shell-script unit tests
    sources:
      - 'scripts/**/*.sh'
      - 'taskfiles/*.yml'
      - '.github/workflows/*.yml'
      - 'Taskfile.yml'
      - 'bench/corpus/**/*.json'
      - 'bench/load/sweeps/*.json'
      - 'flake.lock'
    cmds:
      - bash scripts/ci-build-diagnostics.test.sh
      - bash scripts/ci-cabal-diff.test.sh
      - bash scripts/ci-classify-change.test.sh
      - bash scripts/ci-gate-verdict.test.sh
      - bash scripts/ci-runner-policy.test.sh
      - bash scripts/coverage-tix.test.sh
      - bash scripts/coverage.test.sh
      - bash scripts/task-composition.test.sh
      - bash scripts/test-containers.test.sh
      - bash scripts/process-capture.test.sh
      - bash scripts/docs-open.test.sh
      - bash scripts/gen-bench-corpus.test.sh
      - bash scripts/image-archive.test.sh
      - bash scripts/load-floors.test.sh
      - bash scripts/load-sweep.test.sh
      - bash scripts/perf-baseline.test.sh
      - bash scripts/release-assets.test.sh
      - bash scripts/release-version.test.sh
      - bash scripts/source-inventory.test.sh
  analysis-build:
    desc: Build exe:ecluse with .hie output for weeder and stan
    # Share one build and run it once. Concurrent Cabal clones can fail with exit 128,
    # and readers must wait for the completed .hie files.
    run: once
    cmds:
      - cabal build exe:ecluse --builddir=dist-analysis --ghc-options=-fwrite-ide-info
  weeder:
    desc: Report app-unreachable library code
    deps:
      - analysis-build
    cmds:
      - weeder --hie-directory dist-analysis
  stan:
    desc: Haskell static analysis
    deps:
      - analysis-build
    cmds:
      - stan --hiedir dist-analysis
      - |
        n=$(bash -c 'stan --hiedir dist-analysis --json-output | jq ".observations | length"'); \
        if [ "$n" -gt 0 ]; then echo "stan: $n finding(s) above the configured floor (fails the gate)"; exit 1; fi; \
        echo "stan: clean at the configured floor"
  stan-all:
    desc: Full stan report including the Performance and space-leak findings
    deps:
      - analysis-build
    cmds:
      - stan --hiedir dist-analysis --no-default
  cabal-checks:
    desc: Run all Cabal-dependent checks sequentially
    cmds:
      - task: build
      - task: coverage
      # The residency gate runs outside coverage on purpose. It measures live bytes,
      # so its process must not carry hpc's tix apparatus or another suite's heap.
      - task: test-residency
      - task: doctest
      - task: cabal-check
  static-checks:
    desc: Run all static analysis checks concurrently
    deps:
      - format-check
      - lint
      - sast
      - lint-workflows
      - lint-scripts
      - lint-spdx
      - test-scripts
      - site-stub
  analysis-checks:
    desc: Dead-code (weeder) and Haskell static analysis (stan)
    # Both tools read the completed shared build concurrently. The check task runs this
    # tier after coverage to avoid competing with its build and Docker containers.
    deps:
      - weeder
      - stan
  check:
    desc: Pre-push checks (build, tests, doctest, lint, Semgrep, dead-code, static analysis)
    # The cabal and static tiers run concurrently first. The analysis tier follows, so
    # its ide-info build does not contend with the coverage build for CPU.
    deps:
      - cabal-checks
      - static-checks
    cmds:
      - task: analysis-checks
  ci:
    desc: Reproduce the core CI pipeline locally
    cmds:
      # `check` already runs weeder and stan through analysis-checks, so this task does
      # not repeat them.
      - task: check
      - task: docs-check
  gate:
    desc: Run check, integration tests, and Haddock locally
    cmds:
      - task: check
      - task: test-integration
      - task: docs-check
  run:
    desc: Run the proxy
    cmds:
      - cabal run ecluse
  docs:
    desc: Build hyperlinked, searchable Haddock HTML
    cmds:
      - cabal haddock lib:ecluse lib:ecluse-core lib:ecluse-runtime {{.HADDOCK_FLAGS}}
      - bash scripts/docs-open.sh
  docs-check:
    desc: Build Haddock for the CI gate
    cmds:
      - cabal haddock lib:ecluse lib:ecluse-core lib:ecluse-runtime --haddock-quickjump --disable-documentation
  site:
    desc: Assemble the Pages site into ./_site
    cmds:
      - task: site:api
      - task: site:generated
      - task: site:zola
      - task: site:assemble
      - cabal run -v0 --builddir={{.DOCS_BUILDDIR}} site-gen -- search-metadata --root _site/api
      - pagefind --site _site
      - task: site:leak-check
  # The PR-gate path. Placeholder fragments render every page, so the gate checks
  # the content and the links without a Haskell build.
  site-stub:
    desc: Build the site over placeholder fragments, with no Haskell build
    cmds:
      - task: site:generated-stub
      - task: site:zola
  # `--haddock-html-location` sends every dependency identifier to Hackage as
  # Haddock writes it, so no build-host path reaches the published tree.
  site:api:
    internal: true
    cmds:
      - rm -rf {{.DOCS_BUILDDIR}}/haddock-site
      - cabal haddock lib:ecluse lib:ecluse-core lib:ecluse-runtime --builddir={{.DOCS_BUILDDIR}} {{.HADDOCK_FLAGS}} --haddock-html-location='https://hackage.haskell.org/package/$pkg-$version/docs' --haddock-output-dir={{.DOCS_BUILDDIR}}/haddock-site
      - cabal run -v0 --builddir={{.DOCS_BUILDDIR}} openapi-gen -- {{.DOCS_BUILDDIR}}/haddock-site/openapi.json
  # The fragments the Zola shortcodes load.
  site:generated:
    internal: true
    cmds:
      - task: site:threat-model
      - cabal run -v0 --builddir={{.DOCS_BUILDDIR}} site-gen -- openapi --out web/generated/openapi.md
      - cp config/default.yaml web/generated/default.yaml
  # The threat model and the configuration reference stay real, because neither needs
  # a Haskell build.
  site:generated-stub:
    internal: true
    cmds:
      - task: site:threat-model
      - printf 'The OpenAPI reference is generated by `task site`.\n' > web/generated/openapi.md
      - cp config/default.yaml web/generated/default.yaml
  # A model Saerskriven cannot read fails the render.
  site:threat-model:
    internal: true
    cmds:
      - task: diagrams
      - mkdir -p web/generated
      - saer render threat-modelling/ecluse.yaml --format md --styled --no-title --heading-level 3 --out web/generated/threat-register.md
  diagrams:
    desc: Render the shared system diagrams from the Saerskriven threat model
    cmds:
      - |
        rm -rf web/static/diagrams
        mkdir -p web/static/diagrams
        for diagram in registry-topology metadata-admission artifact-downloads \
          first-party-publication mirror-completion pypi-inventory \
          advisory-publication advisory-distribution revocation-cleanup; do
          saer render threat-modelling/ecluse.yaml --format svg --diagram "$diagram" \
            --out "web/static/diagrams/$diagram.svg" || exit 1
        done
  # Zola refuses a non-empty output directory and never prunes a stale file.
  site:zola:
    internal: true
    cmds:
      - rm -rf web/public
      - |
        set -euo pipefail
        social_card_hash="$(sha256sum docs/social-preview.png | cut -d' ' -f1)"
        ECLUSE_SITE_PUBLICATION_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          ECLUSE_SITE_SOCIAL_IMAGE="social-preview-${social_card_hash}.png" \
          zola --root web build
        cp docs/social-preview.png "web/public/social-preview-${social_card_hash}.png"
      - cp docs/branding/logo.svg docs/branding/favicon-32.png docs/branding/lock-illustration.svg docs/branding/wordmark.svg docs/branding/wordmark-inverse.svg docs/social-preview.png web/public/
  # The three Haddock trees and the spec sit under /api. The Zola pages, the API
  # hub page among them, land over the top.
  site:assemble:
    internal: true
    cmds:
      - rm -rf _site && mkdir -p _site/api && touch _site/.nojekyll
      - cp -R {{.DOCS_BUILDDIR}}/haddock-site/. _site/api/
      - cp -R web/public/. _site/
  site:leak-check:
    internal: true
    cmds:
      - |
        if grep -rlE 'file:///|\$\{pkgroot\}|/store/ghc-|/nix/store/' _site >&2; then \
          echo "site: a build-host path reached the published tree (files above)" >&2; exit 1; \
        fi
  nix-build:
    desc: Build the release artifact via Nix (hermetic)
    cmds:
      - nix build
  nix-check:
    desc: Evaluate every flake output and build the hermetic Haddock check
    cmds:
      - nix flake check
  docker-build:
    desc: Build the lean OCI image via Nix
    # release-build.yml runs this too. The build logs name a stalled phase, and 20
    # silent minutes fail the build long before the job's 90-minute timeout.
    cmds:
      - nix build --print-build-logs --option max-silent-time 1200 .#dockerImage
  sbom:
    desc: Generate the image SBOM
    cmds:
      - mkdir -p sbom
      - sbomnix --spdx sbom/ecluse.spdx.json --cdx sbom/ecluse.cdx.json --csv sbom/ecluse.csv .#ecluse-bin
  scan:
    desc: Scan the image closure for CVEs
    cmds:
      - mkdir -p sbom
      - sbomnix --cdx sbom/ecluse.cdx.json .#ecluse-bin
      - task: scan-sbom
  scan-sbom:
    desc: Scan a CycloneDX SBOM for CVEs (SCAN_SBOM= and SCAN_SARIF= override the paths)
    vars:
      SCAN_SBOM: '{{.SCAN_SBOM | default "sbom/ecluse.cdx.json"}}'
      SCAN_SARIF: '{{.SCAN_SARIF | default "grype.sarif"}}'
    cmds:
      - grype 'sbom:{{.SCAN_SBOM}}' -o table -o 'sarif={{.SCAN_SARIF}}'
      - bash scripts/sarif-locations.sh '{{.SCAN_SARIF}}' flake.lock
  scan-vulnix:
    desc: Secondary Nix-native cross-check (vulnix)
    ignore_error: true
    cmds:
      - bash -c 'vulnix -C $(nix build .#ecluse-bin --no-link --print-out-paths)'
  scan-osv:
    desc: Scan the pinned Haskell closure for HSEC advisories (osv-scanner over the freezes)
    cmds:
      # Exit 1 means findings for security.yml's SARIF upload. Only an exit above 1 fails.
      # Each upstream.freeze has a non-standard name, so the scanner is told to read it as a freeze.
      - osv-scanner scan source --lockfile cabal.project.freeze --lockfile cabal.project.freeze:json-stream/upstream.freeze --lockfile cabal.project.freeze:vendor/lzma-managed/upstream.freeze --format sarif --output osv-freeze.sarif || test $? -eq 1
      - bash scripts/sarif-locations.sh osv-freeze.sarif cabal.project.freeze
  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist-newstyle dist-bench-prof result sbom grype.sarif osv-freeze.sarif ecluse-bench.prof ecluse-bench.svg
