# The defaults Écluse boots from, embedded in the binary. Your config document and the
# ECLUSE_* environment variables override it key by key, in the order defaults <
# document < environment. ECLUSE_CACHE__TTL spells cache.ttl. A commented key is
# INACTIVE: it documents the schema, and names the computed or derived default that
# applies while it stays unset. Put secrets in environment variables, never here. An
# integer key takes a positive integer unless its comment says otherwise. A quoted value
# and an ECLUSE_* variable must spell it in plain digits: a hexadecimal, octal,
# space-padded, or bracketed spelling is refused there.
#
# The loader owns the whole ECLUSE_ prefix: every ECLUSE_* variable is read as a key of
# this schema, and one that names no key aborts the boot. Two families are consumed
# before the loader sees them and so name no key: ECLUSE_CONFIG, which relocates the
# document, and the *_FILE secret indirections. Never put an unrelated setting under the
# prefix. Écluse also reads the standard AWS_* and OTEL_* variables of the SDKs it
# embeds, which are not keys here and are documented in the operator manual.

server:
  # TCP port, 0 to 65535. 0 binds an OS-assigned ephemeral port. Every role listens
  # here: the proxy serves its mounts and its probes, and the worker roles (mirror,
  # pilot, dredger) serve /livez and /readyz alone. With telemetry enabled,
  # OTEL_METRICS_EXPORTER=prometheus adds a scrape listener on its own port, addressed
  # by OTEL_EXPORTER_PROMETHEUS_HOST and OTEL_EXPORTER_PROMETHEUS_PORT rather than by a
  # key here.
  port: 8080
  # The proxy's own externally-reachable base URL. The proxy rewrites served tarball
  # URLs against it, and Cargo publication accepts dependencies from the Cargo indexes
  # under it as the proxy's own. http(s) with a dialable authority, and http stays
  # legal for loopback. Required as soon as any mount is active, else the boot refuses
  # (PublicUrlRequired).
  # publicUrl: https://registry.example.com
  # Set via ECLUSE_SERVER__AUTH_TOKEN (a secret): clients must then present it.
  # authToken:
  # A note Écluse appends to client-facing error bodies, e.g. where to ask for access.
  # helpMessage: Contact platform engineering for access
  # Seconds the graceful shutdown waits for in-flight requests and artifact streams.
  shutdownDrainTimeout: 30
  # Gzip each admitted npm packument, PyPI Simple index, Cargo sparse index, RubyGems Compact
  # Index reply (/versions and /info), and RubyGems compact specification for a client whose
  # Accept-Encoding prefers gzip, at level 1, compressed per response. Artifacts,
  # probes, refusals, and publish replies stay uncompressed, and the metadata cache
  # holds identity bytes. The compression costs CPU on every gzipped response, and
  # each one pays 512 KiB of the memory budget plus its output. false serves every
  # listing in identity coding and ignores Accept-Encoding, for a front proxy that
  # compresses instead. A front proxy may compress whatever this setting says.
  metadataGzip: true

# The mirror queue, read only when a mount mirrors. The shape of url picks the
# backend. An SQS queue URL (https://sqs.{region}.amazonaws.com/...) selects the
# durable SQS backend and takes its region from the host. A Pub/Sub topic resource
# (projects/{p}/topics/{t}) names the GCP backend, which Écluse refuses at boot. Unset,
# mirroring runs on the bounded in-memory queue: non-durable, best-effort, and warned
# loudly at boot. That is fine for a single node or a trial. A split deployment
# (ecluse proxy --no-worker beside an ecluse mirror fleet) needs a durable url, because
# in-memory jobs never leave the process that enqueued them: Écluse refuses those roles
# at boot without one.
queue:
  # How many deliveries one mirror job gets before the worker retires it outright. The
  # worker alarms and counts each retirement. A queue with a dead-letter queue attached
  # runs one delivery above that dead-letter queue's own maxReceiveCount. The
  # dead-letter queue therefore always captures the job first. This count is the floor,
  # and the only end a job gets on a queue with no dead-letter queue.
  maxReceiveCount: 5
  # An SQS URL is validated in full: https, a single-label region, a 12-digit account,
  # one queue segment, no port, query, or fragment.
  # url: https://sqs.us-east-1.amazonaws.com/123456789012/ecluse-mirror
  # In-memory queue only. Past the cap an enqueue is dropped (drop-newest) and the
  # package re-mirrors on next demand. Unset, the memory plan computes it.
  # maxMemoryDepth: 50000

limits:
  # Écluse keeps a structural count only where no byte, memory or deadline bound already
  # covers the work, so maxVersionCount and maxNestingDepth are the only count keys.
  # Fixed ceilings in code bound the rest, and raising one takes a release: 1,000,000 each
  # of tar members or ZIP entries per archive, gzip or bzip2 members per archive, Marshal
  # or YAML nodes per decode, multipart parts per upload and files per mirror-state record,
  # and 2,000,000 gem names in the RubyGems /versions directory, whose rows
  # maxResponseBytes bounds.
  # maxVersionCount counts every source entry position in one package's metadata: npm
  # versions, PyPI files, Cargo index records and RubyGems /info rows, including invalid,
  # skipped and unselected entries. A read refuses at the first entry past it. It also
  # bounds the versions the Dredger gathers for one package across store listing pages,
  # and the versions one mirror-state record holds.
  maxVersionCount: 1000000
  # Nesting in retained metadata fields and Cargo records. Skipped npm/PyPI fields do not use this limit.
  maxNestingDepth: 64
  # Refuse to download an advisory database larger than this many bytes (512 MiB). The
  # declared length fails fast and the streaming download enforces the cap. It bounds a
  # stream to disk rather than a heap tenant, which is why the plan does not size it.
  maxAdvisoryDatabaseBytes: 536870912
  # The progress floor every transfer over a registry protocol keeps: request and
  # response body bytes together, at least minProgressBytes (1 MiB, response bytes counted
  # after decompression) within each progressWindow seconds spent waiting on the upstream. Time
  # Écluse spends on bytes it already holds, and the wait for the status line and headers,
  # do not count. That wait has a fixed bound of its own: 30 seconds for the connection and
  # the headers together. A transfer below the floor, a silent one included, fails with the same
  # upstream timeout as an upstream that never answers, and its connection closes rather
  # than returning to the pool. The floor covers metadata reads, publish relays, the
  # mirror worker's fetches, probes and publishes, the Dredger's calls to a store it
  # reaches over the registry protocol, and the artifact stream relayed to a client.
  # Apart from the artifact stream, each upstream exchange a served request makes also
  # ends 50 seconds in: the 60-second request timeout less a 10-second margin. That frees
  # the requests waiting on a slow fetch before they time out. The mirror worker and the
  # Dredger have no such cap. Écluse checks the floor, the 30-second wait, the 50-second
  # cap and the request timeout every 100 ms, so each ends about 100 ms after its time. The
  # window must be positive and below 50, and the byte count positive.
  progressWindow: 10
  minProgressBytes: 1048576
  # maxResponseBytes defaults to 128 MiB, a fixed metadata ingest ceiling independent of CPU
  # concurrency and the metadata memory budget. Reads fail closed past this limit.
  # A positive explicit value stays exact. Boot and check-config warn that accepting
  # a body does not guarantee its materialisation fits the heap.
  # maxRequestBytes is the inherited publish-body cap. The memory plan computes it
  # between 25 and 100 MiB when unset. A mount may set its own maxRequestBytes.
  # The aggregate admission covers the largest active cap. Unsafe overrides refuse boot.
  # maxResponseBytes: 134217728
  # maxRequestBytes: 26214400
  # The mirror worker's per-artifact fetch cap.
  # The worker plan accounts for its transient publication envelope.
  # maxArtifactBytes: 536870912

cache:
  # One provider owns all metadata retention. The shipped provider is local memory.
  # Seconds the local selected-version, assembled and RubyGems directory stores keep entries.
  # Non-negative, and a fractional value is refused rather than truncated.
  ttl: 60
  # Écluse computes both bounds at boot from the resolved heap ceiling, and the boot
  # log names each decision. The byte bound is 30% of the live data the heap holds
  # without strain (a quarter of the heap the nursery leaves), from 64 MiB to 1 GiB.
  # Set either one only to override it.
  # One entry bound covers the three stores together.
  # maxEntries: 1024
  # The local backend never retains full metadata. Active fetches still coalesce.
  # Selected versions, assembled responses and the public RubyGems discovery directory share
  # one byte budget, with no reserved shares. No gauge reports the directory's bytes.
  # A pod too small for the plan sheds the
  # mirror-artifact cap first and this aggregate second.
  # maxBytes: 268435456

integrity:
  minPublic: sha256
  minTrusted: sha256 # refinable per mount: mounts.<ecosystem>.integrity.minTrusted
  # Digest conflicts keep the private version and tags, log WARNING with both digests,
  # and increment ecluse.registry.merge.divergence. They never block private artifacts.
  # Deprecated compatibility key:
  # divergencePolicy: warn
  # Remove the key. Missing/null or warn keeps alarms and private preference.
  # fail-closed (also fail_closed or failclosed) refuses startup. Remove that setting only after
  # accepting private preference: divergence alone can leave a damaged private copy served.

# egress:
#   # Extra CIDR ranges denied registry egress, added to the built-in internal-range blocklist.
#   # Comma-separated. A malformed entry refuses startup.
#   additionalBlockedRanges: "100.64.0.0/10,198.18.0.0/15"
#   # Optional contact sent to all registry destinations and Pilot's OSV and EPSS sources.
#   # Appended to User-Agent: ecluse/<version> (+https://ecluse-proxy.com; contact: <value>).
#   # Set a monitored email address or contact URL so upstream operators can reach your team.
#   # Accepts 1-256 printable ASCII characters, excluding parentheses and backslash.
#   # Empty, control, non-ASCII and oversized values refuse startup, naming egress.operatorContact.
#   operatorContact: null

# Durable expected native files and preserved read metadata, separate from advisory storage.
# Requires conditional creates/replacements and strong reads. Referenced objects must not expire.
mirrorState:
  url: null # s3://bucket/prefix, required for PyPI, Cargo, or RubyGems mirroring.

advisories:
  # How often the proxy polls object storage for a fresh advisory database (a cheap
  # ETag HEAD). It is deliberately independent of Pilot's compileInterval, and much
  # more frequent: matching them would nearly double the worst-case advisory age.
  pollInterval: 60
  # Pilot only: how often it recompiles and re-exports the advisory artifacts.
  compileInterval: 3600
  # Where Pilot compiles the advisory databases and where the proxy lands synced ones.
  # It must be writable by the container's user, which in the shipped image is uid
  # 65532, so mount a volume here. The default path is absolute on purpose: the image
  # sets no working directory, and a relative one would land in an unwritable root.
  dataDir: "/var/lib/ecluse/advisories"
  # Base URL of the per-ecosystem OSV advisory exports Pilot compiles from
  # (<base>/<ecosystem>/all.zip, where <ecosystem> is osv.dev's own spelling rather than the
  # mounts key: npm, PyPI, crates.io). Override it if the upstream moves or you mirror it.
  # A new URL must never require a new Écluse binary. Allowlist this host for Pilot's
  # egress, not osv.dev.
  osvExportBaseUrl: "https://osv-vulnerabilities.storage.googleapis.com"
  # The EPSS daily feed Pilot joins onto the advisories by CVE id, on the same terms:
  # override it if the upstream moves or you mirror it. Pilot attempts it on every compile,
  # whatever the rules, so allowlist this host for Pilot's egress in every deployment.
  # DenyIfEpss and an AllowIfRemediatesCve rule in differential mode read the scores it
  # supplies, and the shipped remediation-fast-track is one. When the feed fails, an
  # ecosystem whose rules read EPSS publishes nothing, and any other ecosystem publishes its
  # OSV data marked epss_status=unavailable. Pilot and every consumer must share these rules.
  # A pilot compile with no advisories.url requires the feed, because it cannot tell which
  # rules the consumer of its artifact runs.
  epssFeedUrl: "https://epss.empiricalsecurity.com/epss_scores-current.csv.gz"
  # Pilot only: whether each artifact records the path of each source URL above. Every
  # consumer, and every principal that can read the advisory bucket, can read the artifact.
  # false records each source as its scheme, host and port, then the SHA-256 of its path.
  # A credential written into a path then stays out of the artifact. true records each URL
  # as written, path included. A changed path changes the record either way. Switching
  # this does not restart the publication guard's order, which compares the SHA-256 of
  # each whole source URL.
  recordSourcePath: false
  # Pilot only: how long one ecosystem's advisory export may go unchanged, in seconds, before
  # Pilot logs the quiet-time alarm at ERROR after each compile. The key is the ecosystem, as
  # a mounts key spells it, and an unknown one fails the load. The shipped seven days comes
  # from measured change frequency: the longest gap in npm and PyPI advisories over 60 days
  # was four to five days. An ecosystem with no entry here takes the same seven days. Raise it
  # for an ecosystem that really is quiet, or change osvExportBaseUrl.
  quietTime:
    npm: 604800
    pypi: 604800
  # Pilot only: the same threshold for the score date the EPSS feed declares, in seconds. One
  # key, because one feed serves every ecosystem.
  epssQuietTime: 604800
  # How old the published advisory artifact may be, in seconds, before the advisory rules stop
  # deciding on it. The age is the time since Pilot last pushed the artifact, which a restart
  # and a failed poll both leave alone. Past it, every MAL, CVSS, and EPSS deny answers 503 even
  # under `onUnavailable: skip`. AllowIfRemediatesCve follows its own onUnavailable, and the
  # shipped deny answers 503 as well. The MAL default ranks above every default allow, so every
  # public admission refuses. The Dredger stops deleting on an advisory match. Readiness does not
  # change. Unset, each mount derives its own: a day ahead of that mount's earliest
  # AllowIfOlderThan quarantine, never under three days. The shipped seven-day quarantine gives
  # six days, and a mount with no quarantine rule gets three. Set this to override every
  # derivation, above or below it. The boot log names the value and where it came from.
  # maxAgeSeconds: 518400
  # Pilot only: how far a new advisory artifact may shrink below its size baseline, in percent,
  # before Pilot refuses to publish it. The baseline is the largest size accepted under the
  # artifact's object key, kept in that object's metadata, so repeated small shrinks cannot add up
  # past it. Withdrawn advisories shrink a feed legitimately, so this is a damage alarm, not a
  # completeness proof. A refusal logs at ERROR and leaves the stored artifact in place. After a
  # deliberate change, `ecluse pilot compile --out <dir> --upload --rebaseline-etag <etag>
  # --rebaseline-max-shrink-percent <percent>` restarts the baseline.
  maxShrinkPercent: 2
  # Pilot only: the extra shrink one optional EPSS outage may earn, in percent of the previous
  # artifact's size. The credit is 12 bytes per previously scored range, capped at this share.
  # Only the publication that loses the feed earns it, and it ends when the feed returns. At both
  # defaults a publication may shrink by just under 7% in total. 0 turns the credit off.
  epssLossCapPercent: 5
  # The object store the compiled advisory databases sync from, as
  # s3://<bucket>[/<prefix>]. The scheme picks the provider, the way queue.url does, and
  # a scheme this build does not know is refused at load. AWS_ENDPOINT_URL still points
  # both advisory and durable mirror-state S3 clients at an emulator or a VPC endpoint.
  # There is no default: the artifact carries no signature and a bucket name is global, so a shipped one would name a
  # bucket this project does not own. Unset, the advisory stack is off, and the shipped
  # deny-known-malicious and remediation-fast-track rules stay inactive. A manually enabled
  # MAL, CVSS, or EPSS deny, or an AllowIfRemediatesCve rule with onUnavailable: deny,
  # refuses the boot, because it has no database to decide on. With onUnavailable: skip, an
  # AllowIfRemediatesCve rule boots with a warning, admits no fix, and logs every skip.
  # url: s3://my-advisory-bucket/ecluse

# Process sizing. Écluse computes every key at boot from the container's cgroup
# limits, the RTS posture, and the file-descriptor budget. The boot log records each
# decision with its provenance. Set a key only to override the computed value.
# runtime:
#   # Cores the process claims. Unset, they resolve down a ladder: the cgroup CPU quota
#   # floored, else the count the cgroup memory limit can feed, else coresCeiling, each
#   # clamped to the visible processors. The boot log names the rung that fired. Give
#   # the container whole cores.
#   cores: 4
#   # The cap on the last rung of that ladder, which fires only when no cgroup CPU quota
#   # and no cgroup memory limit bind this process (bare metal, or a pod with neither
#   # limit set). It never caps an explicit cores, a CPU quota, or the memory-derived
#   # count. Prefer setting cores over raising this.
#   coresCeiling: 8
#   # Heap ceiling in bytes. Unset, it is the cgroup memory limit less one allocation
#   # area and an eighth of the limit (at least 32 MiB) for memory outside the heap
#   # (socket buffers, OS thread stacks, native zlib state), floored at half the limit.
#   # The nursery (cores x allocation area) counts inside it. The boot sizes the
#   # allocation area (-A) to an eighth of the tighter of the cgroup memory limit and
#   # this ceiling, across the cores, 4 to 64 MiB. Enforcing either re-executes the
#   # binary once. A heap breach is a heap-overflow error. The ceiling also sizes the
#   # metadata memory budget: a quarter of the heap the nursery leaves, less the cache,
#   # the queue tenants and the idle process. Derived from cgroup v2 only: under cgroup
#   # v1, or a layout that hides the limit, set this by hand or the process boots with
#   # no heap ceiling.
#   maxHeapBytes: 1073741824
#   # Concurrent metadata operations: max(8, 20 x capabilities), independent of memory.
#   # A positive explicit value stays exact, and it also sizes the waiting room at the
#   # memory gate. Each gate has a 1 s room wait. Overflow permits retries for 0.5 s
#   # when a room is full. Sweeper expiry normally adds up to 100 ms to a wait.
#   # A retry keeps the normal room waits, so 0.5 s is not a total response deadline.
#   # Overflow holds at most 8 reservations per slot, including retries and work they
#   # admit. Past that cap, 503 refuses at once and permits normal connection reuse.
#   # Every admission refusal keeps Retry-After: 1. Treat it as backpressure.
#   serveMaxInFlight: 128
#   # Pooled connections per public upstream host: clamp (32, 1024) (nofile / 8).
#   # Connections beyond the pool still open, but re-handshake TLS each time.
#   publicConnectionsPerHost: 64
#   # Pooled connections to the private upstream host: nofile / 4, clamped to 64..4096.
#   privateConnectionsPerHost: 256

observability:
  # json: one JSON object per line, for log collectors. console: human-readable.
  logFormat: json
  # The lowest severity Écluse logs: debug, info, warn, or error. Debug carries the
  # per-decision diagnostics, such as mirror probes and artifact fetches, and is
  # verbose under load.
  logLevel: info
  # The OpenTelemetry master switch, on or off. Off, Écluse emits no telemetry. Logs
  # go to stdout either way. Quote the value: YAML reads a bare off as the boolean
  # false, which the load then refuses as the wrong type.
  telemetry: "off"

# The sweep over each mount's mirrorTarget and the privateUpstream cache paired with it,
# read only by `ecluse dredger`. Every other role carries these keys unread. Each cycle
# intersects both stores' package listings with the names the advisory database covers
# and the names an identity-deny rule pins. It then reads each of those packages' metadata
# back from the store holding it. It deletes a version only on a named decisive deny by a
# rule that applies at revocation (see `appliesTo` under rules).
# Deletion is permanent, so the pacing and the cap below bound what one cycle can do.
dredger:
  # Candidate packages one chunk examines before the sweep pauses.
  chunkSize: 50
  # Seconds between chunks. It is also the wait after a store fault whose retry advice
  # names no delay of its own. This is the floor as well as the default: the Dredger
  # refuses to boot beneath it, because the pause is what leaves you time to stop a
  # mistaken sweep. Raise it to sweep more gently.
  chunkPause: 2
  # Seconds between the end of one cycle and the start of the next. A cycle that halted
  # waits the same pause and repeats its error line at each one.
  cyclePause: 3600
  # Seconds within which an advisory reaches every affected mirrored version. A name an
  # advisory newly covers can miss the running cycle's selection, so the window has to
  # cover the rest of that cycle, the cyclePause, and the next whole cycle. Each complete
  # cycle therefore gets (targetCycleWindow - cyclePause) / 2. Computed at boot as three
  # cyclePause, which grants an active cycle the same allowance as the idle interval
  # between cycles. The sweep measures what a cycle asks of the store and paces the next
  # one to land inside the window. A window it cannot reach logs a warning naming the
  # request budget it would need, and the sweep carries on at its ceiling.
  # targetCycleWindow: 10800
  # The share of a store's request capacity one sweep may take, above 0 and below 1, so a
  # sweep cannot starve the proxy's own calls. Computed per capacity pool as the smaller
  # of one half and chunkSize / chunkPause divided by the pool's tightest quota. On the
  # shipped values against a CodeArtifact account that works out at 0.25. Set this to
  # hold every pool to a share of your own choosing.
  # requestBudgetFraction: 0.25
  # Declared request capacity, keyed by the store URL it describes. Nothing here is
  # required. A codeArtifact store is paced against the AWS documented account and
  # Region quotas. A store whose backend publishes no quota (verdaccio) is paced against
  # a capacity derived from chunkSize / chunkPause, the sweep's own package pace, which
  # is 25 requests a second at the defaults and yields a ceiling of 12.5. Raising
  # chunkPause lowers it. Declare a capacity here when you know the real one.
  # `scope` joins two endpoints of one capacity pool, and defaults to the store's own
  # host and port (a codeArtifact store pools by the owning account and Region instead).
  # `quotas` are requests per second, keyed by nameListing, versionListing, accountReads,
  # accountWrites, tokenReads, or storeRequests. `requestWeights` scale what one request
  # costs, keyed by listingPage, versionPage, manifestRead, deleteBatch, permissionRead,
  # cursorRead, or cursorWrite; a weight naming a kind the backend charges nothing for
  # scales nothing. An entry naming a store no mount declares warns at boot and paces
  # nothing. Two entries that give one `scope` different quotas or weights refuse the
  # boot, naming both.
  # quotaOverrides:
  #   https://verdaccio.example.com/:
  #     quotas:
  #       storeRequests: 100
  # Versions one cycle may hand over for deletion. Reaching it halts the sweep for the
  # life of the process: no further cycle runs until you restart the Dredger deliberately.
  # It is the breaker against an advisory database that denies far more than it should.
  # Computed at boot as 100 per sweepable mirror store, because one cycle covers every
  # store in turn and one pinned total would starve the later mounts. Set it to override
  # that, after a dry run has reported the count a real sweep would reach.
  # deletionCap: 100
  # Walk every package in the store each cycle instead of the advisory and identity-deny
  # candidates. Turn it on after a rule change, which is the one cause a candidate cycle
  # cannot see, and turn it off once a walk has completed. A full walk replaces the
  # candidate cycle while it is on, and it writes one resumption marker to the store.
  fullWalk: false

mounts:
  # Dormant per-ecosystem templates. A mount activates only when your document or
  # environment declares any key under it. `enabled: true` alone is enough for the
  # serve-only pure public gate, and declaring `mirrorTarget` is what makes a mount
  # mirror.
  # Every endpoint below is an object with exactly one key, the store tag, and under
  # that tag the keys it admits there. The tag names the backend: `registry` is any
  # host that speaks the ecosystem's protocol, `codeArtifact` is an AWS CodeArtifact
  # repository, and `verdaccio` is a development store. The load checks the URL against
  # the tag and refuses a mismatch, naming the key.
  # A layer fills keys under a tag, it never switches one. An environment variable
  # written under a tag the document did not use leaves the endpoint carrying two tags,
  # which the load refuses. Two endpoints that name the same registry under different
  # tags are refused too, because one store has one backend.
  # Every url must be an https:// URL carrying a dialable host, and none may carry
  # userinfo, a query, or a fragment: a credential belongs in its own key.
  # On mirrorTarget and publicationTarget, url is where Écluse reads and uploadUrl is
  # where it writes. pypi and cargo upload to a separate endpoint, so a role that writes
  # through either target refuses to boot without its uploadUrl. npm and rubygems derive
  # the write address from url, so the load refuses uploadUrl on them.
  npm:
    # DenyIfYanked: npm reports no yank flag. Removed releases disappear from its metadata.
    publicUpstream:
      # Only `registry` is admitted here, because the public leg is anonymous.
      registry:
        url: https://registry.npmjs.org
    # The only key the serve-only pure public gate needs. false switches off a mount
    # whose other keys remain.
    # enabled: true
    # The read authority. Required on a mirrored mount, so the mirror reads back.
    # Optional on a serve-only mount, where it still merges with the gated public set.
    # A failed private read refuses the mount's reads with 503, for every name. A private
    # 404 still lets the gated public set serve.
    # Must name a different repository from this mount's publicUpstream. Boot refuses
    # equal repository identities, including equivalent URL spellings.
    # Proxy reads forward the caller's credential. Dredger uses this target's own authority.
    # CodeArtifact mints a maintenance token and checks the repository's consent tag.
    # Verdaccio takes a token and permitDeletion (default false) for maintenance. The
    # deleting role refuses to boot without both, naming the key it wants. Preview permits
    # anonymous reads and needs no deletion consent.
    # permitDeletion also declares the Verdaccio store standalone.
    # At boot, both proxy roles and both Dredger modes ask the backend whether this
    # repository connects to a public registry. An unsafe answer refuses the role, an
    # undecided one warns once, and a safe one is silent. `registry` and `verdaccio`
    # report no uplinks, so they are always undecided. A `codeArtifact` upstream needs an
    # AWS identity with codeartifact:DescribeRepository on the repository and on every
    # repository in its chain.
    # privateUpstream:
    #   codeArtifact:
    #     # The path must address the repository endpoint for this mount's format
    #     # (/npm/{repository}/ for npm), and the load refuses anything else.
    #     url: https://acme-123456789012.d.codeartifact.us-east-1.amazonaws.com/npm/internal/
    # privateUpstream:
    #   verdaccio:
    #     url: https://private-cache.internal/
    #     token: # Set ECLUSE_MOUNTS__NPM__PRIVATE_UPSTREAM__VERDACCIO__TOKEN separately.
    #     permitDeletion: false
    # Declaring it makes the mount mirrored. The mirror write uses Écluse's credential,
    # so `codeArtifact` mints its own token and admits no `token` key, while
    # `registry` and `verdaccio` require one. The boot refuses a target on any mount's
    # publicUpstream host, which the write credential must never reach.
    # `ecluse dredger` deletes from this store, so it refuses a target that is also any
    # mount's privateUpstream or this mount's publicationTarget. `ecluse proxy` and
    # `ecluse mirror` boot on those and warn once per pair, and pruning stays manual.
    # mirrorTarget:
    #   codeArtifact:
    #     # The path must address the repository endpoint for this mount's format
    #     # (/npm/{repository}/ for npm), and the load refuses anything else.
    #     url: https://acme-123456789012.d.codeartifact.us-east-1.amazonaws.com/npm/mirror/
    #     # Lifetime in seconds of a minted write token, within 900 to 43200. Unset,
    #     # the request omits it and AWS applies its 12-hour default, whatever the role
    #     # session length. The load refuses zero, which ties it to the role session. The refresh
    #     # policy follows the minted token's actual expiry, so this is a preference.
    #     tokenDuration: 3600
    # A non-minting mirror target takes a static write token instead. Set it via
    # ECLUSE_MOUNTS__NPM__MIRROR_TARGET__VERDACCIO__TOKEN (a secret).
    # mirrorTarget:
    #   verdaccio:
    #     url: https://verdaccio.internal/
    #     token:
    #     # The Dredger's consent to delete from this store, and Verdaccio's key alone.
    #     # Without it the Dredger refuses the store, and every other role ignores it.
    #     permitDeletion: true
    # Where a client `npm publish` is relayed. Opt-in: unset, PUT /{pkg} is 405. Every
    # tag is admitted. A configured `token` replaces the authenticated server.authToken
    # on publishes. Without `token`, the relay forwards the caller's credential.
    # Set it via ECLUSE_MOUNTS__NPM__PUBLICATION_TARGET__CODE_ARTIFACT__TOKEN.
    # It requires server.authToken, or the boot refuses.
    # The target receives a credential, so the boot refuses one on any mount's
    # publicUpstream host, or equal to another mount's privateUpstream, mirrorTarget, or
    # publicationTarget. Dredger, including preview, also refuses this mount's
    # privateUpstream or mirrorTarget as the publication target. Proxy and mirror allow them.
    # publicationTarget:
    #   codeArtifact:
    #     url: https://acme-123456789012.d.codeartifact.us-east-1.amazonaws.com/npm/internal/
    #     token:
    # The namespaces this deployment owns, comma separated. Required with a publication
    # target. Declaring firstParty requires privateUpstream on this mount.
    # Only a first-party name may be published here, and a first-party name
    # resolves from privateUpstream alone: it is never fetched from publicUpstream,
    # never merged with a public document, and never mirrored. A private 404 answers
    # 404. A private 401/403 answers a local 403. Other private read failures answer 503.
    # The shape is per-ecosystem. npm reads scopes. PyPI reads PEP 503 canonical
    # distribution names, and an entry ending in a separator then * is a prefix, so
    # acme-* covers acme-tools and not acmeco. A star on no separator (acme*) is
    # refused. It limits names, not callers, and an empty or malformed list is
    # refused at load.
    # firstParty: "@acme,@beta"
    # Per-mount refinements of the integrity group above, under the same key names.
    # integrity:
    #   minTrusted: sha256
    #   divergencePolicy: warn # deprecated compatibility only, remove this key
    # ECLUSE_MOUNTS__NPM__RULES refines the shared policy, then these shipped rules.
    # Both defaults refuse at admission, at precedence 300, and keep stored copies.
    # deny-scripts refuses npm install scripts. deny-external-dependencies refuses a version
    # whose dependencies, optionalDependencies or peerDependencies name a git source
    # (git+https:, git:, github:, user/repo and the like) or a remote tarball URL, which a
    # client would fetch from outside Écluse. It reads the specs the packument already holds.
    rules:
      deny-scripts:
        type: DenyInstallTimeExecution
        appliesTo: [admission]
      deny-external-dependencies:
        type: DenyExternalDependencies
        appliesTo: [admission]
      # Disable either here with <name>: { enabled: false }, not under shared rules.
      # Or add an AllowByIdentity pin here with explicit precedence above 300.
      # Restate appliesTo: [admission, revocation] here to include Dredger deletion.
      # Optional deprecation deny, disabled unless added. No parameters. Default precedence: 300.
      # It also refuses deprecated whole packages and release lines. Empty notices are not deprecations.
      # deny-deprecated:
      #   type: DenyIfDeprecated
      #   appliesTo: [admission]
      # trust-our-scope:
      #   type: AllowScope
      #   scope: acme            # the scope without its leading @
  # A pypi mount serves the PEP 691 Simple index, distributions and declared companions.
  # Mirroring and multipart publication are opt-in. Native upload URLs are explicit.
  # With advisories.url set, this mount reads pypi-osv-schema5.db under that prefix.
  # Publish it with ecluse pilot compile --ecosystem pypi --out DIR --upload.
  pypi:
    # Optional per-mount upload body cap, overriding the resolved limits.maxRequestBytes.
    # Unset, it inherits the computed/configured global limit. Exceeding it returns 413.
    # maxRequestBytes: 52428800
    # The read root and native upload endpoint are distinct. The state store above is required.
    # Generic PyPI write credentials declare their Basic username. CodeArtifact binds aws.
    # CodeArtifact reads use /pypi/{repository}/. Its uploadUrl accepts that root or
    # /pypi/{repository}/legacy/ for the same domain, account, region and repository.
    # mirrorTarget:
    #   registry:
    #     url: https://mirror.internal/
    #     uploadUrl: https://mirror.internal/legacy/
    #     username: publisher
    #     token:
    # Client publication posts to uploadUrl and preserves multipart framing. url is the
    # repository's read root, and the CodeArtifact paths above apply here too.
    # A static token requires server.authToken and an explicit generic username.
    # Without a static token, the complete caller Basic pair passes through unchanged.
    # publicationTarget:
    #   registry:
    #     url: https://first-party.internal/
    #     uploadUrl: https://first-party.internal/legacy/
    #     username: publisher
    #     token:
    # pypi blocks these rule types at boot, even through shared rules:
    # DenyInstallTimeExecution: Most PyPI releases offer a source distribution, which runs its own build on install, so this rule would deny nearly every release.
    # DenyIfDeprecated: The PyPI adapter supplies no deprecation flag.
    # AllowScope: A PyPI project name has no scope, so this rule can never match one.
    # Move supported types from shared rules into mounts.npm.rules, or disable its configured
    # entry with enabled: false under mounts.pypi.rules (ECLUSE_MOUNTS__PYPI__RULES).
    publicUpstream:
      registry:
        url: https://pypi.org
    # Optional yank deny, disabled unless added. No parameters. Default precedence: 300.
    # A release is yanked only when every file is yanked. Mixed releases remain admitted.
    # Admission-only keeps previously mirrored versions retrievable. No separate yank key exists.
    # rules:
    #   deny-yanked:
    #     type: DenyIfYanked
    #     appliesTo: [admission]
  # Cargo 1.74+ uses sparse HTTPS. Store index roots without the client's sparse+ marker.
  cargo:
    publicUpstream:
      registry:
        url: https://index.crates.io/
    # enabled: true
    # /cargo/ replaces crates.io. It merges privateUpstream, read with each caller's credential,
    # with admitted crates.io crates. Declared first-party names read privateUpstream only, so
    # declare every private crate name or prefix. privateUpstream must include the mirror repository.
    # /cargo/config.json is answered locally. It requires authentication whenever privateUpstream
    # or server.authToken is set. A configured publicationTarget enables first-party publication
    # at PUT /cargo/api/v1/crates/new.
    # For mirrorTarget and publicationTarget, url is the sparse index root. uploadUrl is
    # the exact approved API base advertised by that index's config.json, without /api/v1/crates/new.
    # Cargo mirroring requires mirrorState.url. Preserve its original source records across restarts.
    # Upstream discovery runs after caller or service authentication, never at boot, and is not cached.
    # Ownership folds ASCII case and hyphen/underscore aliases, preserving separator runs.
    # Names use at most 64 ASCII letters, digits, hyphens, or underscores, starting with a letter.
    # Exact names and prefixes use native Cargo grammar. acme-* covers acme-tools and
    # acme_tools, but excludes acmeco. Cargo has no npm scope.
    # Prefix declarations must end in -* or _*. Exact names preserve each separator run.
    # firstParty: "acme-tools,acme-*"
    # cargo blocks these rule types at boot, even through shared rules:
    # DenyInstallTimeExecution: Cargo's sparse index does not declare build scripts or procedural macros. This rule is unsupported for the ecosystem.
    # DenyIfDeprecated: Cargo's sparse index supplies no deprecation flag.
    # AllowScope: Cargo package names have no scope.
    # Move supported types from shared rules into mounts.npm.rules, or disable its configured
    # entry with enabled: false under mounts.cargo.rules (ECLUSE_MOUNTS__CARGO__RULES).
  # Bundler 2.6.9 and 4.0.23 use /versions discovery and on-demand /info metadata.
  # Compact specifications and .gem downloads stay under this mount. No full specification index is served.
  # Native publication posts the original built .gem to /api/v1/gems below the target root.
  # Reads preserve caller Basic pairs. Publication preserves the raw API key and optional OTP.
  # A static publicationTarget token is the bare secret. On codeArtifact, the mirror worker's
  # token and that static token read with Basic aws and publish as Bearer.
  # Mirroring requires mirrorState.url and retains every supported platform artifact,
  # original compact specifications and source facts. Preserve that state across restarts.
  # DenyInstallTimeExecution: RubyGems native builds are normal installation behaviour. This rule is unsupported for the ecosystem.
  # DenyIfDeprecated: RubyGems metadata supplies no supported deprecation flag.
  # AllowScope: RubyGems package names have no scope.
  # Active entries refuse boot, including rules inherited from the shared policy.
  # Disable an incompatible entry under mounts.rubygems.rules or restrict it to another mount.
  # No client yank relay is supported. Dredger needs physical deletion capability.
  rubygems:
    # Exact names preserve case, dots, hyphens and underscores. A prefix ends
    # with ., - or _ followed by *. Declaring ownership requires privateUpstream.
    # firstParty: "acme-tools,acme-*"
    publicUpstream:
      registry:
        url: https://rubygems.org

# The rule policy. A shipped name below patches that rule, `enabled: false` suppresses
# it, and a new name with a `type` adds one. A rule reads only its own type's parameters,
# and a parameter written under a type that does not read it is refused at load.
#
# Any rule may also set `appliesTo`, the list of phases it applies at. `admission` is the
# gate and the mirror worker's check before a write. `revocation` is the Dredger's check
# of the versions a store already holds. Unset, a rule applies at both, and a patch that
# does not restate the list keeps the phases of the rule it patches. `[admission]` on a
# deny refuses new versions and leaves stored copies in place, because the Dredger then
# passes over the rule. The load refuses an empty list, an empty value, an empty string,
# `[revocation]` alone, an unknown word, and `[admission]` on an allow. `enabled: false`
# switches a rule off at both.
rules:
  # Active when advisories.url is configured, before operator patches.
  # Both phases, precedence 300. An identity allow needs precedence above 300.
  # Disable globally or per mount with deny-known-malicious: { enabled: false }.
  # Partial patches retain activation. enabled: true or an explicit type activates it.
  # Manual activation requires a source, including with onUnavailable: skip.
  deny-known-malicious:
    type: DenyIfKnownMalicious
    onUnavailable: deny
  min-age:
    type: AllowIfOlderThan
    precedence: 100
    ageSeconds: 604800
  # The remediation fast lane. It admits a version a synced advisory names as its exact fix
  # ahead of the min-age quarantine. Like deny-known-malicious, it is active when
  # advisories.url is configured, and the same patches disable or activate it. A patch
  # inherits the keys below that it leaves out. A newly named AllowIfRemediatesCve rule must
  # state onUnavailable and remainingAdvisories, and takes these limits for omitted ones.
  remediation-fast-track:
    type: AllowIfRemediatesCve
    precedence: 150
    # deny refuses a version this rule reaches while advisory evidence is unavailable: no
    # artifact loaded yet, a failed or timed-out read, an open breaker, or an expired or
    # undated push. During an advisory outage an old version then cannot pass the quarantine
    # either, unless a higher-ranked allow admits it. skip abstains, lets the other rules
    # decide, and records the skipped check. Unavailable evidence never claims a fix.
    onUnavailable: deny
    # A partial fix is an exact fix that another advisory still affects. abstain leaves it
    # to the quarantine. differential admits it only when every remaining advisory stores a
    # CVSS at most maxRemainingCvss and an EPSS below maxRemainingEpss, and the highest fixed
    # score exceeds the highest remaining one by each gap. A missing score that a check needs
    # makes the rule abstain. Switching this rule to abstain drops the limits below, and
    # writing a limit beside abstain is refused. differential needs EPSS enrichment, so a
    # failed EPSS feed publishes no artifact for this ecosystem. The rule compares stored
    # scores, which proves no reduced exposure. These numbers are chosen product defaults,
    # not validated safety boundaries.
    remainingAdvisories: differential
    maxRemainingCvss: 6.9   # a CVSS score from 0 to 10, inclusive
    maxRemainingEpss: 0.01  # an EPSS probability from 0 to 1, exclusive: 0.01 is one percent
    minCvssGap: 1.0         # CVSS points. 0 removes the condition
    minEpssGap: 0.0         # probability points: 0.05 is five points, not a relative 5%
  # Opt-in CVE deny gate, absent from this shipped policy. It denies a version a
  # synced advisory records as affected at or above `minCvss` (a CVSS base score,
  # 0-10). Unscored npm malware advisories count as above every threshold, so
  # enabling this also blocks known malware. It sits just below `AllowByIdentity`, so
  # an identity pin still overrides it. It needs advisories.url, so a mount that enables
  # it without one refuses the boot, and with one the mount stays not-ready until Pilot
  # publishes an artifact. On a cold mirror it can deny historical
  # versions your builds depend on. Warm the mirror first:
  # https://ecluse-proxy.com/docs/configuration/#onboarding-the-advisory-denies
  # deny-known-cves:
  #   type: DenyIfCve
  #   minCvss: 8              # CVSS >= 8.0 (high/critical). Unscored malware always blocks
  #   onUnavailable: deny     # fail-closed if the advisory database cannot answer.
  #                           # Set to "skip" to fail-open (availability over the gate)
  #   appliesTo: [admission, revocation]  # the default. [admission] refuses new versions
  #                                       # and keeps the copies your stores already hold
  # Opt-in exploitability deny gate, also absent from this shipped policy. It denies a
  # version a synced advisory records as affected when that advisory's EPSS score (the
  # probability of exploitation in the wild within 30 days, 0-1) is at or above `minEpss`.
  # An individual missing score makes this rule abstain for that advisory. This includes
  # malware without a CVE alias. DenyIfCve retains its independent severity/malware role.
  # Other advisories and rules still apply, including deny-by-default. Missing EPSS alone
  # cannot authorise Dredger deletion. This rule shares DenyIfCve's precedence, and needs
  # advisories.url on the same terms.
  # deny-exploitable-cves:
  #   type: DenyIfEpss
  #   minEpss: 0.5            # EPSS >= 0.5. Individual unscored advisories abstain
  #   onUnavailable: deny     # as for DenyIfCve: "skip" fails open instead
  # Opt-in identity pin, absent from this shipped policy. It admits one package, or one
  # package@version, past the quarantine. `identity` matches the rendered package name
  # exactly, or that name and version joined by an @: no prefix, glob, or range.
  # At precedence 250 it overrides the scored DenyIfCve and DenyIfEpss rules.
  # It stays below DenyIfKnownMalicious, DenyIfYanked, DenyIfDeprecated,
  # DenyInstallTimeExecution, DenyExternalDependencies and DenyByIdentity. Override MAL
  # with precedence 301.
  # pin-fix:
  #   type: AllowByIdentity
  #   identity: left-pad@1.3.0  # a bare name pins every version of that package
  # The npm install-script and external-dependency denies ship under mounts.npm.rules, at
  # admission only. Disable or refine deny-scripts and deny-external-dependencies there.
  # An AllowByIdentity pin needs precedence > 300.
  # Opt-in revoke, absent from this shipped policy. It denies one package, or one
  # package@version, whatever else would admit it. `identity` matches on the same exact
  # terms as AllowByIdentity. It carries the highest precedence of any shipped type, so
  # it is the revoke of last resort.
  # revoke-bad:
  #   type: DenyByIdentity
  #   identity: bad-package     # a bare name revokes every version of that package
