# The defaults Écluse boots from, embedded in the binary. Your config document and the
# ECLUSE_* environment variables override it key by key, in the order defaults <
# document < environment. ECLUSE_CACHE__TTL spells cache.ttl. A commented key is
# INACTIVE: it documents the schema, and names the computed or derived default that
# applies while it stays unset. Put secrets in environment variables, never here. An
# integer key takes a positive integer unless its comment says otherwise. A quoted value
# and an ECLUSE_* variable must spell it in plain digits: a hexadecimal, octal, padded,
# or bracketed spelling is refused there.
#
# The loader owns the whole ECLUSE_ prefix: every ECLUSE_* variable is read as a key of
# this schema, and one that names no key aborts the boot. Two families are consumed
# before the loader sees them and so name no key: ECLUSE_CONFIG, which relocates the
# document, and the *_FILE secret indirections. Never put an unrelated setting under the
# prefix. Écluse also reads the standard AWS_* and OTEL_* variables of the SDKs it
# embeds, which are not keys here and are documented in the operator manual.

server:
  # TCP port, 0 to 65535. 0 binds an OS-assigned ephemeral port. Every role listens
  # here: the proxy serves its mounts and its probes, and the worker roles (mirror,
  # pilot, dredger) serve /livez and /readyz alone. OTEL_METRICS_EXPORTER=prometheus
  # selects the scrape transport and adds a second listener on its own port, addressed
  # by OTEL_EXPORTER_PROMETHEUS_HOST and OTEL_EXPORTER_PROMETHEUS_PORT rather than by a
  # key here.
  port: 8080
  # The proxy's own externally-reachable base URL. The proxy rewrites served tarball
  # URLs against it. http(s) with a dialable authority, and http stays legal for
  # loopback. Required as soon as any mount is active, else the boot refuses
  # (PublicUrlRequired).
  # publicUrl: https://registry.example.com
  # Set via ECLUSE_SERVER__AUTH_TOKEN (a secret): clients must then present it.
  # authToken:
  # A note Écluse appends to client-facing error bodies, e.g. where to ask for access.
  # helpMessage: Contact platform engineering for access
  # Seconds the graceful shutdown waits for in-flight requests and artifact streams.
  shutdownDrainTimeout: 30

# The mirror queue, read only when a mount mirrors. The shape of url picks the
# backend. An SQS queue URL (https://sqs.{region}.amazonaws.com/...) selects the
# durable SQS backend and takes its region from the host. A Pub/Sub topic resource
# (projects/{p}/topics/{t}) names the GCP backend, which Écluse refuses at boot. Unset,
# mirroring runs on the bounded in-memory queue: non-durable, best-effort, and warned
# loudly at boot. That is fine for a single node or a trial. A split deployment
# (ecluse proxy --no-worker beside an ecluse mirror fleet) needs a durable url, because
# in-memory jobs never leave the process that enqueued them: Écluse refuses those roles
# at boot without one.
queue:
  # How many deliveries one mirror job gets before the worker retires it outright. The
  # worker alarms and counts each retirement. A queue with a dead-letter queue attached
  # runs one delivery above that dead-letter queue's own maxReceiveCount. The
  # dead-letter queue therefore always captures the job first. This count is the floor,
  # and the only end a job gets on a queue with no dead-letter queue.
  maxReceiveCount: 5
  # An SQS URL is validated in full: https, a single-label region, a 12-digit account,
  # one queue segment, no port, query, or fragment.
  # url: https://sqs.us-east-1.amazonaws.com/123456789012/ecluse-mirror
  # In-memory queue only. Past the cap an enqueue is dropped (drop-newest) and the
  # package re-mirrors on next demand. Unset, the memory plan computes it.
  # maxMemoryDepth: 50000

limits:
  # The bounds the memory plan does not size, so they stay a pinned policy stance rather
  # than a machine property. The first two bound document shape, not bytes.
  maxVersionCount: 100000
  maxNestingDepth: 64
  # Refuse to download an advisory database larger than this many bytes (512 MiB). The
  # declared length fails fast and the streaming download enforces the cap. It bounds a
  # stream to disk rather than a heap tenant, which is why the plan does not size it.
  maxAdvisoryDatabaseBytes: 536870912
  # The memory plan computes the byte-valued caps at boot, as named tenants of the
  # effective heap ceiling, and the boot log names each decision. Set either one only
  # to override it. maxResponseBytes bounds an upstream metadata body, floored at
  # 12 MiB so real packuments fit, and the fetch aborts fail-closed past it.
  # maxRequestBytes bounds a client request body (a publish), refused with 413.
  # maxResponseBytes: 12582912
  # maxRequestBytes: 26214400
  # The mirror worker's per-artifact fetch cap. The memory plan computes this one too,
  # as the mirror-artifact tenant, sized so the transient publish envelope stays within
  # the heap ceiling. Raising it needs headroom the plan will refuse to boot without.
  # maxArtifactBytes: 536870912

cache:
  # Seconds the packument cache keeps metadata. Non-negative, and a fractional value
  # is refused rather than truncated.
  ttl: 60
  # Écluse computes both bounds at boot from the resolved heap ceiling, as a clamped
  # fraction of it, and the boot log names each decision. Set either one only to
  # override it.
  # maxEntries: 1024
  # One aggregate budget, split across the three stores (full packument 60%, single
  # version 15%, assembled the rest). A pod too small for the plan sheds the
  # mirror-artifact cap first and this aggregate second.
  # maxBytes: 268435456

integrity:
  minPublic: sha256
  minTrusted: sha256 # refinable per mount: mounts.<ecosystem>.integrity.minTrusted
  # What to do when the public and private copies of a version contradict on a shared
  # integrity algorithm (threat #11). Both policies log a WARNING and increment the
  # ecluse.registry.merge.divergence counter. The trusted copy always wins the bytes.
  #   warn        - serve the trusted copy and rely on the alarm (default)
  #   fail-closed - additionally withhold the contested version from the served listing
  divergencePolicy: warn # refinable per mount: mounts.<ecosystem>.integrity.divergencePolicy

# Extra CIDR ranges denied registry egress, on top of the built-in internal-range
# blocklist (comma-separated). Extends the block only. A malformed entry fails closed
# at boot.
# egress:
#   additionalBlockedRanges: "100.64.0.0/10,198.18.0.0/15"

advisories:
  # How often the proxy polls object storage for a fresh advisory database (a cheap
  # ETag HEAD). It is deliberately independent of Pilot's compileInterval, and much
  # more frequent: matching them would nearly double the worst-case advisory age.
  pollInterval: 60
  # Pilot only: how often it recompiles and re-exports the advisory artifacts.
  compileInterval: 3600
  # Where Pilot compiles the advisory databases and where the proxy lands synced ones.
  # It must be writable by the container's user, which in the shipped image is uid
  # 65532, so mount a volume here. The default path is absolute on purpose: the image
  # sets no working directory, and a relative one would land in an unwritable root.
  dataDir: "/var/lib/ecluse/advisories"
  # Base URL of the per-ecosystem OSV advisory exports Pilot compiles from
  # (<base>/<ecosystem>/all.zip). Override it if the upstream moves or you mirror it.
  # A new URL must never require a new Écluse binary. Allowlist this host for Pilot's
  # egress, not osv.dev.
  osvExportBaseUrl: "https://osv-vulnerabilities.storage.googleapis.com"
  # The EPSS daily feed Pilot joins onto the advisories by CVE id, on the same terms:
  # override it if the upstream moves or you mirror it, and allowlist this host for
  # Pilot's egress. The DenyIfEpss rule reads the scores it supplies.
  epssFeedUrl: "https://epss.empiricalsecurity.com/epss_scores-current.csv.gz"
  # The object store the compiled advisory databases sync from, as
  # s3://<bucket>[/<prefix>]. The scheme picks the provider, the way queue.url does, and
  # a scheme this build does not know is refused at load. AWS_ENDPOINT_URL still points
  # the S3 client at an emulator or a VPC endpoint. Unset, the advisory stack is off.
  # AllowIfRemediatesCve then abstains. DenyIfCve and DenyIfEpss follow their own
  # onUnavailable policy instead, and its default `deny` fails closed with a 503.
  # url: s3://my-advisory-bucket/ecluse

# Process sizing. Écluse computes every key at boot from the container's cgroup
# limits, the RTS posture, and the file-descriptor budget. The boot log records each
# decision with its provenance. Set a key only to override the computed value.
# runtime:
#   # Cores the process claims. Unset, they resolve down a ladder: the cgroup CPU quota
#   # floored, else the count the cgroup memory limit can feed, else coresCeiling, each
#   # clamped to the visible processors. The boot log names the rung that fired, and the
#   # memory plan may shed some on a small pod. Give the container whole cores.
#   cores: 4
#   # The cap on the last rung of that ladder, which fires only when no cgroup CPU quota
#   # and no cgroup memory limit bind this process (bare metal, or a pod with neither
#   # limit set). It never caps an explicit cores, a CPU quota, or the memory-derived
#   # count. Prefer setting cores over raising this.
#   coresCeiling: 8
#   # Heap ceiling in bytes: the cgroup memory limit less the nursery budget and 10%
#   # slack, floored at half the limit. Enforcing it re-executes the binary once. A
#   # breach is a clean heap-overflow error, not a kernel OOM kill.
#   maxHeapBytes: 1073741824
#   # Concurrent metadata materialisations, computed from cores and the heap ceiling
#   # (the boot log names the value). Over it a request waits up to 1 s for a slot,
#   # then gets 503 with Retry-After: 1. That 503 is backpressure: exclude it from
#   # alerts. A real upstream failure returns 503 without the header.
#   serveMaxInFlight: 128
#   # Pooled connections per public upstream host: clamp (32, 1024) (nofile / 8).
#   # Connections beyond the pool still open, but re-handshake TLS each time.
#   publicConnectionsPerHost: 64
#   # Pooled connections to the private upstream host: nofile / 4, clamped to 64..4096.
#   privateConnectionsPerHost: 256

observability:
  # json: one JSON object per line, for log collectors. console: human-readable.
  logFormat: json
  # The lowest severity Écluse logs: debug, info, warn, or error. Debug carries the
  # per-decision diagnostics, such as mirror probes and artifact fetches, and is
  # verbose under load.
  logLevel: info
  # The OpenTelemetry master switch, on or off. Off, Écluse emits no telemetry. Logs
  # go to stdout either way. Quote the value: YAML reads a bare off as the boolean
  # false, which the load then refuses as the wrong type.
  telemetry: "off"

mounts:
  # Dormant per-ecosystem templates. A mount activates only when your document or
  # environment declares any key under it. `enabled: true` alone is enough for the
  # serve-only pure public gate, and declaring `mirrorTarget` is what makes a mount
  # mirror.
  # Every registry endpoint below must be an https:// URL carrying a dialable host, and
  # none may carry userinfo, a query, or a fragment: a credential belongs in its own
  # key. The boot refuses anything else, naming the key.
  npm:
    publicUpstream: https://registry.npmjs.org
    # The only key the serve-only pure public gate needs. false switches off a mount
    # whose other keys remain.
    # enabled: true
    # The read authority. Required on a mirrored mount, so the mirror reads back.
    # Optional on a serve-only mount, where it still merges with the gated public set.
    # privateUpstream: https://acme-123456789012.d.codeartifact.us-east-1.amazonaws.com/npm/internal/
    # Declaring it makes the mount mirrored. The write credential derives from this
    # URL: a CodeArtifact host mints a short-lived token scoped to its domain, and any
    # other host needs mirrorTargetToken.
    # mirrorTarget: https://acme-123456789012.d.codeartifact.us-east-1.amazonaws.com/npm/mirror/
    # Set via ECLUSE_MOUNTS__NPM__MIRROR_TARGET_TOKEN (a secret). Required for a
    # non-CodeArtifact mirror target, forbidden for a CodeArtifact one or a serve-only mount.
    # mirrorTargetToken:
    # Lifetime in seconds of a minted mirror-write token. The mint provider comes from
    # the mirror target, so this key names none: for a CodeArtifact target the bound is
    # 900 to 43200, and unset CodeArtifact defaults it to the caller's role-credential
    # expiry. The refresh policy adapts to the minted token's actual expiry, so this is
    # a preference.
    # mirrorTokenDuration: 3600
    # Where a client `npm publish` is relayed. Opt-in: unset, PUT /{pkg} is 405.
    # publicationTarget: https://acme-123456789012.d.codeartifact.us-east-1.amazonaws.com/npm/internal/
    # Set via ECLUSE_MOUNTS__NPM__PUBLICATION_TARGET_TOKEN (a secret). Forwarded only
    # when the publishing client sends none. Requires server.authToken, or the boot
    # refuses (PublishStaticCredentialNeedsEdge).
    # publicationTargetToken:
    # Names a client may publish. Required with a publication target. The shape is
    # per-ecosystem, and npm reads it as a comma-separated list of scopes. It limits
    # names, not callers, and an empty or malformed list is refused at load.
    # publicationAllow: "@acme,@beta"
    # Per-mount refinements of the integrity group above, under the same key names.
    # integrity:
    #   minTrusted: sha256
    #   divergencePolicy: warn
    # Per-mount rule refinement, merged over the shared policy with the same schema
    # as the top-level rules.
    # rules: {}
  # No adapter ships for these two yet, so activating either refuses the boot. The
  # public upstream is here so the key is settled before the ecosystem lands.
  pypi:
    publicUpstream: https://pypi.org
  rubygems:
    publicUpstream: https://rubygems.org

# The rule policy. A shipped name below patches that rule, `enabled: false` suppresses
# it, and a new name with a `type` adds one. A rule reads only its own type's parameters,
# and a parameter written under a type that does not read it is refused at load.
rules:
  min-age:
    type: AllowIfOlderThan
    precedence: 100
    ageSeconds: 604800
  # The remediation fast lane. Écluse admits a version a synced advisory names as its
  # exact fix ahead of the min-age quarantine. With no advisory database configured
  # (no advisories.url) the rule abstains, and only the quarantine governs.
  remediation-fast-track:
    type: AllowIfRemediatesCve
    precedence: 150
  # Opt-in scope allow-list, absent from this shipped policy. It admits every version
  # under an npm scope you already trust, past the quarantine, without reaching the
  # advisory database. It sits above min-age and below every deny.
  # trust-our-scope:
  #   type: AllowScope
  #   scope: acme            # the scope without its leading @
  # Opt-in CVE deny gate, absent from this shipped policy. It denies a version a
  # synced advisory records as affected at or above `minCvss` (a CVSS base score,
  # 0-10). Unscored npm malware advisories count as above every threshold, so
  # enabling this also blocks known malware. It sits just below `AllowByIdentity`, so
  # an identity pin still overrides it. On a cold mirror it can deny historical
  # versions your builds depend on. Warm the mirror first:
  # https://ecluse-proxy.com/docs/configuration/#onboarding-the-advisory-denies
  # deny-known-cves:
  #   type: DenyIfCve
  #   minCvss: 8              # CVSS >= 8.0 (high/critical). Unscored malware always blocks
  #   onUnavailable: deny     # fail-closed if the advisory database cannot answer.
  #                           # Set to "skip" to fail-open (availability over the gate)
  # Opt-in exploitability deny gate, also absent from this shipped policy. It denies a
  # version a synced advisory records as affected when that advisory's EPSS score (the
  # probability of exploitation in the wild within 30 days, 0-1) is at or above `minEpss`.
  # An advisory the artifact carries no EPSS score for counts as above every threshold,
  # and on the npm feed that is most of them: EPSS keys on CVE ids, and the malware
  # advisories carry no CVE alias. Enable it as a companion to `deny-known-cves`, not as a
  # cheaper substitute, and warm the mirror first as for that rule. It shares
  # `DenyIfCve`'s precedence, so an identity pin overrides it too.
  # deny-exploitable-cves:
  #   type: DenyIfEpss
  #   minEpss: 0.5            # EPSS >= 0.5. Unscored advisories always block
  #   onUnavailable: deny     # as for DenyIfCve: "skip" fails open instead
  # Opt-in identity pin, absent from this shipped policy. It admits one package, or one
  # package@version, past the quarantine. `identity` matches the rendered package name
  # exactly, or that name and version joined by an @: no prefix, glob, or range. It sits
  # above both advisory denies, so a pin overrides either, and below
  # DenyInstallTimeExecution and DenyByIdentity.
  # pin-fix:
  #   type: AllowByIdentity
  #   identity: left-pad@1.3.0  # a bare name pins every version of that package
  # Opt-in install-script deny, absent from this shipped policy. It denies a version
  # whose manifest runs code at install time. It sits above every allow, so no pin
  # admits a version it denies. Many legitimate packages ship install scripts, so
  # enabling it breaks builds until you know which of yours do.
  # deny-scripts:
  #   type: DenyInstallTimeExecution
  # Opt-in revoke, absent from this shipped policy. It denies one package, or one
  # package@version, whatever else would admit it. `identity` matches on the same exact
  # terms as AllowByIdentity. It carries the highest precedence of any shipped type, so
  # it is the revoke of last resort.
  # revoke-bad:
  #   type: DenyByIdentity
  #   identity: bad-package     # a bare name revokes every version of that package
