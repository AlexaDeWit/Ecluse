name: Set up toolchain
description: >-
  Install the flake-pinned Nix, restore the Nix store, and optionally the cabal store
  and build dir. One home for the SHA-pinned setup actions and the cache config, so
  Dependabot bumps each pin once.

  Caching policy: restore everywhere, save only on main, one writer per key. A PR
  restores main's entries through GitHub's base-branch fallback and never saves. That
  rule is what holds the repo under the 10 GB Actions-cache quota.

  The release image builds never use this action, because a Nix store restored from the
  unsigned Actions cache would undermine their provenance attestation. See
  docs/architecture/release-supply-chain.md.

inputs:
  cabal-cache:
    description: >-
      Also restore the cabal store and dist-newstyle. Enable it for a job that builds
      Haskell. The format, lint, Semgrep, and workflow checks build nothing and leave
      it off.
    default: "false"
  save-nix-store:
    description: >-
      Whether this job may save the Nix-store cache (only ever on main). Set "false"
      for a job that restores a prefix another job writes, so the two never race for
      the one entry.
    default: "true"
  nix-cache-prefix:
    description: >-
      The Nix-store cache key prefix, one entry per distinct closure. "nix" is the
      shared `.#ci` dev-shell store, written by build-test. "nix-docs" is the
      Nix-built Haskell closure, the ~188-package dependency set that both
      `checks.docs` and `.#dockerImage` link against: the docs job writes it and the
      e2e job reads it. A job that realises neither closure needs its own prefix and
      must be its sole writer. prune-caches.sh keeps one epoch per prefix.
    default: "nix"
  nix-gc-max-store-size:
    description: >-
      The size cache-nix-action trims the Nix store to before saving. The trim is a
      `nix store gc`, so an unrooted closure is absent from the saved entry and every
      later run re-substitutes it. Size the cap above the store the job accumulates
      (restored epoch plus build inputs plus outputs), and root what the entry must
      carry. The cap is on the uncompressed store, which compresses about 5x into the
      entry the quota counts.
    default: "10G"

outputs:
  cabal-cache-hit:
    description: >-
      "true" only on an exact key match on the cabal-store restore below: the restored
      package index already covers cabal.project's pinned index-state, so the caller
      can skip `cabal update`. "false" on a restore-keys prefix fallback or a miss,
      and empty when cabal-cache is "false".
    value: ${{ steps.restore-cabal-store.outputs.cache-hit }}
  cabal-version:
    description: >-
      The ecluse.cabal `version:` field. Every build-product cache key carries it as a
      family segment, so a restore never brings an older package version's tree along.
    value: ${{ steps.package-version.outputs.cabal-version }}
  dist-cache-hit:
    description: >-
      "true" only on an exact key match on the dist-newstyle restore below, which happens
      on a re-run of a commit main already saved. Empty when cabal-cache is "false".
    value: ${{ steps.restore-dist.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Free disk space
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/ci-free-disk.sh

    # Both stores go on /mnt, so a runner image that backs it with a separate volume
    # gets the headroom. The mount precedes the Nix install, the data-root any Docker.
    - name: Relocate the Nix store and Docker data-root onto /mnt
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo mkdir -p /mnt/nix /nix
        sudo mount --bind /mnt/nix /nix
        sudo systemctl stop docker.service docker.socket
        sudo mkdir -p /mnt/docker
        if [ -f /etc/docker/daemon.json ]; then
          sudo jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json \
            | sudo tee /etc/docker/daemon.json.tmp >/dev/null
          sudo mv /etc/docker/daemon.json.tmp /etc/docker/daemon.json
        else
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json >/dev/null
        fi
        sudo systemctl start docker.service
        docker info --format 'Docker root: {{.DockerRootDir}}'

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      with:
        # Determinate Nix logs the runner in to FlakeHub, which adds substituters no
        # run is authorised for and a root-only auth_state.json that fails the save.
        determinate: false
        # auto-optimise-store's /nix/store/.links hard links break the cache restore
        # (nix-community/cache-nix-action#170). The rest hardens the cold substitute.
        extra-conf: |
          connect-timeout = 10
          download-attempts = 5
          auto-optimise-store = false

    # Keyed on the flake. Two conditions gate the save, main and the save-nix-store
    # input, so exactly one job writes each prefix and no two race for one entry.
    - name: Cache Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: ${{ inputs.nix-cache-prefix }}-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: ${{ inputs.nix-cache-prefix }}-${{ runner.os }}-
        save: ${{ inputs.save-nix-store == 'true' && github.ref == 'refs/heads/main' }}
        gc-max-store-size-linux: ${{ inputs.nix-gc-max-store-size }}

    # Read once here, so every workflow keys its build-product caches the same way.
    - name: Read the package version
      id: package-version
      shell: bash
      run: |
        version="$(sed -n 's/^version:[[:space:]]*//p' ecluse.cabal)"
        version="${version//[[:space:]]/}"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "setup-toolchain: unrecognised ecluse.cabal version: '$version'" >&2
          exit 1
        fi
        echo "cabal-version=$version" >> "$GITHUB_OUTPUT"

    # The key covers the dependency plan and deliberately not `**/*.cabal`: that
    # pattern churned a fresh ~0.6 GB entry on every commit that added a module.
    - name: Restore cabal store
      if: inputs.cabal-cache == 'true'
      id: restore-cabal-store
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.cabal
        key: cabal-store-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}
        restore-keys: |
          cabal-store-${{ runner.os }}-

    # Small and fast-moving, so a separate key from the store. The key ends in the
    # commit, so each main run saves a fresh entry instead of meeting one that already
    # exists. A restore takes the newest entry of the version family through the prefix
    # and recompiles only the changed local modules, never the closure.
    - name: Restore dist-newstyle
      if: inputs.cabal-cache == 'true'
      id: restore-dist
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: dist-newstyle
        key: dist-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.package-version.outputs.cabal-version }}-${{ github.sha }}
        restore-keys: |
          dist-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.package-version.outputs.cabal-version }}-
