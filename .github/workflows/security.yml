name: Security

# Haskell advisory scanning, report-only: it never gates a PR, because findings arrive
# with disclosure time, not with in-PR changes. osv-scanner matches every exact pin in
# cabal.project.freeze against OSV.dev, home to the HSEC advisories the GitHub Advisory
# Database lacks. The freeze is the committed projection of the Nix package set, so it
# covers the statically linked Haskell libraries no image scan can see.
#
# The SARIF goes to GitHub code scanning, so a human triages every finding in the
# Security tab. The C closure's grype scan runs in ci.yml's nightly run. See
# docs/architecture/release-supply-chain.md, "Vulnerability scanning and dependency
# updates".
on:
  pull_request:
    paths: ["flake.lock", "flake.nix", "cabal.project.freeze", ".github/workflows/security.yml"]
  schedule:
    - cron: "27 6 * * *" # daily, off-peak minute
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  osv-freeze:
    name: Haskell advisories (OSV/HSEC over the freeze)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the osv-scanner SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      # Findings are report-only, so only a scanner error fails here.
      - name: Scan cabal.project.freeze (osv-scanner)
        run: nix develop .#ci --command task scan-osv

      - name: Upload osv-scanner SARIF to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: osv-freeze.sarif
          category: osv-hsec
