name: Security

# Report-only Haskell advisory scanning against OSV/HSEC, including the vendored
# json-stream freeze. Disclosure timing makes this unsuitable as a PR gate.
# The freezes cover statically linked Haskell libraries absent from image scans.
# Upload SARIF to the Security tab for human triage. The nightly CI scans the C
# closure with grype. See docs/architecture/release-supply-chain.md,
# "Vulnerability scanning and dependency updates".
on:
  pull_request:
    paths: ["flake.lock", "flake.nix", "cabal.project.freeze", "vendor/json-stream/json-stream.freeze", ".github/workflows/security.yml"]
  schedule:
    - cron: "27 6 * * *" # daily, off-peak minute
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  osv-freeze:
    name: Haskell advisories (OSV/HSEC over the freeze)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the osv-scanner SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      # Findings are report-only, so only a scanner error fails here.
      - name: Scan the freezes (osv-scanner)
        run: nix develop .#ci --command task scan-osv

      - name: Upload osv-scanner SARIF to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: osv-freeze.sarif
          category: osv-hsec
