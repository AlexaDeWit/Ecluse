name: Security

# Haskell advisory scanning. It never gates a PR, because findings arrive with disclosure,
# not with a change. osv-scanner matches every pin in cabal.project.freeze against OSV.dev,
# which has the HSEC advisories the GitHub Advisory Database lacks. The freeze projects the
# Nix package set, so it covers the statically linked Haskell libraries no image scan sees.
# Each in-tree fork's upstream.freeze names the release its source derives from. A human
# triages the SARIF in the Security tab. ci.yml's nightly run scans the C closure (grype).
# See docs/architecture/release-supply-chain.md, "Vulnerability scanning and dependency updates".
on:
  pull_request:
    paths: ["flake.lock", "flake.nix", "cabal.project.freeze", "json-stream/upstream.freeze", "vendor/lzma-managed/upstream.freeze", ".github/workflows/security.yml"]
  schedule:
    - cron: "27 6 * * *" # daily, off-peak minute
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  osv-freeze:
    name: Haskell advisories (OSV/HSEC over the freeze)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the osv-scanner SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: $/.github/actions/setup-toolchain

      # Findings are report-only, so only a scanner error fails here.
      - name: Scan the freezes (osv-scanner)
        run: nix develop .#ci --command task scan-osv

      - name: Upload osv-scanner SARIF to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv-freeze.sarif
          category: osv-hsec
