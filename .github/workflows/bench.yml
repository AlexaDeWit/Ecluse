name: Benchmarks

# Benchmark policy: ../../docs/testing.md#benchmarks-non-gating
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# One run per ref. Cancel a superseded PR run when a newer commit lands, because only
# the latest commit's numbers matter. Never cancel a manual dispatch.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: a read-only token is all this workflow needs. Artifact upload uses
# the run's own artifact service (the runtime token), not the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  bench:
    name: Work-per-request benchmarks (inform-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pin the cabal store to a deterministic, cacheable location, as the other
      # Haskell jobs do.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Restore the warm cabal store (this job compiles the benchmark).
          cabal-cache: "true"
          # Restore the shared Nix store but never write it. The build-test job on
          # main is the single writer. This job realises the same `.#ci` closure, so a
          # save here would race and bloat the canonical entry. Restore-only.
          save-nix-store: "false"

      # Skipped on an exact cabal-store cache hit: the restored index already covers
      # cabal.project's pinned index-state. `cabal update` otherwise hits Hackage's
      # TUF metadata over the network every run, including its occasional
      # dead-mirror fallback.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # pipefail preserves the harness exit code through tee's output capture.
      - name: Run benchmarks
        run: |
          set -eo pipefail
          nix develop .#ci --command task bench BENCH_OPTS='--csv bench-results.csv --stdev 10' 2>&1 | tee bench-output.txt

      # The renderer accepts partial CSV output and reports a missing CSV without failing.
      - name: Render results to the run summary
        if: always()
        run: nix develop .#ci --command task bench-report

      # Preserve partial output when the harness fails.
      - name: Upload this run's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench-results.csv
            bench-output.txt
          if-no-files-found: warn
