name: Benchmarks

# Runs on every pull request and on manual dispatch. The benchmarks are a standalone,
# inform-only tier. ci.yml's `gate` does not depend on them, so they never block a
# merge. A run's only red state is a literal benchmark failure: a build error, a
# crashed harness, or a tripped complexity assertion. It never computes a
# perf-regression fail. The run summary reports time and allocations for a human to
# read, never against a threshold. There is no cross-run baseline: a run's results are
# downloadable from its own page, and no other run consumes them.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# One run per ref. Cancel a superseded PR run when a newer commit lands, because only
# the latest commit's numbers matter. Never cancel a manual dispatch.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: a read-only token is all this workflow needs. Artifact upload uses
# the run's own artifact service (the runtime token), not the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  bench:
    name: Work-per-request benchmarks (inform-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pin the cabal store to a deterministic, cacheable location, as the other
      # Haskell jobs do.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Restore the warm cabal store (this job compiles the benchmark).
          cabal-cache: "true"
          # Restore the shared Nix store but never write it. The build-test job on
          # main is the single writer. This job realises the same `.#ci` closure, so a
          # save here would race and bloat the canonical entry. Restore-only.
          save-nix-store: "false"

      # Skipped on an exact cabal-store cache hit: the restored index already covers
      # cabal.project's pinned index-state. `cabal update` otherwise hits Hackage's
      # TUF metadata over the network every run, including its occasional
      # dead-mirror fallback.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # Run the benches. `tee` captures the console output (progress lines, the
      # generator tests, the complexity assertions) for the report's raw-output
      # section. The harness writes the CSV the report renders from. pipefail: `tee`
      # must not mask a tripped complexity assertion or a crashed harness.
      # `task bench` never gates on performance, so this step fails only on a genuine
      # benchmark failure.
      - name: Run benchmarks
        run: |
          set -eo pipefail
          nix develop .#ci --command task bench BENCH_OPTS='--csv bench-results.csv --stdev 10' 2>&1 | tee bench-output.txt

      # Render the CSV as the structured Markdown report. The renderer writes to
      # stdout and appends to $GITHUB_STEP_SUMMARY itself, as the load and acceptance
      # harnesses do. The step therefore needs no shell wrapping and stays
      # injection-free. It runs even on a red bench. A partial CSV is still worth
      # reading, and a missing CSV renders as an explicit note, never a second failure.
      - name: Render results to the run summary
        if: always()
        run: nix develop .#ci --command task bench-report

      # This run's results, downloadable from the run page (the CSV and the console
      # table). A convenience for a human comparing by hand: there is no cross-run
      # baseline store. Uploaded even when a complexity assertion fails, so the numbers
      # survive a red run.
      - name: Upload this run's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench-results.csv
            bench-output.txt
          if-no-files-found: warn
