name: Benchmarks

# Benchmark policy: ../../docs/testing.md#benchmarks-non-gating
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Main supplies baselines. Dispatch on a reviewed PR branch when measurements are required.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

# Artifact upload uses the run's runtime token, not the GITHUB_TOKEN. The baseline fetch
# reads main's runs and artifacts with the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  bench:
    name: Work-per-request benchmarks (inform-only)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    env:
      # Pin the cabal store to a deterministic, cacheable location, as the other
      # Haskell jobs do.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: $/.github/actions/setup-toolchain
        with:
          # Restore the warm cabal store (this job compiles the benchmark).
          cabal-cache: "true"

      # An exact cabal-store hit already covers cabal.project's pinned index-state.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Run benchmarks
        id: measure
        run: nix develop .#ci --command task performance:benchmark-measure

      # The renderer accepts partial CSV output and reports a missing CSV without failing.
      - name: Render results to the run summary
        if: always()
        run: nix develop .#ci --command task bench-report

      - name: Audit per-ecosystem benchmark receipts
        if: always()
        env:
          PERF_NATIVE_OUTCOME: ${{ steps.measure.outcome }}
        run: nix develop .#ci --command task performance:benchmark-receipt

      # The runs on main are the baseline. A missing baseline renders as "no baseline".
      - name: Fetch the latest results on main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/perf-baseline.sh bench.yml "bench-results-$RUNNER_ARCH-" "$RUNNER_TEMP/perf-baseline"

      - name: Compare time with main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -eo pipefail
          nix develop .#ci --command task against-main KIND=bench BASELINE="$RUNNER_TEMP/perf-baseline" REPORT=bench-results.csv | tee against-main.md

      # Preserve partial output when the harness fails.
      - name: Upload this run's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results-${{ runner.arch }}-${{ github.sha }}
          path: |
            bench-results.csv
            bench-output.txt
            against-main.md
            scratchpad/performance/benchmark/
          if-no-files-found: warn
