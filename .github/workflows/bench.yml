name: Sharing coverage preparation
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact source head approved by the independent reviewer
        required: true
        type: string
      lead_reviewed:
        description: Lead reviewed this exact measurement head
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sharing-coverage-1633-${{ github.ref }}
  cancel-in-progress: false
jobs:
  coverage:
    if: github.ref == 'refs/heads/measure/1633-sharing-coverage' && inputs.lead_reviewed
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
      EXPECTED_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      SHARING_LEAD_REVIEWED: ${{ inputs.lead_reviewed }}
    steps:
      - name: Checkout reviewed measurement head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: 'true'
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update
      - name: Collect bounded sharing counts
        run: nix develop .#ci --command task --taskfile scratchpad/1633-sharing-coverage/static.yml host-run
      - name: Preserve statuses and failed partials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharing-coverage-1633-${{ github.sha }}
          path: scratchpad/1633-sharing-coverage/host-results
          if-no-files-found: warn
