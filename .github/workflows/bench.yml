name: Benchmarks

# Benchmark policy: ../../docs/testing.md#benchmarks-non-gating
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      focused_validation:
        description: Run temporary source-bound acceptance checks
        type: boolean
        default: false
      focused_source:
        description: Exact reviewed source SHA, required for focused validation
        type: string
        default: ''

# One run per ref. Cancel a superseded PR run when a newer commit lands, because only
# the latest commit's numbers matter. Never cancel a manual dispatch.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The repository token reads source and baseline artifacts. Upload uses the run's artifact token.
permissions:
  contents: read

jobs:
  bench:
    if: github.event_name != 'workflow_dispatch' || !inputs.focused_validation
    name: Work-per-request benchmarks (inform-only)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      # Pin the cabal store to a deterministic, cacheable location, as the other
      # Haskell jobs do.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Restore the warm cabal store (this job compiles the benchmark).
          cabal-cache: "true"

      # An exact cabal-store hit already covers cabal.project's pinned index-state.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Run benchmarks
        id: measure
        run: nix develop .#ci --command task performance:benchmark-measure

      # The renderer accepts partial CSV output and reports a missing CSV without failing.
      - name: Render results to the run summary
        if: always()
        run: nix develop .#ci --command task bench-report

      - name: Audit per-ecosystem benchmark receipts
        if: always()
        env:
          PERF_NATIVE_OUTCOME: ${{ steps.measure.outcome }}
        run: nix develop .#ci --command task performance:benchmark-receipt

      # Comparisons against main are informational. Bound their network waits to five minutes.
      - name: Fetch the latest results on main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/perf-baseline.sh bench.yml "bench-results-$RUNNER_ARCH-" "$RUNNER_TEMP/perf-baseline"

      - name: Compare time with main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -eo pipefail
          nix develop .#ci --command task against-main KIND=bench BASELINE="$RUNNER_TEMP/perf-baseline" REPORT=bench-results.csv | tee against-main.md

      # Preserve partial output when the harness fails.
      - name: Upload this run's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ runner.arch }}-${{ github.sha }}
          path: |
            bench-results.csv
            bench-output.txt
            against-main.md
            scratchpad/performance/benchmark/
          if-no-files-found: warn

  focused-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.focused_validation
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    env:
      FOCUSED_SOURCE: ${{ inputs.focused_source }}
      FOCUSED_HARNESS: ${{ github.workspace }}
      FOCUSED_CHECKOUT: ${{ github.workspace }}/scratchpad/focused-source
      FOCUSED_EVIDENCE: ${{ github.workspace }}/scratchpad/focused-evidence
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout temporary harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a fixed source
        run: |
          test "$GITHUB_REF" = refs/heads/measure/refactor-focused-validation
          [[ "$FOCUSED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.focused_source }}
          path: scratchpad/focused-source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: 'true'
          dist-cache: 'false'
      - name: Update the package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        working-directory: scratchpad/focused-source
        run: env -u IN_NIX_SHELL nix develop --command task update
      - name: Run source-bound acceptance checks
        working-directory: scratchpad/focused-source
        run: env -u IN_NIX_SHELL nix develop --command task --exit-code --taskfile "$FOCUSED_HARNESS/taskfiles/focused-validation.yml" run
      - name: Upload partial and completed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: scratchpad/focused-evidence
          if-no-files-found: error
