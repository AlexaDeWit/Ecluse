name: Temporary PR 1619 cost attribution

# The registered filename permits dispatch from this temporary branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cost-profile-1619-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cost-profile:
    if: github.ref == 'refs/heads/measure/1619-cost-profile'
    name: PyPI cold full-read cost attribution
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 210
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout measurement harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable native candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d263d5a18c9975395193fbd3ba6654aae640439b
          fetch-depth: 2
          path: scratchpad/cost-profile-sources/d263d5a18c9975395193fbd3ba6654aae640439b
          persist-credentials: false

      - name: Checkout immutable main parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4b0b5d12d478fc5dac4112e374f4b2d030b640cf
          path: scratchpad/cost-profile-sources/4b0b5d12d478fc5dac4112e374f4b2d030b640cf
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          dist-cache: "false"

      - name: Profile the two captures at both sources
        run: bash scripts/profile-1619-cost.sh

      - name: Record job status
        if: always()
        env:
          COST_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p scratchpad/1619-cost-profile
          printf 'job_status=%s\n' "$COST_JOB_STATUS" > scratchpad/1619-cost-profile/job-status.txt

      - name: Upload profiles and partial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cost-profile-1619-${{ runner.arch }}-${{ github.sha }}
          path: scratchpad/1619-cost-profile/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
