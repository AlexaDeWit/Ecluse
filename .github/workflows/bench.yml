name: Benchmarks

# Benchmark policy: ../../docs/testing.md#benchmarks-non-gating
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refactor_comparison:
        description: Run the issue 1565 comparison on one worker
        type: boolean
        default: false
      refactor_source:
        description: Exact 40-character candidate commit for the temporary comparison
        type: string
        default: ''

# Keep manual measurements running when a newer commit arrives.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Artifact upload uses the runtime token.
permissions:
  contents: read

jobs:
  refactor-comparison:
    name: Temporary issue 1565 comparison
    if: github.event_name == 'workflow_dispatch' && inputs.refactor_comparison
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
      REFRACTOR_CANDIDATE: ${{ inputs.refactor_source }}
    steps:
      - name: Checkout comparison controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          dist-cache: "false"
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update
      - name: Build and measure both sources serially
        run: nix develop .#ci --command task performance:comparison:run
      - name: Upload complete and partial comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refactor-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: scratchpad/refactor-comparison/evidence/
          if-no-files-found: error

  bench:
    if: github.event_name != 'workflow_dispatch' || !inputs.refactor_comparison
    name: Work-per-request benchmarks (inform-only)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      # Pin the cabal store to a deterministic, cacheable location, as the other
      # Haskell jobs do.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Restore the warm cabal store (this job compiles the benchmark).
          cabal-cache: "true"

      # An exact cabal-store hit already covers cabal.project's pinned index-state.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Run benchmarks
        id: measure
        run: nix develop .#ci --command task performance:benchmark-measure

      # The renderer accepts partial CSV output and reports a missing CSV without failing.
      - name: Render results to the run summary
        if: always()
        run: nix develop .#ci --command task bench-report

      - name: Audit per-ecosystem benchmark receipts
        if: always()
        env:
          PERF_NATIVE_OUTCOME: ${{ steps.measure.outcome }}
        run: nix develop .#ci --command task performance:benchmark-receipt

      # Off main only: the runs on main are the baseline. A missing baseline renders as
      # "no baseline". Both steps continue on error and stop after five minutes, so neither
      # can fail or stall the job.
      - name: Fetch the latest results on main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/perf-baseline.sh bench.yml "bench-results-$RUNNER_ARCH-" "$RUNNER_TEMP/perf-baseline"

      - name: Compare time with main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -eo pipefail
          nix develop .#ci --command task against-main KIND=bench BASELINE="$RUNNER_TEMP/perf-baseline" REPORT=bench-results.csv | tee against-main.md

      # Preserve partial output when the harness fails.
      - name: Upload this run's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ runner.arch }}-${{ github.sha }}
          path: |
            bench-results.csv
            bench-output.txt
            against-main.md
            scratchpad/performance/benchmark/
          if-no-files-found: warn
