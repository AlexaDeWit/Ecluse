name: JSON fork formatting and lint
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact candidate commit to format
        required: true
        type: string
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Format the candidate
        run: nix develop .#ci --command task format
      - name: Lint the formatted candidate
        run: nix develop .#ci --command task lint
      - name: Save the formatting patch
        if: always()
        run: git diff --binary > source-format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-format
          path: source-format.patch
          if-no-files-found: error
