name: Docs

# Publish the project site to GitHub Pages so it tracks the code on main. The site is
# the home page at the root and the library's Haddock API docs under /api. Runs
# nightly and on demand (see the schedule below), not on every push. This is a
# separate lifecycle from the PR `gate` in ci.yml, because a docs-deploy failure must
# never block a merge. Like every workflow here, each action carries a full commit SHA
# pin, which Dependabot keeps current.
on:
  # Nightly rebuild, so the site tracks main without deploying on every push. The
  # main branch moves fast, and most pushes touch no site content. Each redundant
  # deploy is a fresh chance to hit the Pages backend's intermittent "try again
  # later" or its ~10-builds/hour soft limit. 07:17 UTC is roughly 03:17 in
  # America/Montreal. The off-the-hour minute dodges the top-of-hour cron congestion
  # GitHub warns about. A scheduled run always executes against the latest main
  # commit, so this publishes current main.
  schedule:
    - cron: "17 7 * * *"
  # On demand, to speed up a publish (say, right after a threat-model or doc change)
  # rather than waiting for the nightly run.
  workflow_dispatch:

# Serialise Pages deploys: only one runs at a time. The `pages` group collapses any
# runs queued behind the in-flight one down to the latest, so a burst of merges still
# publishes once. The cancel-in-progress setting is deliberately false. A deploy that
# reaches its final step has already registered a deployment with the Pages backend.
# Cancelling it mid-flight can leave that deployment wedged, and the backend then
# rejects the next push with "Deployment failed, try again later" until it clears.
# Letting the in-flight production deploy finish avoids that, and it matches GitHub's
# own Pages starter workflow. Pages publishes atomically, so a superseded build leaves
# the prior deployment live until the newer one completes. There is no half-applied
# state, and the cost is at most one extra build's worth of CI.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege: read the repo, write the Pages artifact and deployment, and mint
# the OIDC token the deploy step exchanges with the Pages service.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & deploy site
    runs-on: ubuntu-latest
    # Without this bound the job falls back to GitHub's six-hour default.
    # Observed ~12 min mean, 22 min worst.
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    env:
      # Pin the cabal store to a deterministic, cacheable location (as in ci.yml).
      # Unlike the gate jobs, Pages does NOT restore build-test's pristine cabal
      # store into this directory. It fills the directory with the
      # documentation-variant closure instead (see the doc-variant cache steps below).
      CABAL_DIR: ${{ github.workspace }}/.cabal
      # The build directory `task site` writes Haddock and the OpenAPI manifest into.
      # Its own dist-docs-* key keeps the doc-variant build products from colliding
      # with the gate's regular-variant dist-newstyle entry.
      DOCS_BUILDDIR: dist-docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same SHA-pinned setup as the gate jobs: install Nix, restore the shared Nix
      # store. The save-nix-store: false input keeps Pages RESTORE-ONLY for the Nix
      # store. The build-test job is the single writer, Pages runs on main
      # concurrently, and it must not race build-test for the nix-<os>-<flakehash>
      # entry.
      #
      # The cabal-cache input is OFF. The composite's cabal and dist caches hold the
      # REGULAR build variant, written by build-test's `cabal build all`.
      # `cabal haddock` cannot reuse it: it needs a documentation-variant of the whole
      # closure. Pages restores and saves its own doc-variant store and builddir
      # instead, in the two steps below. See AGENTS.md.
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "false"
          save-nix-store: "false"

      # The documentation-variant cabal store. `cabal haddock` builds and installs a
      # doc-variant of every dependency, with a different ConfiguredId than the regular
      # build variant. That closure is ~84% of this job's wall time. The project's own
      # Haddock accounts for only ~55 s of that. It lives in CABAL_DIR (= the store),
      # under a docs-specific key so it never collides with build-test's pristine
      # cabal-store-* entry. The key covers the same dependency plan, so it stays a hit
      # until a real dependency bump. The restore-keys prefix gives partial warmth
      # across an epoch change: cabal reuses unchanged store entries and rebuilds only
      # the changed deps. Pages always runs on main, and the `pages` concurrency group
      # serialises it, so Pages is this cache's single writer: restore here, save
      # below (main only).
      - name: Restore doc-variant cabal store
        id: restore-docs-cabal
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cabal
          key: cabal-store-docs-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            cabal-store-docs-${{ runner.os }}-

      # The doc-variant build products of the project's three libraries (the published
      # Haddock HTML) and the openapi-gen executable, in their own builddir
      # (DOCS_BUILDDIR). Kept distinct from the gate's regular-variant dist-newstyle.
      # Small and fast-moving next to the store above. Same dep-plan key.
      - name: Restore doc-variant builddir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCS_BUILDDIR }}
          key: dist-docs-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            dist-docs-${{ runner.os }}-

      # Skipped on an exact doc-variant cabal-store cache hit: the restored index
      # already covers cabal.project's pinned index-state. `cabal update` otherwise
      # hits Hackage's TUF metadata over the network every run, including its
      # occasional dead-mirror fallback.
      - name: Update package index
        if: steps.restore-docs-cabal.outputs.cache-hit != 'true'
        run: nix develop .#ci --command task update

      # Assembles the Pages site into ./_site: the home page at the root and the
      # library Haddock under /api (with .nojekyll at the root). Runs in the `.#ci`
      # shell every other job enters (it carries pandoc, plus REDOC_JS for the vendored
      # Redoc bundle), not the heavier human shell. DOCS_BUILDDIR routes the
      # doc-variant build into the separately-cached tree restored above.
      - name: Build the Pages site into ./_site
        run: nix develop .#ci --command task site DOCS_BUILDDIR="$DOCS_BUILDDIR"

      # Cache writes: main only, single writer (Pages). They sit right after the build
      # that produced them and before the deploy steps. The save therefore still
      # happens when a later step (Configure/Upload/Deploy) fails: the deps built fine
      # and are worth caching. The actions/cache/save step no-ops when the key already
      # exists, so an unchanged-deps push writes nothing. Pages writes a dependency
      # epoch once, then reuses it untouched. Keys match the restore keys exactly.
      - name: Save doc-variant cabal store (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cabal
          key: cabal-store-docs-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}

      - name: Save doc-variant builddir (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCS_BUILDDIR }}
          key: dist-docs-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}

      # enablement: true turns Pages on via the API on first run, so bootstrapping
      # this needs no manual repo-settings step.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # The Pages backend intermittently fails a deployment with "Deployment failed,
      # try again later", even with no cancellation, no incident, and well under the
      # hourly limit. GitHub's own guidance for it is to re-run. The continue-on-error
      # setting lets the job try once more rather than going red on a transient flake.
      # The deploy-pages action re-fetches the same uploaded artifact and registers a
      # fresh deployment, so the retry is a clean second attempt.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Deploy to GitHub Pages (retry once on a transient backend failure)
        if: steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
