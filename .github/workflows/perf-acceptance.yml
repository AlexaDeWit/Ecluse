name: Performance Acceptance

# Benchmark policy: ../../docs/testing.md#benchmarks-non-gating
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

# One run per ref. Cancel a superseded PR run when a newer commit lands, because only
# the latest commit's verdict matters. Never cancel a scheduled or dispatch run.
concurrency:
  group: perf-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read-only is all this workflow needs. The baseline fetch reads the
# runs and artifacts of main with the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  perf-acceptance:
    name: Performance acceptance (live, non-blocking)
    runs-on: ubuntu-26.04-arm
    # Observed ~13 min mean, 21 min worst. Sized to clear a cold-cache run.
    timeout-minutes: 45
    env:
      # Pin the cabal store to a deterministic, cacheable location, as the other
      # Haskell jobs do.
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: $/.github/actions/setup-toolchain
        with:
          # Restore the warm cabal store (this job compiles the harness).
          cabal-cache: "true"

      # An exact cabal-store hit already covers cabal.project's pinned index-state.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Run performance acceptance
        id: measure
        run: nix develop .#ci --command task performance:live-allocation-measure

      - name: Audit per-ecosystem live allocation receipts
        if: always()
        env:
          PERF_NATIVE_OUTCOME: ${{ steps.measure.outcome }}
        run: nix develop .#ci --command task performance:live-allocation-receipt

      # The runs on main are the baseline. A missing baseline renders as "no baseline".
      - name: Fetch the latest report on main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/perf-baseline.sh perf-acceptance.yml "perf-acceptance-report-$RUNNER_ARCH-" "$RUNNER_TEMP/perf-baseline"

      - name: Compare time with main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -eo pipefail
          nix develop .#ci --command task against-main KIND=acceptance BASELINE="$RUNNER_TEMP/perf-baseline" REPORT=perf-acceptance-report.md | tee against-main.md

      # Preserve the report when the harness fails.
      - name: Upload this run's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-acceptance-report-${{ runner.arch }}-${{ github.sha }}
          path: |
            perf-acceptance-report.md
            perf-acceptance-observations.json
            against-main.md
            scratchpad/performance/live-allocation/
          if-no-files-found: warn
