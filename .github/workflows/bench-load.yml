name: Load test

# Benchmark policy: ../../docs/testing.md#benchmarks-non-gating
on:
  workflow_dispatch:
    inputs:
      duration-seconds:
        description: "Seconds each scenario applies load"
        required: false
        default: "30"
      concurrency:
        description: "Concurrent connections oha holds open"
        required: false
        default: "100"
      serve-max-in-flight:
        description: "Maximum concurrent packument fetches (blank exercises the proxy's computed default, as a scheduled run does)"
        required: false
      payload-bytes:
        description: "Synthetic artifact size in bytes for the worker and tarball scenarios (default 363520, about the median popular-package tarball; sweep this to probe the relay's byte rate)"
        required: false
  schedule:
    - cron: "17 4 * * *"

# One run per ref. Never cancel a scheduled or dispatched run mid-flight.
concurrency:
  group: bench-load-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: a read-only token is all this workflow needs. Artifact upload uses
# the run's own artifact service (the runtime token), not the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  bench-load:
    name: Throughput & latency load test (inform-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pin the cabal store to a deterministic, cacheable location, as the other
      # Haskell jobs do.
      CABAL_DIR: ${{ github.workspace }}/.cabal
      # The load knobs, from the dispatch inputs (defaulted for a scheduled run). They
      # travel through the environment, never interpolated into a shell command, so a
      # malformed value can only mis-size a measurement, never inject. Admission has no
      # fixed default here. Blank means the harness resolves the proxy's computed
      # default from the capability count, exactly as an unconfigured deployment would.
      # Nightly trends then measure what an operator gets. Dispatch a number to pin it.
      BENCH_LOAD_DURATION_SECONDS: ${{ github.event.inputs.duration-seconds || '30' }}
      BENCH_LOAD_CONCURRENCY: ${{ github.event.inputs.concurrency || '100' }}
      BENCH_LOAD_SERVE_MAX_IN_FLIGHT: ${{ github.event.inputs.serve-max-in-flight }}
      BENCH_LOAD_PAYLOAD_BYTES: ${{ github.event.inputs.payload-bytes || '363520' }}
      BENCH_LOAD_ISOLATE_OHA: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Restore the warm cabal store (this job compiles the harness).
          cabal-cache: "true"
          # Restore the shared Nix store but never write it. The build-test job on
          # main is the single writer. This job realises the same `.#ci` closure, so a
          # save here would race and bloat the canonical entry. Restore-only.
          save-nix-store: "false"

      # Skipped on an exact cabal-store cache hit: the restored index already covers
      # cabal.project's pinned index-state. `cabal update` otherwise hits Hackage's
      # TUF metadata over the network every run, including its occasional
      # dead-mirror fallback.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # pipefail preserves the harness exit code through tee's output capture.
      - name: Run load tests
        run: |
          set -eo pipefail
          # Isolate the load generator from the server: ubuntu-latest has 4 cores. The
          # harness pins oha to core 0, and GHC gets 3 capability threads, so they
          # occupy the remaining 3 cores without self-contention. The driver propagates
          # this count to the scenario child processes via GHCRTS, because argv RTS
          # flags do not survive the per-scenario re-exec.
          nix develop .#ci --command cabal run -v0 bench-load -- +RTS -N3 -RTS 2>&1 | tee bench-load-results.md

      # Preserve partial output when the harness fails.
      - name: Upload this run's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-load-results-${{ github.sha }}
          path: bench-load-results.md
          if-no-files-found: warn
