name: Load test

# Benchmark policy: ../../docs/testing.md#benchmarks-non-gating
on:
  workflow_dispatch:
    inputs:
      pod-shape:
        description: "Pod shape the measured proxy runs under, or thrash for the GC-thrash probe alone"
        type: choice
        options:
          - all
          - unlimited
          - 2cpu-1gib
          - 4cpu-1gib
          - 4cpu-2gib
          - thrash
        default: all
      scenarios:
        description: "Comma-separated scenario keys, such as npm/merge-cold,npm/herd (blank: every scenario)"
        required: false
      thrash-limits-mib:
        description: "Memory limits in MiB the GC-thrash probe steps down through, highest first"
        required: false
        default: "2048,1536,1024,768,512"
      duration-seconds:
        description: "Seconds each scenario, or each ramp step, applies load"
        required: false
        default: "30"
      concurrency:
        description: "Concurrent connections oha holds open"
        required: false
        default: "100"
      serve-max-in-flight:
        description: "Maximum concurrent packument fetches (blank exercises the proxy's computed default, as a scheduled run does)"
        required: false
      payload-bytes:
        description: "Synthetic artifact size in bytes for the worker and tarball scenarios (default 363520, about the median popular-package tarball)"
        required: false
  schedule:
    - cron: "17 4 * * *"

# One run per ref and pod-shape choice. Never cancel a scheduled or dispatched run mid-flight.
concurrency:
  group: bench-load-${{ github.ref }}-${{ inputs.pod-shape || 'all' }}
  cancel-in-progress: false

# Least privilege: a read-only token is all this workflow needs. Artifact upload uses
# the run's own artifact service (the runtime token), not the GITHUB_TOKEN. The baseline
# fetch reads the runs and artifacts of main with the GITHUB_TOKEN.
permissions:
  contents: read

env:
  # Pin the cabal store to a deterministic, cacheable location, as the other Haskell jobs do.
  CABAL_DIR: ${{ github.workspace }}/.cabal
  # The load knobs, from the dispatch inputs (defaulted for a scheduled run). They travel
  # through the environment, never interpolated into a shell command, so a malformed value
  # can only mis-size a measurement, never inject. Blank admission leaves the proxy's
  # computed default in force, which is what an unconfigured deployment gets.
  BENCH_LOAD_DURATION_SECONDS: ${{ inputs.duration-seconds || '30' }}
  BENCH_LOAD_CONCURRENCY: ${{ inputs.concurrency || '100' }}
  BENCH_LOAD_SERVE_MAX_IN_FLIGHT: ${{ inputs.serve-max-in-flight }}
  BENCH_LOAD_PAYLOAD_BYTES: ${{ inputs.payload-bytes || '363520' }}
  BENCH_LOAD_SCENARIOS: ${{ inputs.scenarios }}
  BENCH_LOAD_ISOLATE_OHA: "1"
  # Experimental comparison: use the same stub latency on both source revisions.
  BENCH_LOAD_PROBE_RTT: "0"
  BENCH_LOAD_UPSTREAM_LATENCY_MS: "5"
  # The proxy's own cgroups sit beside the harness under this directory (see the steps).
  BENCH_LOAD_CGROUP: /sys/fs/cgroup/ecluse-bench-load

jobs:
  bench-load:
    name: Load test (${{ matrix.pod-shape }}, inform-only)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pod-shape: ${{ fromJSON((inputs.pod-shape == '' || inputs.pod-shape == 'all') && '["unlimited","2cpu-1gib","4cpu-1gib","4cpu-2gib"]' || format('["{0}"]', inputs.pod-shape)) }}
    env:
      # The probe sets its own shape per step, so the shape here only matters for the passes.
      BENCH_LOAD_POD: ${{ matrix.pod-shape == 'thrash' && 'unlimited' || matrix.pod-shape }}
      BENCH_LOAD_THRASH_LIMITS_MIB: ${{ matrix.pod-shape == 'thrash' && (inputs.thrash-limits-mib || '2048,1536,1024,768,512') || '' }}
      BENCH_LOAD_THRASH_CPUS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Restore the warm cabal store (this job compiles the harness).
          cabal-cache: "true"

      # Skipped on an exact cabal-store cache hit: the restored index already covers
      # cabal.project's pinned index-state.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Build the harness
        run: nix develop .#ci --command cabal build -v0 exe:bench-load

      # The harness bounds each proxy with a cgroup of its own, so it needs a subtree it may
      # write. Swap goes off, or a pod shape could page instead of meeting its limit.
      - name: Delegate a cgroup subtree to the harness
        run: |
          set -euo pipefail
          sudo swapoff -a
          sudo mkdir -p "$BENCH_LOAD_CGROUP/harness"
          sudo chown -R "$(id -u):$(id -g)" "$BENCH_LOAD_CGROUP"
          echo "+cpu +memory +pids" | sudo tee "$BENCH_LOAD_CGROUP/cgroup.subtree_control" >/dev/null
          echo "controllers enabled for the proxy cgroups: $(cat "$BENCH_LOAD_CGROUP/cgroup.subtree_control")"

      # pipefail preserves the harness exit code through tee's output capture.
      - name: Run load tests
        run: |
          set -eo pipefail
          # This shell, and so the harness, joins the leaf beside the proxy cgroups.
          echo "$$" | sudo tee "$BENCH_LOAD_CGROUP/harness/cgroup.procs" >/dev/null
          # The runner has 4 cores. The harness pins oha to core 0, and GHC takes the other
          # 3 as capabilities. The driver passes -T -N3 to each scenario child through GHCRTS,
          # because argv RTS flags do not survive the re-exec. Each proxy gets only -T, since
          # its own boot sizes its capabilities from its cgroup.
          nix develop .#ci --command cabal run -v0 bench-load -- +RTS -N3 -RTS 2>&1 | tee bench-load-results.md

      # Off main only: the runs on main are the baseline, and each pod shape takes the
      # newest run that measured it. The GC-thrash probe has no scenario table to compare. A
      # missing baseline renders as "no baseline". Both steps continue on error and stop after
      # five minutes, so neither can fail or stall the job.
      - name: Fetch the latest results on main for this pod shape
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' && matrix.pod-shape != 'thrash' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          POD_SHAPE: ${{ matrix.pod-shape }}
        run: bash scripts/perf-baseline.sh bench-load.yml "bench-load-results-$RUNNER_ARCH-$POD_SHAPE-" "$RUNNER_TEMP/perf-baseline"

      - name: Compare successes and latency with main
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' && matrix.pod-shape != 'thrash' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -eo pipefail
          nix develop .#ci --command task against-main KIND=load BASELINE="$RUNNER_TEMP/perf-baseline" REPORT=bench-load-results.md | tee against-main.md

      # Preserve partial output when the harness fails.
      - name: Upload this run's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-load-results-${{ runner.arch }}-${{ matrix.pod-shape }}-${{ github.sha }}
          path: |
            bench-load-results.md
            against-main.md
          if-no-files-found: warn
