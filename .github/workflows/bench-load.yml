name: Fixed RTT pairs for PR 1635 (diagnostic)
on:
  workflow_dispatch:
concurrency:
  group: measure-1635-fixed-rtt-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CABAL_DIR: ${{ github.workspace }}/.cabal
  MEASURE_CANDIDATE_SHA: 4008730ad590c81f897f736d1ab29c5731aee7b3
  MEASURE_BASELINE_SHA: efece1f1fca410dc1d214dcc76a99f106e2a0ff7
  BENCH_LOAD_POD: 4cpu-1gib
  BENCH_LOAD_PROBE_RTT: "0"
  BENCH_LOAD_UPSTREAM_LATENCY_MS: "5"
  BENCH_LOAD_DURATION_SECONDS: "30"
  BENCH_LOAD_CONCURRENCY: "100"
  BENCH_LOAD_PAYLOAD_BYTES: "363520"
  BENCH_LOAD_CACHE_MAX_ENTRIES: "3"
  BENCH_LOAD_WORKING_SET: "64"
  BENCH_LOAD_SERVE_MAX_IN_FLIGHT: ""
  BENCH_LOAD_PUBLIC_CONNECTIONS_PER_HOST: ""
  BENCH_LOAD_PRIVATE_CONNECTIONS_PER_HOST: ""
  BENCH_LOAD_THRASH_LIMITS_MIB: ""
  BENCH_LOAD_ISOLATE_OHA: "1"
  BENCH_LOAD_CGROUP: /sys/fs/cgroup/ecluse-bench-load
  BENCH_LOAD_SCENARIOS: npm/merge-cold,npm/herd,npm/ramp,npm/warm-under-cold,pypi/index-cold
jobs:
  bench-load:
    name: Three sequential H/D pairs (diagnostic, not held to floors)
    if: github.ref == 'refs/heads/measure/1635-fixed-rtt'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout measurement wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          dist-cache: "false"
      - name: Checkout original candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MEASURE_CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Checkout original baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MEASURE_BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Apply identical observer, build, and measure six passes
        timeout-minutes: 160
        env:
          MEASURE_CABAL_CACHE_HIT: ${{ steps.toolchain.outputs.cabal-cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p fixed-rtt-results
          nix develop .#ci --command bash scripts/measure-1635-fixed-rtt.sh 2>&1 | tee fixed-rtt-results/session.log
      - name: Preserve every report and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measure-1635-fixed-rtt-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: fixed-rtt-results/
          if-no-files-found: error
