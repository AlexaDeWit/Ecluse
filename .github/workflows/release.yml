name: Release

# Publishing is a separate lifecycle from the PR `gate` in ci.yml. It runs only on a
# pushed version tag, or on a manual dispatch. A per-arch matrix builds the image
# NATIVELY (amd64 and arm64), so there is no fragile GHC cross-compilation. One
# privileged job then assembles the two builds into a SINGLE multi-arch manifest list
# and pushes it under an immutable `X.Y.Z` tag. It attaches keyless provenance and
# SBOM attestations: one per platform, plus provenance on the index. On a real tag it
# also publishes a GitHub Release pinning the digest. It is never a gate dependency.
# See docs/architecture/release-supply-chain.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0)"
        required: true

# Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The single source of truth for the version is ecluse.cabal's `version:` field.
  # A pushed tag (or the workflow_dispatch `tag` input) must match it. On any drift
  # the release fails fast HERE, before the expensive multi-arch build. The comparison
  # strips a pre-release suffix (e.g. -rc1) first, so v0.1.0-rc1 still matches 0.1.0.
  # `task version` reads the field via `cabal info`, so this job needs the toolchain:
  # cheap insurance on the infrequent release path.
  verify-version:
    name: Verify tag matches cabal version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      - name: Assert the release tag matches ecluse.cabal version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"; else tag="${REF_NAME#v}"; fi
          base="${tag%%-*}" # strip any -rc / -pre suffix
          want="$(nix develop .#ci --command task version)"
          if [ "$base" != "$want" ]; then
            echo "::error::release tag '$tag' (base '$base') != ecluse.cabal version '$want' — bump the cabal version or fix the tag"
            exit 1
          fi
          echo "OK: tag base '$base' == ecluse.cabal version '$want'"

  build:
    name: Build image (${{ matrix.platform.arch }})
    needs: verify-version
    # Native per-arch builds: amd64 on the standard runner, arm64 on GitHub's free
    # public-repo arm64 runner. GHC therefore compiles natively on each target, and
    # cross-compilation never enters the picture. The fail-fast setting is off, so one
    # failing arch still leaves the other's logs. No secrets here: the build legs are
    # credential-free, and only the `publish` job below carries privileges.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build image
        run: nix develop .#ci --command task docker-build

      # Dereference the ./result symlink (it points into /nix/store) so the
      # uploaded artifact carries the archive's bytes, not a dangling link.
      - name: Stage image archive
        env:
          ARCH: ${{ matrix.platform.arch }}
        run: cp -L result "image-${ARCH}.tar"

      # Per-platform SBOM: .#ecluse-bin is THIS arch's binary, so its closure (and
      # thus the SBOM) is arch-specific. Attested to the platform digest below.
      - name: Generate SBOM
        run: nix develop .#ci --command task sbom

      - name: Upload image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.platform.arch }}
          path: image-${{ matrix.platform.arch }}.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.platform.arch }}
          path: sbom/ecluse.spdx.json
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Assemble multi-arch image, attest & release
    needs: build
    runs-on: ubuntu-latest
    # The workflow relies on the ephemeral GITHUB_TOKEN to push to GHCR. The
    # protected environment (required reviewers) holds the job until a human
    # approves the release.
    environment: release
    permissions:
      contents: write # create the GitHub Release (digest pin + verify recipe + notes)
      id-token: write # OIDC: keyless signing of the attestations (Fulcio/Rekor)
      attestations: write # record the provenance/SBOM attestations
      packages: write # authenticate to GHCR with the ephemeral token
    env:
      IMAGE: ghcr.io/alexadewit/ecluse
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Untrusted refs flow through env, never interpolated into the run script.
      - name: Resolve image tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="${REF_NAME#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download per-arch build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Authenticate so regctl can push the manifest list and the attest-actions
      # can push referrers. The docker/login-action step writes
      # ~/.docker/config.json, which both regctl and skopeo read as their fallback
      # auth file.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Assemble the two per-arch archives into ONE manifest list and push the
      # single canonical tag. The step emits the index and per-platform digests for
      # the attest steps. All skopeo, regctl, and jq logic lives in the script
      # (shellcheck'd), so the workflow stays injection-free.
      - name: Assemble & push multi-arch image
        id: push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          nix develop .#ci --command \
            bash scripts/push-multiarch.sh "$IMAGE" "$TAG" \
              artifacts/image-amd64/image-amd64.tar \
              artifacts/image-arm64/image-arm64.tar >> "$GITHUB_OUTPUT"

      # Provenance on the index (what `gh attestation verify oci://IMAGE:TAG`
      # resolves to) and on each platform digest. A consumer pinning a single arch by
      # digest can then verify it too. Keyless (OIDC → Fulcio/Rekor), stored as
      # immutable OCI referrers, which suits the repo's immutable tags.
      - name: Attest provenance (index)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.index-digest }}
          push-to-registry: true

      - name: Attest provenance (amd64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.amd64-digest }}
          push-to-registry: true

      - name: Attest provenance (arm64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.arm64-digest }}
          push-to-registry: true

      # The SBOM is per-platform, because each arch has its own C closure. Attach
      # each arch's SBOM to that arch's platform digest, never to the index. The
      # index has no closure of its own.
      - name: Attest SBOM (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.amd64-digest }}
          sbom-path: artifacts/sbom-amd64/ecluse.spdx.json
          push-to-registry: true

      - name: Attest SBOM (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.arm64-digest }}
          sbom-path: artifacts/sbom-arm64/ecluse.spdx.json
          push-to-registry: true

      # On a real version tag (not an rc dispatch), publish a GitHub Release that
      # pins the INDEX digest. The release gives the `gh attestation verify` recipe
      # and carries the auto-generated changelog. Untrusted refs flow through env,
      # never into the run script directly.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.index-digest }}
        run: |
          bash scripts/release-notes.sh "$TAG" "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/notes.md"
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $pre
