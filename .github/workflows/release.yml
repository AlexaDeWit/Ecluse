name: Release

# Release protection and artifact retention: docs/architecture/release-supply-chain.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0)"
        required: true

# Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches cabal version
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.version.outputs.image-tag }}
      git-tag: ${{ steps.version.outputs.git-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: $/.github/actions/setup-toolchain

      - name: Assert the release tag matches ecluse.cabal version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: nix develop .#ci --command task release-validate-version

  build:
    needs: verify-version
    permissions:
      contents: read
    uses: $/.github/workflows/release-build.yml

  publish:
    name: Assemble multi-arch image, attest & release
    needs: [verify-version, build]
    runs-on: ubuntu-26.04
    # The protected environment requires human approval before publication.
    environment: release
    permissions:
      contents: write # create the GitHub Release (digest pin + verify recipe + notes)
      id-token: write # OIDC: keyless signing of the attestations (Fulcio/Rekor)
      attestations: write # record the provenance/SBOM attestations
      packages: write # authenticate to GHCR with the ephemeral token
    env:
      IMAGE: ghcr.io/alexadewit/ecluse
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Avoid exposing this job's signing-capable OIDC token to a third-party login.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ""

      - name: Download per-arch build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # regctl and skopeo use the Docker credentials written by this action.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish one immutable tag for both architectures.
      - name: Assemble & push multi-arch image
        id: push
        env:
          TAG: ${{ needs.verify-version.outputs.image-tag }}
        run: |
          nix develop .#ci --command \
            bash scripts/push-multiarch.sh "$IMAGE" "$TAG" \
              artifacts/image-amd64/image-amd64.tar \
              artifacts/image-arm64/image-arm64.tar >> "$GITHUB_OUTPUT"

      # Attest the index and platform digests so consumers can verify either pin.
      - name: Attest provenance (index)
        id: provenance-index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.index-digest }}
          push-to-registry: true

      - name: Attest provenance (amd64)
        id: provenance-amd64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.amd64-digest }}
          push-to-registry: true

      - name: Attest provenance (arm64)
        id: provenance-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.arm64-digest }}
          push-to-registry: true

      # Each platform has its own C closure, so its SBOM names the platform digest.
      - name: Attest SBOM (amd64)
        id: sbom-amd64
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.amd64-digest }}
          sbom-path: artifacts/sbom-amd64/ecluse.spdx.json
          push-to-registry: true

      - name: Attest SBOM (arm64)
        id: sbom-arm64
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.arm64-digest }}
          sbom-path: artifacts/sbom-arm64/ecluse.spdx.json
          push-to-registry: true

      # Stage bundles on dispatch too, so missing assets fail before a real release.
      # Release assets also make attestations visible to Scorecard's Signed-Releases check.
      - name: Stage release assets
        env:
          TAG: ${{ needs.verify-version.outputs.image-tag }}
          PROVENANCE_INDEX: ${{ steps.provenance-index.outputs.bundle-path }}
          PROVENANCE_AMD64: ${{ steps.provenance-amd64.outputs.bundle-path }}
          PROVENANCE_ARM64: ${{ steps.provenance-arm64.outputs.bundle-path }}
          SBOM_BUNDLE_AMD64: ${{ steps.sbom-amd64.outputs.bundle-path }}
          SBOM_BUNDLE_ARM64: ${{ steps.sbom-arm64.outputs.bundle-path }}
          SBOM_AMD64: artifacts/sbom-amd64/ecluse.spdx.json
          SBOM_ARM64: artifacts/sbom-arm64/ecluse.spdx.json
        run: bash scripts/release-assets.sh "$TAG" "$RUNNER_TEMP/assets" > "$RUNNER_TEMP/assets.txt"

      # Dispatch rehearses publication without creating a GitHub Release.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-version.outputs.git-tag }}
          DIGEST: ${{ steps.push.outputs.index-digest }}
        run: |
          bash scripts/release-notes.sh "$TAG" "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/notes.md"
          mapfile -t assets < "$RUNNER_TEMP/assets.txt"
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $pre "${assets[@]}"
