name: Json-stream upstream experiment

on:
  push:
    branches:
      - 'measure/json-upstream-*'

permissions:
  contents: read

jobs:
  upstream:
    name: Upstream fixtures and token fold
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
      BENCH_REPO: ${{ github.workspace }}
      BENCH_BASELINE_SHA: 2b1abcc04412ef8017ba6b645f6da8f8166c52c7
      BENCH_CANDIDATE_SHA: ${{ github.sha }}
      BENCH_REPEATS: "5"
      BENCH_SECONDS: "0.3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned baseline
        run: git fetch --no-tags --depth=1 origin "$BENCH_BASELINE_SHA"

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          dist-cache: "false"

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Compare the three pinned source variants
        env:
          BENCH_OUTPUT: ${{ runner.temp }}/json-stream-comparison
        run: nix develop .#ci --command task --taskfile scripts/experiments/json-stream/Taskfile.yml all

      - name: Upload sources, plans and every sample
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: json-stream-upstream-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/json-stream-comparison/artifacts
          if-no-files-found: warn
