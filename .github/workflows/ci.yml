name: CI

# Push-to-main and pull_request, so a feature-branch push never double-runs beside its
# PR. The nightly schedule catches live-registry drift that lands outside this repo, and
# runs the grype scan.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly health check (most valuably the smoke tier)
  workflow_dispatch:

# Never cancel on main: it keeps the complete build history of every commit that lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default. Jobs that need more widen it at the job level.
permissions:
  contents: read

# Every timeout-minutes below catches a hang, and is not a budget: each clears a fully
# cold run. Raise one that starts to cancel real runs, never tighten one to the mean.
jobs:
  changes:
    name: Classify the change
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the PR's changed-file list
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      release-build: ${{ steps.classify.outputs.release-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The path lists live in the script, which fails closed: an unlisted path, an
      # unreadable file list, or any non-PR event runs every job.
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-classify-change.sh

  build:
    name: Build & compile checks (all targets, residency, doctest)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    # Builds the widest cabal plan, so it is the sole writer of the cabal store and of
    # dist-newstyle, which every other Haskell job restores.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal # deterministic, cacheable store location
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      # An exact cabal-store hit already covers cabal.project's pinned index-state, so
      # `cabal update` would only re-fetch TUF metadata over its dead-mirror fallback.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # go-task runs several targets in the order given, in one dev shell.
      - name: Build every target, then residency, doctest, and cabal check
        run: nix develop .#ci --command task build test-residency doctest cabal-check

      # Only this job writes the cabal caches, on main even if a later target fails.
      # The commit-specific dist key gives each main run a new entry, except a rerun with a cache hit.
      - name: Save cabal store (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cabal
          key: cabal-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}

      - name: Save dist-newstyle (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.toolchain.outputs.dist-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.toolchain.outputs.cabal-version }}-${{ github.sha }}

  allocation:
    name: Allocation budgets (committed captures)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # The harness links the shipped RTS options, so every run measures under the same
      # runtime. pipefail keeps the harness exit code through tee.
      - name: Hold each leg's allocation to its budget
        run: |
          set -eo pipefail
          nix develop .#ci --command task perf-allocation 2>&1 | tee perf-allocation-report.md

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-allocation-report-${{ runner.arch }}-${{ github.sha }}
          path: perf-allocation-report.md
          if-no-files-found: warn

  coverage:
    name: Coverage (${{ matrix.suite }})
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write # OIDC for tokenless Codecov upload (no stored token)
    # One runner per instrumented suite. Each leg runs the suite Codecov expects under
    # its flag, so the four uploads Codecov waits for still land on every commit.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ecluse-core-unit
            coverage-task: coverage-unit
            flag: unit
          - suite: ecluse-unit
            coverage-task: coverage-unit
            flag: unit
          - suite: ecluse-runtime-unit
            coverage-task: coverage-unit
            flag: unit
          # Drives ministack through testcontainers, so this leg alone needs Docker.
          - suite: ecluse-integration
            coverage-task: coverage-integration
            flag: integration
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
      ECLTEST_SOURCE: ${{ github.sha }}
      ECLTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      ECLTEST_ARCHITECTURE: arm64
      ECLTEST_UNIT_PLAN_PATH: unit-plan.json
      ECLTEST_UNIT_REPORT_PATH: unit-report.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          dist-cache: "false" # this job builds instrumented, into dist-coverage

      # One key per suite, so each leg is the sole writer of the builddir it produces.
      # The version family bounds a restore, and the commit makes each main save fresh.
      - name: Restore dist-coverage
        id: restore-dist-coverage
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-coverage
          key: dist-coverage-${{ matrix.suite }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.toolchain.outputs.cabal-version }}-${{ github.sha }}
          restore-keys: |
            dist-coverage-${{ matrix.suite }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.toolchain.outputs.cabal-version }}-

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # One throttled pull from the runners' shared Docker Hub IP pool cascades the tier
      # to red. The refs mirror the pins in test/support/Ecluse/Test/Container/Image.hs.
      - name: Pre-pull pinned integration images (Docker Hub throttle resilience)
        if: ${{ matrix.suite == 'ecluse-integration' }}
        run: >-
          bash scripts/docker-prepull.sh
          ministackorg/ministack@sha256:5164592def36af01b8ac76364028e27c5ecd8f1494c8a53d5fcd811cc7dfb594
          otel/opentelemetry-collector@sha256:3805724e26351df55a45032a793c9b64a2117ac9a58f13f070674a9723fab373

      - name: Instrumented build and run
        env:
          COVERAGE_TASK: ${{ matrix.coverage-task }}
          SUITE: ${{ matrix.suite }}
        run: nix develop .#ci --command task "$COVERAGE_TASK" SUITE="$SUITE"

      - name: Upload unit execution evidence
        if: ${{ always() && (matrix.suite == 'ecluse-core-unit' || matrix.suite == 'ecluse-runtime-unit') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-evidence-${{ matrix.suite }}
          path: |
            unit-plan.json
            unit-report.json
          if-no-files-found: error

      - name: Upload integration execution evidence
        if: ${{ always() && matrix.suite == 'ecluse-integration' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-evidence
          path: |
            scratchpad/integration/${{ github.run_id }}-${{ github.run_attempt }}/plan.json
            scratchpad/integration/${{ github.run_id }}-${{ github.run_attempt }}/report.json
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/${{ matrix.suite }}.json
          flags: ${{ matrix.flag }}
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      - name: Save dist-coverage (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.restore-dist-coverage.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-coverage
          key: dist-coverage-${{ matrix.suite }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.toolchain.outputs.cabal-version }}-${{ github.sha }}

  codecov-notify:
    name: Codecov statuses
    needs: [changes, coverage]
    # Without `always()`, a failed or skipped coverage leg skips this job, so Codecov
    # posts nothing rather than a number computed from a partial report.
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC for the tokenless Codecov call, no stored token
    steps:
      # The CLI derives the commit from git on a push to main, so the tree must be here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `codecov.notify.manual_trigger` holds every Codecov status until this call, so
      # the statuses post once, against the complete four-upload report.
      - name: Send the Codecov notifications
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true # tokenless via GitHub OIDC, no CODECOV_TOKEN secret
          run_command: send-notifications
          fail_ci_if_error: true # an unsent status must not read as a green gate

  smoke:
    name: Smoke tests (live registries, non-gating)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    # Catches protocol drift when the live registries change their wire behaviour. Not a
    # `gate` dependency, so a transient blip shows red on the PR but blocks no merge.
    continue-on-error: true
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Smoke tests
        run: nix develop .#ci --command task test-smoke

  e2e-prepare:
    name: Prepare E2E image and plan
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
      ECLTEST_ARTIFACT_DIR: scratchpad/e2e
      ECLTEST_SOURCE: ${{ github.sha }}
      ECLTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Prepare image and catalogue
        run: nix develop .#ci --command task test-e2e-prepare

      - name: Upload immutable plan and identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-plan
          path: |
            scratchpad/e2e/plan.json
            scratchpad/e2e/identity.json
          if-no-files-found: error

      - name: Upload image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-image
          path: scratchpad/e2e/docker-image.tar
          compression-level: 0
          if-no-files-found: error

  e2e-conformance:
    name: Conformance (${{ matrix.subject }})
    needs: [changes, coverage, e2e-prepare]
    if: ${{ always() && needs.changes.outputs.docs-only != 'true' && needs.e2e-prepare.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        subject: [npm, pypi, shared-system]
    permissions:
      contents: read
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
      ECLTEST_ARTIFACT_DIR: scratchpad/e2e
      ECLTEST_SOURCE: ${{ github.sha }}
      ECLTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      ECLTEST_ARCHITECTURE: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Download plan and identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: scratchpad/e2e

      - name: Download exact image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image
          path: scratchpad/e2e

      - name: Pre-pull pinned e2e images (Docker Hub throttle resilience)
        run: >-
          bash scripts/docker-prepull.sh
          ministackorg/ministack@sha256:5164592def36af01b8ac76364028e27c5ecd8f1494c8a53d5fcd811cc7dfb594
          otel/opentelemetry-collector@sha256:3805724e26351df55a45032a793c9b64a2117ac9a58f13f070674a9723fab373
          verdaccio/verdaccio@sha256:9d622d256378c6e7ae09f384774ee2f0f8ac67a66c066db55921a0b7218abc4c
          nginx@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa

      - name: Verify and load exact image
        run: nix develop .#ci --command task test-e2e-load

      - name: Run fixed subject
        env:
          SUBJECT: ${{ matrix.subject }}
        run: nix develop .#ci --command task "test-e2e-$SUBJECT"

      - name: Download integration execution evidence
        if: ${{ always() && matrix.subject != 'shared-system' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-evidence
          path: scratchpad/integration/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download core unit execution evidence
        if: ${{ always() && matrix.subject != 'shared-system' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-evidence-ecluse-core-unit
          path: scratchpad/unit/core

      - name: Download runtime unit execution evidence
        if: ${{ always() && matrix.subject != 'shared-system' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-evidence-ecluse-runtime-unit
          path: scratchpad/unit/runtime

      - name: Audit ecosystem completion across tiers
        if: ${{ always() && matrix.subject != 'shared-system' }}
        env:
          SUBJECT: ${{ matrix.subject }}
          ECLTEST_CORE_UNIT_ARTIFACT_DIR: scratchpad/unit/core
          ECLTEST_RUNTIME_UNIT_ARTIFACT_DIR: scratchpad/unit/runtime
          ECLTEST_INTEGRATION_ARTIFACT_DIR: scratchpad/integration/${{ github.run_id }}-${{ github.run_attempt }}
        run: nix develop .#ci --command task "test-e2e-$SUBJECT-completion"

      - name: Record shard outcome
        if: always()
        env:
          ECLTEST_COMPONENT: ${{ matrix.subject }}
          ECLTEST_JOB_STATUS: ${{ job.status }}
        run: bash scripts/e2e.sh diagnostics

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ matrix.subject }}
          path: scratchpad/e2e/reports/
          if-no-files-found: error

  e2e:
    name: E2E execution completeness
    needs: [changes, e2e-prepare, e2e-conformance]
    if: ${{ always() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
      ECLTEST_ARTIFACT_DIR: scratchpad/e2e
      ECLTEST_SOURCE: ${{ github.sha }}
      ECLTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Download plan and identity
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: scratchpad/e2e

      - name: Download shard reports
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-report-*
          merge-multiple: true
          path: scratchpad/e2e/reports

      - name: Audit all required groups and cases
        if: always()
        run: nix develop .#ci --command task test-e2e-audit

  backend-conformance:
    name: Conformance (package store ${{ matrix.subject }})
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        subject: [verdaccio, codeartifact]
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
      ECLTEST_SOURCE: ${{ github.sha }}
      ECLTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      ECLTEST_ARCHITECTURE: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Run the fixed package-store contract
        env:
          SUBJECT: ${{ matrix.subject }}
        run: nix develop .#ci --command task "test-conformance-$SUBJECT"

      - name: Upload package-store evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-store-report-${{ matrix.subject }}
          path: scratchpad/backend-conformance/
          if-no-files-found: error

  static-checks:
    name: Static checks (format, lint, Semgrep, workflows, site)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    # Sub-minute checks batched so the toolchain setup is paid once. `task static-checks`
    # also assembles the site, so a dangling link fails here, not on the Pages deploy.
    permissions:
      contents: read
      security-events: write # upload the Semgrep SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Static checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command task static-checks

      # Semgrep still gates on every PR (`task sast` fails on findings). This upload is
      # only the Security-tab view, which tracks main, hence always().
      - name: Upload Semgrep SARIF to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  docs:
    name: Haddock builds
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    # Sized for a cold run: any flake.lock change misses the Nix-store cache and
    # rebuilds the Haskell closure's doc outputs from source, which ran past 100 minutes.
    timeout-minutes: 160
    # `checks.docs`, not `cabal haddock`: the cabal path wants a documentation variant of
    # the deps that the build job's store lacks, so it rebuilds the whole closure every run.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Realises the widest Nix closure of any job, so it is the one writer of the
          # Nix-store cache. The two roots below are what the saved entry carries.
          save-nix-store: "true"

      # A dev shell holds no GC root, so without this profile the save's `nix store gc`
      # drops `.#ci` and every reader of this entry re-substitutes it.
      - name: Root the .#ci shell for the Nix-store cache save
        run: nix develop .#ci --profile "$RUNNER_TEMP/ecluse-ci-profile" --command true

      - name: Resolve the runner's Nix system
        id: nix-system
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          echo "system=$system" >> "$GITHUB_OUTPUT"

      # --out-link, not --no-link: the same gc drops every unrooted path, and the
      # Haskell closure this realises is what the e2e job's image build links against.
      - name: Flake checks (Haddock, locks)
        env:
          NIX_SYSTEM: ${{ steps.nix-system.outputs.system }}
        run: >-
          bash scripts/ci-build-diagnostics.sh nix build --out-link "$RUNNER_TEMP/flake-check" --print-build-logs
          ".#checks.$NIX_SYSTEM.docs"
          ".#checks.$NIX_SYSTEM.freeze-sync"
          ".#checks.$NIX_SYSTEM.amazonka-lockstep"

  weeder:
    name: Dead-code check (weeder)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    # Reports library code unreachable from `Ecluse.run`, and any finding fails the gate.
    # Its own job because the -fwrite-ide-info build is heavy.
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          dist-cache: "false" # this job builds with -fwrite-ide-info, into dist-analysis

      # dist-analysis is deliberately NOT cached. cabal cannot delete a removed module's
      # artifacts, so a restored builddir feeds weeder orphaned .hie for modules that are gone.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: weeder (fails on findings)
        run: |
          set -eo pipefail
          nix develop .#ci --command task weeder 2>&1 | tee weeder.out

      - name: Render weeder findings to the run summary
        if: always()
        run: |
          {
            echo '## weeder: library code not reachable from the app entry';
            echo;
            echo '_Gating: any finding fails this job and the CI gate. A finding is a definition built into the library but not wired into the app entry (Ecluse.run); land its wiring in the same slice, or root it in weeder.toml._';
            echo;
            echo '```';
            grep -E ':[0-9]+:[0-9]+:' weeder.out || echo '(no findings)';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  stan:
    name: Haskell static analysis (stan)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    # HIE-based partial-function analysis at the .stan.toml floor, which Semgrep (no
    # Haskell) and hlint (no type info) cannot see. A finding above the floor fails the gate.
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          dist-cache: "false" # this job builds with -fwrite-ide-info, into dist-analysis

      # dist-analysis is not cached here either, for the reason on the weeder job.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: stan (fails on findings)
        run: |
          set -eo pipefail
          nix develop .#ci --command task stan 2>&1 | tee stan.out

      - name: Render stan findings to the run summary
        if: always()
        run: |
          {
            echo '## stan: Haskell static analysis (gating: any finding above the floor fails this job and the CI gate)';
            echo;
            echo 'Partial functions and potential bugs (HIE-based) at the Warning floor. Nothing is ignored without an explicit decision; run "task stan-all" locally for the full set incl Performance/space-leak.';
            echo;
            echo '```';
            sed -E 's/\x1b\[[0-9;]*m//g' stan.out 2>/dev/null || echo '(no output)';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  # release.yml's build, without publishing: an architecture's image never builds or
  # starts for the first time during a release. No job here logs in to a registry.
  release-dry-run:
    name: Release dry-run
    needs: changes
    if: ${{ needs.changes.outputs.release-build == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      retention-days: 1

  release-dry-run-assemble:
    name: Release dry-run (multi-arch index)
    needs: release-dry-run
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Download the image archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: artifacts

      - name: Assemble the multi-arch index (no push)
        run: >-
          nix develop .#ci --command bash scripts/assemble-multiarch.sh "$RUNNER_TEMP/layout"
          artifacts/image-amd64/image-amd64.tar
          artifacts/image-arm64/image-arm64.tar

  release-dry-run-boot:
    name: Release dry-run (start ${{ matrix.arch }})
    needs: release-dry-run
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    # Each image starts on its own architecture, so the amd64 leg needs an amd64 runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-26.04-arm
          - arch: amd64
            runner: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.arch }}
          path: artifacts

      - name: Start the image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$(bash scripts/docker-load.sh "artifacts/image-${ARCH}.tar")"
          docker run --rm --network none "$tag" --version

  # A second build of the same commit, on separate runners with no cache, so the two
  # share no store. The prefix keeps its archive out of the `image-*` reads above.
  release-rebuild:
    name: Release rebuild
    needs: changes
    if: ${{ needs.changes.outputs.release-build == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      retention-days: 1
      artifact-prefix: rebuild-
      sbom: false

  release-compare:
    name: Image comparison (${{ matrix.arch }})
    needs: [release-dry-run, release-rebuild]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the first build's archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.arch }}
          path: first

      - name: Download the second build's archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuild-image-${{ matrix.arch }}
          path: second

      # The archive, never the uploaded zip: an upload's digest changes from run to run.
      - name: Compare the two archives
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/image-archive.sh compare "first/image-${ARCH}.tar" "second/image-${ARCH}.tar"

  # Nightly and dispatched grype scans cover the dry-run SBOMs without gating because disclosures change.
  # !cancelled() keeps one architecture's scan when the other build fails.
  grype:
    name: Vulnerability scan (grype, report-only)
    needs: release-dry-run
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the grype SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Download the SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: artifacts

      - name: Scan the arm64 closure
        if: ${{ !cancelled() && hashFiles('artifacts/sbom-arm64/ecluse.cdx.json') != '' }}
        run: nix develop .#ci --command task scan-sbom SCAN_SBOM=artifacts/sbom-arm64/ecluse.cdx.json SCAN_SARIF=grype-arm64.sarif

      - name: Scan the amd64 closure
        if: ${{ !cancelled() && hashFiles('artifacts/sbom-amd64/ecluse.cdx.json') != '' }}
        run: nix develop .#ci --command task scan-sbom SCAN_SBOM=artifacts/sbom-amd64/ecluse.cdx.json SCAN_SARIF=grype-amd64.sarif

      - name: Upload the arm64 SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('grype-arm64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: grype-arm64.sarif
          category: grype

      - name: Upload the amd64 SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('grype-amd64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: grype-amd64.sarif
          category: grype-amd64

  gate:
    name: CI gate
    # Add a gating job to both `needs` and scripts/ci-gate-verdict.sh.
    # smoke and grype do not gate. Required contexts are in .agents/orchestration-strategy.md.
    needs:
      - changes
      - build
      - allocation
      - coverage
      - codecov-notify
      - static-checks
      - docs
      - e2e-prepare
      - e2e-conformance
      - e2e
      - backend-conformance
      - weeder
      - stan
      - release-dry-run
      - release-dry-run-assemble
      - release-dry-run-boot
      - release-compare
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      # The script accepts a skip only from the classifier's two filters (documentation
      # only, and no release-build change), each for the jobs it may skip.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every gating job
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          RELEASE_BUILD: ${{ needs.changes.outputs.release-build }}
          CHANGES: ${{ needs.changes.result }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          BUILD: ${{ needs.build.result }}
          ALLOCATION: ${{ needs.allocation.result }}
          COVERAGE: ${{ needs.coverage.result }}
          CODECOV_NOTIFY: ${{ needs.codecov-notify.result }}
          DOCS: ${{ needs.docs.result }}
          E2E_PREPARE: ${{ needs.e2e-prepare.result }}
          E2E_CONFORMANCE: ${{ needs.e2e-conformance.result }}
          E2E: ${{ needs.e2e.result }}
          BACKEND_CONFORMANCE: ${{ needs.backend-conformance.result }}
          WEEDER: ${{ needs.weeder.result }}
          STAN: ${{ needs.stan.result }}
          RELEASE_DRY_RUN: ${{ needs.release-dry-run.result }}
          RELEASE_DRY_RUN_ASSEMBLE: ${{ needs.release-dry-run-assemble.result }}
          RELEASE_DRY_RUN_BOOT: ${{ needs.release-dry-run-boot.result }}
          RELEASE_COMPARE: ${{ needs.release-compare.result }}
        run: bash scripts/ci-gate-verdict.sh
