name: CI

# Every push to main and every PR, so a feature-branch push never double-runs beside
# its PR. The nightly schedule re-runs main as a health check, most valuably the smoke
# tier, which catches live-registry protocol drift that lands independent of this repo.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly health check (most valuably the smoke tier)
  workflow_dispatch:

# Never cancel on main: it keeps the complete build history of every commit that lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default. Jobs that need more widen it at the job level.
permissions:
  contents: read

# Every gating check is a job in this graph feeding the terminal `gate` job, the single
# Required status check in branch protection alongside Codecov's server-side statuses.
# Setup actions carry their SHA pins once, in .github/actions/setup-toolchain, whose
# description owns the caching policy.
#
# Every timeout-minutes below catches a hang. It is not a budget: CI is free on this
# public repository, so each value clears a fully cold run. Raise one that starts to
# cancel real runs, and never tighten one towards the observed mean.
jobs:
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the PR's changed-file list
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The allow-list of documentation paths lives in the script, which fails closed:
      # an unlisted path, an unreadable file list, or any non-PR event runs every job.
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-classify-change.sh

  build-test:
    name: Build & tests (core-unit + app-unit + integration)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    # One job builds the project once, then runs every Haskell tier against those same
    # on-disk artifacts. Two runners would otherwise race to populate one shared,
    # first-writer-wins cabal cache that ends up incomplete for the widest plan.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write # OIDC for tokenless Codecov upload (no stored token)
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal # deterministic, cacheable store location
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      # Cached here, not in the shared action: no other job builds dist-coverage. A
      # stale .mix is inert, hpc-codecov reads only the modules the .tix names.
      - name: Restore dist-coverage
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-coverage
          key: dist-coverage-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            dist-coverage-${{ runner.os }}-

      # An exact cabal-store hit means the restored index already covers
      # cabal.project's pinned index-state, and `cabal update` would only re-fetch
      # Hackage's TUF metadata over its occasional dead-mirror fallback.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # The unauthenticated runners share a throttled Docker Hub IP pool whose
      # auth-token endpoint intermittently times out, and one throttled pull inside a
      # testcontainers `docker build FROM` cascades the tier to red. The refs mirror
      # the pins in test/integration/Ecluse/Integration/Ministack.hs and the telemetry
      # specs, which are the source of truth.
      - name: Pre-pull pinned integration images (Docker Hub throttle resilience)
        run: >-
          bash scripts/docker-prepull.sh
          ministackorg/ministack@sha256:5164592def36af01b8ac76364028e27c5ecd8f1494c8a53d5fcd811cc7dfb594
          otel/opentelemetry-collector@sha256:3805724e26351df55a45032a793c9b64a2117ac9a58f13f070674a9723fab373

      # cache-nix-action trims the store with `nix store gc` before saving, and a dev
      # shell holds no GC root, so without this profile the saved entry loses `.#ci`.
      - name: Root the .#ci shell for the Nix-store cache save
        run: nix develop .#ci --profile "$RUNNER_TEMP/ecluse-ci-profile" --command true

      - name: Cabal checks (build, coverage, doctest, cabal-check)
        run: nix develop .#ci --command task cabal-checks

      - name: Upload core unit coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/ecluse-core-unit.json
          flags: unit
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      - name: Upload app unit coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/ecluse-unit.json
          flags: unit
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      - name: Upload runtime unit coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/ecluse-runtime-unit.json
          flags: unit
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/ecluse-integration.json
          flags: integration
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      # This job is the sole writer of the three cabal-side caches, and only from main.
      # The !cancelled() condition keeps the warm store when a later tier fails: the
      # deps built fine and are worth caching. A save no-ops when the key already
      # exists, so a dependency epoch lands once and later runs reuse it untouched.
      - name: Save cabal store (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cabal
          key: cabal-store-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}

      - name: Save dist-newstyle (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}

      - name: Save dist-coverage (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-coverage
          key: dist-coverage-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}

  smoke:
    name: Smoke tests (live registries, non-gating)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Hits public npm and PyPI to catch protocol drift when those registries change
    # their wire behaviour. It is not a `gate` dependency and it sets
    # continue-on-error, so a transient live-registry blip never blocks a merge while
    # a real drift still shows red on the PR.
    continue-on-error: true
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          save-nix-store: "false" # build-test is the single writer of the shared store

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Smoke tests
        run: nix develop .#ci --command task test-smoke

  e2e:
    name: End-to-end tests (whole-system, real npm)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    # Stands the whole system up as the real OCI image, an nginx stub, and Verdaccio on
    # a docker network, driven by the real npm CLI. It catches composition-root and
    # cross-component regressions nothing else does, and unlike smoke it is hermetic,
    # so it GATES. If it turns flaky, reach for a nightly-only cadence or a larger
    # runner before dropping it from the gate.
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          # `nix build .#dockerImage` links the same ~188-package Nix-built Haskell
          # closure `checks.docs` does. On the shared "nix" store, which holds the
          # `.#ci` shell instead, this job rebuilt every one of them from source.
          nix-cache-prefix: nix-docs
          save-nix-store: "false" # the docs job is the single writer of nix-docs

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # A single throttled pull inside the suite's setup hook cascades every case to
      # pending and reddens this gating job. The refs copy the digest pins in
      # test/e2e/Ecluse/E2E/Harness/Docker.hs verbatim, so they add no trust surface.
      - name: Pre-pull pinned e2e images (Docker Hub throttle resilience)
        run: >-
          bash scripts/docker-prepull.sh
          ministackorg/ministack@sha256:5164592def36af01b8ac76364028e27c5ecd8f1494c8a53d5fcd811cc7dfb594
          otel/opentelemetry-collector@sha256:3805724e26351df55a45032a793c9b64a2117ac9a58f13f070674a9723fab373
          verdaccio/verdaccio@sha256:9d622d256378c6e7ae09f384774ee2f0f8ac67a66c066db55921a0b7218abc4c
          nginx@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa

      - name: End-to-end suite (builds + loads the image, drives the real npm CLI)
        run: nix develop .#ci --command task test-e2e

  static-checks:
    name: Static checks (format, lint, Semgrep, workflows, site)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Four sub-minute checks in one job, so the toolchain setup is paid once. Each runs
    # even if an earlier one failed, so one run reports them all. `task static-checks`
    # also assembles the pandoc site over stubbed API artefacts, so a dangling link
    # fails the PR here instead of the Pages deploy after merge.
    permissions:
      contents: read
      security-events: write # upload the Semgrep SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          save-nix-store: "false" # build-test is the single writer of the shared store

      - name: Static checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command task static-checks

      # Semgrep still gates on every PR (`task sast` fails on findings). This upload is
      # only the Security-tab view, which tracks main, hence always().
      - name: Upload Semgrep SARIF to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  docs:
    name: Haddock builds
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    # Sized for a cold run after a dependency-overlay change in flake.nix, which
    # rebuilds the overridden closure's doc outputs from source.
    timeout-minutes: 100
    # Builds the library Haddock, so a broken doc comment fails on the PR rather than
    # after merge when the Pages deploy fails. It builds the `checks.docs` flake check
    # rather than `cabal haddock`, which wants a documentation variant of the deps that
    # build-test's `cabal build` store lacks and so rebuilds the whole closure. It
    # builds the freeze-sync and amazonka-lockstep checks in the same store.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Sole writer of the Nix-built Haskell closure, which the e2e job also
          # restores for `.#dockerImage`. The cap covers the whole store this job
          # accumulates (~10.5 GB observed), not just the output closure.
          nix-cache-prefix: nix-docs
          nix-gc-max-store-size: 13G

      - name: Flake checks (docs Haddock, freeze-sync, amazonka-lockstep)
        run: >-
          nix build --no-link --print-build-logs
          .#checks.x86_64-linux.docs
          .#checks.x86_64-linux.freeze-sync
          .#checks.x86_64-linux.amazonka-lockstep

  weeder:
    name: Dead-code check (weeder)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Reports library code not reachable from the app entry (`Ecluse.run`), and any
    # finding fails the gate, so the PR that adds an unreachable definition catches it.
    # Its own job because the -fwrite-ide-info build is heavy.
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          save-nix-store: "false" # build-test is the single writer of the shared store

      # dist-analysis is deliberately NOT cached: weeder scans every .hie under it and
      # cabal cannot delete the artifacts of removed source files, so a restored
      # builddir feeds it orphaned .hie for modules that no longer exist. The same
      # staleness gave stan 132 observations against a true floor of 35. Do not add a
      # cache here without a per-run orphan-.hie prune.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: weeder (fails on findings)
        run: |
          set -eo pipefail
          nix develop .#ci --command task weeder 2>&1 | tee weeder.out

      - name: Render weeder findings to the run summary
        if: always()
        run: |
          {
            echo '## weeder: library code not reachable from the app entry';
            echo;
            echo '_Gating: any finding fails this job and the CI gate. A finding is a definition built into the library but not wired into the app entry (Ecluse.run); land its wiring in the same slice, or root it in weeder.toml._';
            echo;
            echo '```';
            grep -E ':[0-9]+:[0-9]+:' weeder.out || echo '(no findings)';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  stan:
    name: Haskell static analysis (stan)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # HIE-based partial-function and bug analysis at the floor in .stan.toml, which
    # Semgrep (no Haskell) and hlint (no type info) cannot see. A finding above the
    # floor fails the gate. Its own job, like weeder, for the same heavy build.
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          save-nix-store: "false" # build-test is the single writer of the shared store

      # dist-analysis is not cached here either, for the reason on the weeder job.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: stan (fails on findings)
        run: |
          set -eo pipefail
          nix develop .#ci --command task stan 2>&1 | tee stan.out

      - name: Render stan findings to the run summary
        if: always()
        run: |
          {
            echo '## stan: Haskell static analysis (gating: any finding above the floor fails this job and the CI gate)';
            echo;
            echo 'Partial functions and potential bugs (HIE-based) at the Warning floor. Nothing is ignored without an explicit decision; run "task stan-all" locally for the full set incl Performance/space-leak.';
            echo;
            echo '```';
            sed -E 's/\x1b\[[0-9;]*m//g' stan.out 2>/dev/null || echo '(no output)';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: CI gate
    # The single Required check. Wire a new required check in by adding it to `needs`
    # here AND to scripts/ci-gate-verdict.sh, never as another required check. The smoke
    # job is intentionally absent: it runs on PRs for visibility but is non-gating.
    needs: [changes, build-test, static-checks, docs, e2e, weeder, stan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The script accepts a skip only from the documentation-only filter, and only for
      # the jobs that filter may skip. Every other skip still fails the gate.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every gating job
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          CHANGES: ${{ needs.changes.result }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          BUILD_TEST: ${{ needs.build-test.result }}
          DOCS: ${{ needs.docs.result }}
          E2E: ${{ needs.e2e.result }}
          WEEDER: ${{ needs.weeder.result }}
          STAN: ${{ needs.stan.result }}
        run: bash scripts/ci-gate-verdict.sh
