version: '3'

tasks:
  build:
    desc: Prepare and archive both frozen binaries before any measurement
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - bash scripts/bench-load-paired.sh prepare
      - bash scripts/bench-load-paired.sh build A
      - bash scripts/bench-load-paired.sh build B
      - bash scripts/bench-load-paired.sh seal
  delegate:
    desc: Delegate the existing harness and proxy cgroup layout
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - bash scripts/bench-load-paired.sh delegate
      - bash scripts/bench-load-paired.sh preflight
  children:
    desc: Run ABBA BAAB for both native scenarios and concurrency-one controls
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - bash scripts/bench-load-paired.sh children
  observer-plan:
    desc: Print the balanced sampler on/off order without running measurements
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - bash scripts/bench-load-paired.sh observer-plan
  observer-control:
    desc: Compare sampler on/off for both revisions, shapes and loaded scenarios
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - bash scripts/bench-load-paired.sh observer-control
  grid:
    desc: Run one complete native grid with an archived binary
    dir: '{{.TASKFILE_DIR}}/..'
    requires:
      vars: [SIDE, ORDINAL]
    env:
      PAIRED_SIDE: '{{.SIDE}}'
      PAIRED_ORDINAL: '{{.ORDINAL}}'
    cmds:
      - bash scripts/bench-load-paired.sh grid "$PAIRED_SIDE" "$PAIRED_ORDINAL"
  check:
    desc: Check the diagnostic scripts and workflow without building Haskell
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - bash -n scripts/bench-load-paired.sh scripts/bench-load-sample.sh scripts/bench-load-paired.test.sh
      - shellcheck scripts/bench-load-paired.sh scripts/bench-load-sample.sh scripts/bench-load-paired.test.sh
      - bash scripts/bench-load-paired.test.sh
      - actionlint .github/workflows/bench-load.yml
      - yq -e '.on.workflow_dispatch.inputs | length <= 10' .github/workflows/bench-load.yml
