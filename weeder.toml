# weeder reports library code that no path from the application entry point
# (app/Main.hs → Ecluse.run) reaches. `make weeder` builds only the library and the
# executable, not the test suites, with .hie info. So "reachable" means "wired into
# the running proxy", never "covered by a test".
#
# That surfaces any library code the composition root does not yet wire in: config
# loading, policy resolution, the queue and credential backends, and the rest. We
# build and test such code ahead of the change that connects it. The tree carries
# zero app-unreachable definitions today, and the `weeder` CI job GATES on that. A
# new unreachable definition fails the job and blocks the merge (see ci.yml →
# weeder). So a change lands its scaffolding and the wiring that reaches it
# together, or roots the definition below.

# Root the supported json-stream parser and lexer APIs. Private decoder and scanner helpers must remain reachable.
# The application entry point, Cabal's Paths_ module and the exception below are the other roots.
#
# Ecluse.Core.Security.Egress.DevHttp.loopbackRegistryUrl stays rooted here rather
# than moving out of ecluse-core. The plain-http RegistryUrl former stays locked
# inside the egress boundary on purpose. The raw constructor lives in the unexposed
# Ecluse.Core.Security.Egress.Internal, and the https-only egress design keeps it
# unreachable from any exposed surface. Moving the former to a test or bench library
# would widen that boundary. Its only consumers are the hermetic test tiers and the
# load harness, and weeder roots neither. The module exists only under the
# dev-http-egress flag, so a release build carries no copy.
roots = [
  "^Data\\.JsonStream\\.Parser\\.\\.!$",
  "^Data\\.JsonStream\\.Lexer\\.Internal\\.(mkPlainString|plainBytes|start|next|feed|remaining)$",
  "^Data\\.JsonStream\\.Lexer\\.(plainText|decodeString)$",
  "^Main\\.main$",
  "^Paths_",
  "^Ecluse\\.Core\\.Security\\.Egress\\.DevHttp\\.loopbackRegistryUrl$",
  "^Data\\.JsonStream\\.Parser\\.(runParser|runParser'|parseByteString|parseLazyByteString|decode|eitherDecode|decodeStrict|eitherDecodeStrict|value|valueWith|string|byteString|safeString|number|integer|real|bool|jNull|safeByteString|objectWithKey|objectItems|objectValues|objectKeyValues|arrayOf|arrayWithIndexOf|indexedArrayOf|nullable|objectOf|filterI|takeI|mapWithFailure|manyReverse|foldI|foldMapI|unFoldI|catMaybeI|arrayFound|objectFound)$",
]

# Treat instance methods as roots, so weeder does not report a lawful type-class
# instance just because the app has no direct call site for it.
type-class-roots = true
