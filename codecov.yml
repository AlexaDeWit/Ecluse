# Codecov configuration. See docs/testing.md -> "Coverage".
#
# Each gating test suite generates its own coverage (HPC -> hpc-codecov, native
# Codecov JSON) and uploads it under a flag. Codecov then merges the tiers into one
# project total while still tracking each. Both the `unit` and `integration` tiers
# upload, each under its own flag. The smoke tier stays out: it is non-gating and
# network-bound.

# The single gating build-test job uploads four coverage reports per commit:
# `ecluse-core-unit` (flag: unit), `ecluse-runtime-unit` (flag: unit), `ecluse-unit`
# (flag: unit), and `ecluse-integration` (flag: integration). Wait for all FOUR before
# computing statuses. With the default of 1, Codecov computes the project total off
# whichever upload lands first. It fires a transient "coverage decreased" status, then
# re-computes when the others arrive. The build-test job always emits exactly these
# four, so a fixed wait is deterministic and safe here. Were the count ever variable,
# `notify.manual_trigger` plus an explicit send-notifications step would be the
# alternative.
codecov:
  notify:
    after_n_builds: 4

coverage:
  status:
    project:
      default:
        target: auto # no regression versus the PR base
        threshold: 1% # absorb rounding and noise, block real drops
    patch:
      default:
        # New and changed lines must be at least 85% covered. That floor checks
        # behaviour without grinding on the number. Coverage confirms behaviour, so
        # reason about the code, test the branches, and let this status flag the
        # genuine gaps. About 95% is a long-term goal, not a per-PR gate, because
        # chasing it per PR is wasteful. The project status above stays on
        # no-regression, so the baseline still ratchets up as well-covered changes
        # land.
        target: 85%

# Flags let one combined gate span multiple suites. `carryforward` keeps a suite's
# last-known coverage on runs that do not re-upload it, a skipped job for example.
#
# Three uploads land per commit: ecluse-core-unit (flag: unit), ecluse-unit (flag:
# unit), and ecluse-integration (flag: integration). Both unit suites upload under
# the same `unit` flag, so Codecov merges their reports into one flag total. The
# `unit` paths cover src/ (composition shell), runtime/src/ (effectful edge), and
# core/src/ (core), so the merged flag view excludes no layer.
#
# `carryforward` here is a SAFETY NET, not an active path. Every flag re-uploads on
# EVERY commit: the single `build-test` job runs all three Coverage steps
# unconditionally, with no `if:` guard and `fail_ci_if_error: true`. So each flag
# always lands a fresh report, and `carryforward` never substitutes. A PR that
# *adds* a module cannot show that module uncovered from a stale carried-forward
# report. `carryforward` takes effect only when an upload is genuinely missing, a
# removed or skipped job for example. Then keeping the last-known number beats
# dropping the flag to 0% and firing a false regression.
flags:
  unit:
    paths:
      - src/
      - runtime/src/
      - core/src/
    carryforward: true
  integration:
    paths:
      - src/
      - runtime/src/
      - core/src/
    carryforward: true

# Out of scope for coverage: the thin executable entry point, the inform-only
# benchmark harness, and the tests. The bench/ harness measures time and
# allocations. It is never application code under test, so its new files must not
# count toward project or patch coverage. The `test/**` glob already covers the
# shared ecluse-test-support library under test/support/. The list below still names
# it, because that library is a first-class cabal component, and the coverage build
# instruments its Ecluse.Test.* modules. Codecov must never attribute it as software
# under test. The core/test/unit/** glob covers the ecluse-core-unit spec files
# (under test, not under test). The generation side enforces this too.
# `scripts/coverage.sh` and `scripts/coverage-combined.sh` exclude every
# Ecluse.Test.* module from the HPC report, so the support library never reaches
# Codecov in the first place. The `src/` and `core/src/` paths in `flags.*.paths`
# above are the matching positive constraint.
ignore:
  - "app/**"
  - "bench/**"
  - "test/**"
  - "test/support/**"
  - "core/test/**"
  - "runtime/test/**"

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
