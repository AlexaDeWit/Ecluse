# Codecov statuses wait for all four instrumented suites to upload.
codecov:
  notify:
    manual_trigger: true

coverage:
  status:
    project:
      default:
        target: auto # no regression versus the PR base
        threshold: 1% # absorb rounding and noise, block real drops
    patch:
      default:
        target: 85%

# Carry-forward never replaces a required upload on a successful CI run.
flags:
  unit:
    paths:
      - src/
      - runtime/src/
      - core/src/
    carryforward: true
  integration:
    paths:
      - src/
      - runtime/src/
      - core/src/
    carryforward: true

# Test contracts and drivers stay outside the product denominator.
ignore:
  - "app/**"
  - "bench/**"
  - "test/**"
  - "test/support/**"
  - "test/contracts/**"
  - "runtime/test-support/**"
  - "core/test/**"
  - "runtime/test/**"

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
