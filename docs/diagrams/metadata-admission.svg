<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 2 846 866" width="846" height="866"><title>Metadata listing and admission</title><rect x="22" y="2" width="846" height="866" fill="#F9F6F0"></rect><style>.saer-diagram-element {
  font-family: "Liberation Sans";
}
.saer-diagram-shape {
  fill: #FAF8F2;
  stroke: #38342E;
  stroke-width: 2;
}
.saer-diagram-actor {
  fill: #EAE5DA;
}
.saer-diagram-process {
  fill: #E7E9E1;
}
.saer-diagram-store {
  fill: none;
  stroke-width: 2.5;
}
.saer-diagram-boundary-box,
.saer-diagram-boundary-curve {
  fill: none;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.saer-diagram-note-frame {
  fill: none;
}
.saer-diagram-label {
  fill: #38342E;
  font-size: 10px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-note {
  fill: #6B655C;
  font-size: 12px;
  text-anchor: start;
  dominant-baseline: central;
}
.saer-diagram-flow {
  fill: none;
}
.saer-diagram-flow-arrow {
  fill: #38342E;
  stroke: none;
}
.saer-diagram-flow-label {
  fill: #6B655C;
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-flow-backing {
  fill: #F9F6F0;
  stroke: none;
}
.saer-diagram-out-of-scope .saer-diagram-shape {
  stroke: #6B655C;
  stroke-dasharray: 0 5;
  stroke-linecap: round;
}
.saer-diagram-out-of-scope .saer-diagram-flow-arrow {
  fill: #6B655C;
}
.saer-diagram-badge {
  stroke: #FAF8F2;
  stroke-width: 3;
}
.saer-diagram-badge-count {
  fill: #FAF8F2;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-primary .saer-diagram-badge-count {
  font-size: 11px;
}
.saer-diagram-badge-secondary .saer-diagram-badge-count {
  font-size: 9px;
}
.saer-diagram-badge-mark {
  fill: #FAF8F2;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-flag {
  stroke-linejoin: round;
}
.saer-diagram-tone-critical {
  fill: #C14339;
}
.saer-diagram-tone-high {
  fill: #A85E1D;
}
.saer-diagram-tone-medium {
  fill: #46788A;
}
.saer-diagram-tone-low {
  fill: #4B6B50;
}
.saer-diagram-tone-neutral {
  fill: #756E63;
}
.saer-diagram-tone-flag {
  fill: #38342E;
}

.saer-diagram-tone-low { fill: #4B6B50; stroke: #4B6B50; stroke-width: 3; }
.saer-diagram-tone-low ~ .saer-diagram-badge-count, .saer-diagram-tone-low ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-medium { fill: #46788A; stroke: #46788A; stroke-width: 3; }
.saer-diagram-tone-medium ~ .saer-diagram-badge-count, .saer-diagram-tone-medium ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-high { fill: #A85E1D; stroke: #A85E1D; stroke-width: 3; }
.saer-diagram-tone-high ~ .saer-diagram-badge-count, .saer-diagram-tone-high ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-critical { fill: #C14339; stroke: #C14339; stroke-width: 3; }
.saer-diagram-tone-critical ~ .saer-diagram-badge-count, .saer-diagram-tone-critical ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-neutral { fill: #756E63; stroke: #756E63; stroke-width: 3; }
.saer-diagram-tone-neutral ~ .saer-diagram-badge-count, .saer-diagram-tone-neutral ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-flag { fill: #38342E; stroke: #38342E; stroke-width: 3; }
.saer-diagram-tone-flag ~ .saer-diagram-badge-count, .saer-diagram-tone-flag ~ .saer-diagram-badge-mark { fill: #FAF8F2; }</style><g transform="translate(290, 10)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="570" height="440"></rect><text class="saer-diagram-label" x="285" y="11"><tspan x="285" dy="0">Operator trust zone</tspan></text></g></g><g transform="translate(310, 490)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="350" height="170"></rect><text class="saer-diagram-label" x="175" y="11"><tspan x="175" dy="0">Public internet</tspan></text></g></g><g transform="translate(30, 285)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-actor" width="160" height="90"></rect><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">Package client</tspan><tspan x="80" dy="12.5">(developer / CI)</tspan></text></g></g><g transform="translate(330, 250)"><g class="saer-diagram-element"><ellipse class="saer-diagram-shape saer-diagram-process" cx="80" cy="80" rx="80" ry="80"></ellipse><text class="saer-diagram-label" x="80" y="80"><tspan x="80" dy="0">Écluse proxy</tspan></text></g></g><g transform="translate(640, 285)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">C: private read</tspan><tspan x="80" dy="12.5">endpoint</tspan></text></g></g><g transform="translate(330, 530)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-actor" width="160" height="90"></rect><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">Public registry</tspan><tspan x="80" dy="12.5">(npm / PyPI)</tspan></text></g></g><g transform="translate(330, 65)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">Advisory store</tspan><tspan x="80" dy="12.5">(S3)</tspan></text></g></g><g transform="translate(30, 710)"><g class="saer-diagram-element"><text class="saer-diagram-note" x="6" y="13.5"><tspan x="6" dy="0">Inside the proxy: authorise private reads, gate public files, merge with private precedence, then encode.</tspan><tspan x="6" dy="15">First-party names read only C. A private 401 or 403 refuses the request.</tspan><tspan x="6" dy="15">Assembled reuse follows fresh private authorisation. Gzip starts anew for each response.</tspan></text></g></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 190 330 L 330 330"></path><path class="saer-diagram-flow-arrow" d="M 330 330 L 312 337 L 312 323 Z"></path><path class="saer-diagram-flow-arrow" d="M 190 330 L 208 323 L 208 337 Z"></path><rect class="saer-diagram-flow-backing" x="198.75" y="289.5" width="90.5" height="30.5"></rect><text class="saer-diagram-flow-label" x="244" y="298.5"><tspan x="244" dy="0">Listing request</tspan><tspan x="244" dy="12.5">and response</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 640 330 L 490 330"></path><path class="saer-diagram-flow-arrow" d="M 490 330 L 508 323 L 508 337 Z"></path><rect class="saer-diagram-flow-backing" x="511.5" y="295.5" width="107" height="30.5"></rect><text class="saer-diagram-flow-label" x="565" y="304.5"><tspan x="565" dy="0">Authorised private</tspan><tspan x="565" dy="12.5">metadata and bytes</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 410 530 L 410 410"></path><path class="saer-diagram-flow-arrow" d="M 410 410 L 417 428 L 403 428 Z"></path><rect class="saer-diagram-flow-backing" x="364.75" y="454.75" width="90.5" height="30.5"></rect><text class="saer-diagram-flow-label" x="410" y="463.75"><tspan x="410" dy="0">Anonymous</tspan><tspan x="410" dy="12.5">public metadata</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 410 155 L 410 250"></path><path class="saer-diagram-flow-arrow" d="M 410 250 L 403 232 L 417 232 Z"></path><rect class="saer-diagram-flow-backing" x="356.5" y="193.5" width="107" height="18"></rect><text class="saer-diagram-flow-label" x="410" y="202.5"><tspan x="410" dy="0">Advisory artifacts</tspan></text></g></svg>
