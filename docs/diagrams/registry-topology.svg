<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 966 841" width="966" height="841"><title>Registry topology and trust</title><rect x="2" y="2" width="966" height="841" fill="#F9F6F0"></rect><style>.saer-diagram-element {
  font-family: "Liberation Sans";
}
.saer-diagram-shape {
  fill: #FAF8F2;
  stroke: #38342E;
  stroke-width: 2;
}
.saer-diagram-actor {
  fill: #EAE5DA;
}
.saer-diagram-process {
  fill: #E7E9E1;
}
.saer-diagram-store {
  fill: none;
  stroke-width: 2.5;
}
.saer-diagram-boundary-box,
.saer-diagram-boundary-curve {
  fill: none;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.saer-diagram-note-frame {
  fill: none;
}
.saer-diagram-label {
  fill: #38342E;
  font-size: 10px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-note {
  fill: #6B655C;
  font-size: 12px;
  text-anchor: start;
  dominant-baseline: central;
}
.saer-diagram-flow {
  fill: none;
}
.saer-diagram-flow-arrow {
  fill: #38342E;
  stroke: none;
}
.saer-diagram-flow-label {
  fill: #6B655C;
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-flow-backing {
  fill: #F9F6F0;
  stroke: none;
}
.saer-diagram-out-of-scope .saer-diagram-shape {
  stroke: #6B655C;
  stroke-dasharray: 0 5;
  stroke-linecap: round;
}
.saer-diagram-out-of-scope .saer-diagram-flow-arrow {
  fill: #6B655C;
}
.saer-diagram-badge {
  stroke: #FAF8F2;
  stroke-width: 3;
}
.saer-diagram-badge-count {
  fill: #FAF8F2;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-primary .saer-diagram-badge-count {
  font-size: 11px;
}
.saer-diagram-badge-secondary .saer-diagram-badge-count {
  font-size: 9px;
}
.saer-diagram-badge-mark {
  fill: #FAF8F2;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-flag {
  stroke-linejoin: round;
}
.saer-diagram-tone-critical {
  fill: #C14339;
}
.saer-diagram-tone-high {
  fill: #A85E1D;
}
.saer-diagram-tone-medium {
  fill: #46788A;
}
.saer-diagram-tone-low {
  fill: #4B6B50;
}
.saer-diagram-tone-neutral {
  fill: #756E63;
}
.saer-diagram-tone-flag {
  fill: #38342E;
}

.saer-diagram-tone-low { fill: #4B6B50; stroke: #4B6B50; stroke-width: 3; }
.saer-diagram-tone-low ~ .saer-diagram-badge-count, .saer-diagram-tone-low ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-medium { fill: #46788A; stroke: #46788A; stroke-width: 3; }
.saer-diagram-tone-medium ~ .saer-diagram-badge-count, .saer-diagram-tone-medium ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-high { fill: #A85E1D; stroke: #A85E1D; stroke-width: 3; }
.saer-diagram-tone-high ~ .saer-diagram-badge-count, .saer-diagram-tone-high ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-critical { fill: #C14339; stroke: #C14339; stroke-width: 3; }
.saer-diagram-tone-critical ~ .saer-diagram-badge-count, .saer-diagram-tone-critical ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-neutral { fill: #756E63; stroke: #756E63; stroke-width: 3; }
.saer-diagram-tone-neutral ~ .saer-diagram-badge-count, .saer-diagram-tone-neutral ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-flag { fill: #38342E; stroke: #38342E; stroke-width: 3; }
.saer-diagram-tone-flag ~ .saer-diagram-badge-count, .saer-diagram-tone-flag ~ .saer-diagram-badge-mark { fill: #FAF8F2; }</style><g transform="translate(290, 10)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="670" height="660"></rect><text class="saer-diagram-label" x="335" y="11"><tspan x="335" dy="0">Operator trust zone</tspan></text></g></g><g transform="translate(10, 295)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="225" height="180"></rect><text class="saer-diagram-label" x="112.5" y="11"><tspan x="112.5" dy="0">Public internet</tspan></text></g></g><g transform="translate(30, 70)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-actor" width="160" height="90"></rect><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">Package client</tspan><tspan x="80" dy="12.5">(developer / CI)</tspan></text></g></g><g transform="translate(330, 35)"><g class="saer-diagram-element"><ellipse class="saer-diagram-shape saer-diagram-process" cx="80" cy="80" rx="80" ry="80"></ellipse><text class="saer-diagram-label" x="80" y="80"><tspan x="80" dy="0">Écluse proxy</tspan></text></g></g><g transform="translate(30, 345)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-actor" width="160" height="90"></rect><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">Public registry</tspan><tspan x="80" dy="12.5">(npm / PyPI)</tspan></text></g></g><g transform="translate(640, 70)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">C: private read</tspan><tspan x="80" dy="12.5">endpoint</tspan></text></g></g><g transform="translate(640, 335)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">A: first-party</tspan><tspan x="80" dy="12.5">publication store</tspan></text></g></g><g transform="translate(640, 535)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">B: public-derived</tspan><tspan x="80" dy="12.5">mirror store</tspan></text></g></g><g transform="translate(30, 715)"><g class="saer-diagram-element"><text class="saer-diagram-note" x="6" y="13.5"><tspan x="6" dy="0">C unions A and B only. A direct public upstream on C bypasses admission.</tspan><tspan x="6" dy="15">CodeArtifact boot checks refuse a detected public connection. Other inspection gaps remain an operator responsibility.</tspan></text></g></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 190 115 L 330 115"></path><path class="saer-diagram-flow-arrow" d="M 330 115 L 312 122 L 312 108 Z"></path><path class="saer-diagram-flow-arrow" d="M 190 115 L 208 108 L 208 122 Z"></path><rect class="saer-diagram-flow-backing" x="215" y="68" width="74" height="43"></rect><text class="saer-diagram-flow-label" x="252" y="77"><tspan x="252" dy="0">Requests and</tspan><tspan x="252" dy="12.5">package</tspan><tspan x="252" dy="12.5">responses</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 640 115 L 490 115"></path><path class="saer-diagram-flow-arrow" d="M 490 115 L 508 108 L 508 122 Z"></path><rect class="saer-diagram-flow-backing" x="511.5" y="80.5" width="107" height="30.5"></rect><text class="saer-diagram-flow-label" x="565" y="89.5"><tspan x="565" dy="0">Authorised private</tspan><tspan x="565" dy="12.5">metadata and bytes</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 190 390 L 410 390 L 410 195"></path><path class="saer-diagram-flow-arrow" d="M 410 195 L 417 213 L 403 213 Z"></path><rect class="saer-diagram-flow-backing" x="290.5" y="374.75" width="107" height="30.5"></rect><text class="saer-diagram-flow-label" x="344" y="383.75"><tspan x="344" dy="0">Anonymous public</tspan><tspan x="344" dy="12.5">metadata and bytes</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 720 335 L 720 160"></path><path class="saer-diagram-flow-arrow" d="M 720 160 L 727 178 L 713 178 Z"></path><rect class="saer-diagram-flow-backing" x="661" y="238.5" width="118" height="18"></rect><text class="saer-diagram-flow-label" x="720" y="247.5"><tspan x="720" dy="0">First-party packages</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 800 580 L 880 580 L 880 115 L 800 115"></path><path class="saer-diagram-flow-arrow" d="M 800 115 L 818 108 L 818 122 Z"></path><rect class="saer-diagram-flow-backing" x="829.25" y="338.5" width="101.5" height="18"></rect><text class="saer-diagram-flow-label" x="880" y="347.5"><tspan x="880" dy="0">Mirrored packages</tspan></text></g></svg>
