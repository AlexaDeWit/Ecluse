<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 866 786" width="866" height="786"><title>Revocation and cleanup</title><rect x="2" y="2" width="866" height="786" fill="#F9F6F0"></rect><style>.saer-diagram-element {
  font-family: "Liberation Sans";
}
.saer-diagram-shape {
  fill: #FAF8F2;
  stroke: #38342E;
  stroke-width: 2;
}
.saer-diagram-actor {
  fill: #EAE5DA;
}
.saer-diagram-process {
  fill: #E7E9E1;
}
.saer-diagram-store {
  fill: none;
  stroke-width: 2.5;
}
.saer-diagram-boundary-box,
.saer-diagram-boundary-curve {
  fill: none;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.saer-diagram-note-frame {
  fill: none;
}
.saer-diagram-label {
  fill: #38342E;
  font-size: 10px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-note {
  fill: #6B655C;
  font-size: 12px;
  text-anchor: start;
  dominant-baseline: central;
}
.saer-diagram-flow {
  fill: none;
}
.saer-diagram-flow-arrow {
  fill: #38342E;
  stroke: none;
}
.saer-diagram-flow-label {
  fill: #6B655C;
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-flow-backing {
  fill: #F9F6F0;
  stroke: none;
}
.saer-diagram-out-of-scope .saer-diagram-shape {
  stroke: #6B655C;
  stroke-dasharray: 0 5;
  stroke-linecap: round;
}
.saer-diagram-out-of-scope .saer-diagram-flow-arrow {
  fill: #6B655C;
}
.saer-diagram-badge {
  stroke: #FAF8F2;
  stroke-width: 3;
}
.saer-diagram-badge-count {
  fill: #FAF8F2;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-primary .saer-diagram-badge-count {
  font-size: 11px;
}
.saer-diagram-badge-secondary .saer-diagram-badge-count {
  font-size: 9px;
}
.saer-diagram-badge-mark {
  fill: #FAF8F2;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-flag {
  stroke-linejoin: round;
}
.saer-diagram-tone-critical {
  fill: #C14339;
}
.saer-diagram-tone-high {
  fill: #A85E1D;
}
.saer-diagram-tone-medium {
  fill: #46788A;
}
.saer-diagram-tone-low {
  fill: #4B6B50;
}
.saer-diagram-tone-neutral {
  fill: #756E63;
}
.saer-diagram-tone-flag {
  fill: #38342E;
}

.saer-diagram-tone-low { fill: #4B6B50; stroke: #4B6B50; stroke-width: 3; }
.saer-diagram-tone-low ~ .saer-diagram-badge-count, .saer-diagram-tone-low ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-medium { fill: #46788A; stroke: #46788A; stroke-width: 3; }
.saer-diagram-tone-medium ~ .saer-diagram-badge-count, .saer-diagram-tone-medium ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-high { fill: #A85E1D; stroke: #A85E1D; stroke-width: 3; }
.saer-diagram-tone-high ~ .saer-diagram-badge-count, .saer-diagram-tone-high ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-critical { fill: #C14339; stroke: #C14339; stroke-width: 3; }
.saer-diagram-tone-critical ~ .saer-diagram-badge-count, .saer-diagram-tone-critical ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-neutral { fill: #756E63; stroke: #756E63; stroke-width: 3; }
.saer-diagram-tone-neutral ~ .saer-diagram-badge-count, .saer-diagram-tone-neutral ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-flag { fill: #38342E; stroke: #38342E; stroke-width: 3; }
.saer-diagram-tone-flag ~ .saer-diagram-badge-count, .saer-diagram-tone-flag ~ .saer-diagram-badge-mark { fill: #FAF8F2; }</style><g transform="translate(10, 10)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="850" height="770"></rect><text class="saer-diagram-label" x="425" y="11"><tspan x="425" dy="0">Operator trust zone</tspan></text></g></g><g transform="translate(30, 125)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">Advisory store</tspan><tspan x="80" dy="12.5">(S3)</tspan></text></g></g><g transform="translate(345, 90)"><g class="saer-diagram-element"><ellipse class="saer-diagram-shape saer-diagram-process" cx="80" cy="80" rx="80" ry="80"></ellipse><text class="saer-diagram-label" x="80" y="80"><tspan x="80" dy="0">Dredger</tspan></text></g></g><g transform="translate(630, 125)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">B: public-derived</tspan><tspan x="80" dy="12.5">mirror store</tspan></text></g></g><g transform="translate(630, 365)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">C: private read</tspan><tspan x="80" dy="12.5">endpoint</tspan></text></g></g><g transform="translate(30, 365)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="90" x2="160" y2="90"></line><text class="saer-diagram-label" x="80" y="38.75"><tspan x="80" dy="0">A: first-party</tspan><tspan x="80" dy="12.5">publication store</tspan></text></g></g><g transform="translate(30, 495)"><g class="saer-diagram-element"><text class="saer-diagram-note" x="6" y="13.5"><tspan x="6" dy="0">A is not a deletion target.</tspan><tspan x="6" dy="15">First-party names are excluded.</tspan></text></g></g><g transform="translate(330, 530)"><g class="saer-diagram-element"><text class="saer-diagram-note" x="6" y="13.5"><tspan x="6" dy="0">Read both inventories, apply current revocation rules, require a named</tspan><tspan x="6" dy="15">denial, and recheck target consent.</tspan><tspan x="6" dy="15">Charge the logical deletion cap. Remove C only after B no longer serves</tspan><tspan x="6" dy="15">the denied copy.</tspan><tspan x="6" dy="15">Re-read for residual copies. Preview cannot delete.</tspan><tspan x="6" dy="15">Older writers and policy rollout can delay convergence.</tspan></text></g></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 190 170 L 345 170"></path><path class="saer-diagram-flow-arrow" d="M 345 170 L 327 177 L 327 163 Z"></path><rect class="saer-diagram-flow-backing" x="206" y="161" width="107" height="18"></rect><text class="saer-diagram-flow-label" x="259.5" y="170"><tspan x="259.5" dy="0">Advisory artifacts</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 505 170 L 630 170"></path><path class="saer-diagram-flow-arrow" d="M 630 170 L 612 177 L 612 163 Z"></path><path class="saer-diagram-flow-arrow" d="M 505 170 L 523 163 L 523 177 Z"></path><rect class="saer-diagram-flow-backing" x="505.75" y="129.5" width="123.5" height="30.5"></rect><text class="saer-diagram-flow-label" x="567.5" y="138.5"><tspan x="567.5" dy="0">B inventory / consent</tspan><tspan x="567.5" dy="12.5">and deletion requests</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 425 250 L 425 410 L 630 410"></path><path class="saer-diagram-flow-arrow" d="M 630 410 L 612 417 L 612 403 Z"></path><path class="saer-diagram-flow-arrow" d="M 425 250 L 432 268 L 418 268 Z"></path><rect class="saer-diagram-flow-backing" x="465.75" y="394.75" width="123.5" height="30.5"></rect><text class="saer-diagram-flow-label" x="527.5" y="403.75"><tspan x="527.5" dy="0">C inventory / consent</tspan><tspan x="527.5" dy="12.5">and deletion requests</tspan></text></g></svg>
