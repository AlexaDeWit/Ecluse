  - id: mit-withdrawn-advisory-exclusion
    title: Withdrawn advisories excluded
    prose: Pilot parses the optional withdrawal timestamp and excludes withdrawn records before it emits ranges or exact-version points, so a withdrawal removes both denial and remediation evidence while independent overlapping advisories still apply. A malformed timestamp follows malformed-record handling. Tests drive fixtures through local HTTP servers, the compiler, SQLite acceptance, sync, the shared rules, and the in-memory Dredger deletion path.
