  - id: mit-retained-copy-cleanup
    title: Reconcile retained copies across the mirror and the private read repository
    prose: The Dredger derives cleanup candidates from the actual inventories of the mirror (B) and the private read repository (C), and it repeats both scans after a failure or a restart. It keeps per-location presence and provenance, so a copy left only in C stays discoverable after B removal, and a version only in B stays discoverable before C retains it. It evaluates each candidate again against current policy, provenance, and consent, records each target's outcome, and retries transient failures with bounded backoff. Scheduling or audit records do not replace repository state and do not authorise a stale decision. First-party and unrelated content stay excluded. The Dredger checks the resulting private-read state and reports incomplete cleanup. Once roles agree and older writes finish, repeated scans reconcile late copies.
