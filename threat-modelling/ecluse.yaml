  - id: mit-cleanup-logical-version-cap
    title: Cap counts logical versions
    prose: The per-cycle deletion cap charges one logical version once across its copies in B and C, so operators need not estimate how many copies exist. Per-target operations, retries, and partial results stay separately visible, so one charged version is not mistaken for complete cleanup.
    status: implemented
    threats:
