      - bd6136ad-e767-424b-bda4-53144a8a7f10
  - id: mit-retained-copy-cleanup-guards
    title: Authority limits for cleanup of the private read repository
    prose: Cleanup in the private read repository (C) binds each delete to an explicit account, region, domain, repository, ecosystem, package, and version, through its own authorised capability. Each target needs its own consent and enough evidence to identify retained mirror-derived content. First-party content and content of unknown provenance stay outside automatic deletion. The deletion cap and dry run apply. Cleanup uses `DeletePackageVersions` on B and C, never `DisposePackageVersions`, `DeletePackage`, or repository deletion. Cleanup in C does not relax the mirror collision refusals.
