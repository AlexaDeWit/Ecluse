  - id: mit-advisory-source-age-alarm
    title: Advisory source age alarm
    prose: "Pilot records where each advisory artifact's data came from and how old the sources say it is: the OSV and EPSS source authorities, each source's Last-Modified time, the newest OSV record's modified time, and the EPSS score date and model version. After each published compile it logs every source's age, and it logs at ERROR when a source is older than `advisories.quietTime` for that ecosystem or `advisories.epssQuietTime` for EPSS, seven days by default. Pilot ignores a record's modified date that is unreadable or later than the run's clock, logs that at WARNING, and keeps the record's ranges. The recorded source dates are diagnostics and do not decide any verdict."
