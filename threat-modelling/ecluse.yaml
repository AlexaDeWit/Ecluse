  - id: mit-artifact-entry-keys
    title: Source-local artifact entry keys
    prose: "Artifact projection gives each entry a source-local key before lenient drops: PyPI keeps raw array positions, including in selective reads, and npm keys entries by version. Merge and assembly match the winning source, the digest of its exact upstream bytes, and the admitted key, and a missing, ambiguous, or mismatched identity contributes no entry. Valid duplicate entries keep their order and unknown fields. The existing fetch digest scopes snapshots, with no new serve-time hash, persistent identity, or schema epoch. CI checks allocation growth for array and object-key fan-out. The npm and PyPI adapters implement this contract."
    status: implemented
    threats:
