      - b74d9df0-8947-4e67-bf50-1c5e688a09f1
  - id: mit-epss-missing-score-abstain
    title: Missing EPSS scores abstain
    prose: When a version's advisory has no EPSS score, the EPSS rule abstains for that advisory. A missing score cannot deny admission or authorise a deletion on its own, and other scored advisories and decisive rules still apply.
    status: implemented
    threats:
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - 4d309275-cc3c-43d0-a1a2-f024789e9f17
  - id: mit-advisory-startup-retry
    title: Advisory startup retries without exit
    prose: When the proxy cannot acquire an advisory artifact at start, the process stays alive, retries within a bounded boot budget, logs ERROR when the budget runs out, and keeps polling. Readiness is false while no mount is ready and true once any mount is ready, so healthy mounts stay routable while another ecosystem's artifact is missing.
