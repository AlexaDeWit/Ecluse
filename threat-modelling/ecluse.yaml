formatVersion: 2
metadata:
  title: Écluse
  owner: Alexandra de Wit
  description: STRIDE threat model for Écluse, a supply-chain policy proxy for package registries. The 'High Level' diagram captures the canonical deployment posture. It shows per-caller passthrough credentials and AWS CodeArtifact reached over VPC endpoints. The three registries are a first-party private store, a public-derived mirror store, and a pull-through read endpoint. The demand-driven mirror worker mints its own write token under the container role. Edge access control and storage-layer scanning are operator responsibilities and out of scope, recorded as trust assumptions. This model is an iterative sketch, refined collaboratively. This YAML file is the single source of truth, and Saerskriven renders it.
  contributors:
    - Alexandra de Wit
assumptions:
  - id: as-edge-access-control
    prose: "The operator's access edge decides who may reach Écluse: a gateway, a service mesh, or a network policy. The edge restricts north-south and east-west traffic, so a compromised neighbour cannot reach a pod directly around an ingress-only allow-list. An access edge outside Écluse does not replace the edge token that a static publication token requires."
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000103
      - 0ec10e5e-0000-4000-8000-000000000106
    appliesToModel: true
  - id: as-edge-rate-limiting
    prose: The operator's edge limits request volume and concurrency, for callers of the proxy and for Pilot's advisory fetches. Écluse bounds the work of one request, not the total. Route selection, including PyPI filename parsing, runs before edge authentication and metadata admission, so the edge is what bounds total routing work.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000102
      - 3735906e-a06a-4e0f-ba45-894ba5400ce8
    appliesToModel: false
  - id: as-storage-scanning
    prose: Scanning the stores that hold packages is the operator's responsibility and is outside this model. Écluse decides what enters the mirror and what the proxy serves. It does not scan stored artifacts.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010a
    appliesToModel: true
  - id: as-least-privilege-grants
    prose: The operator gives each role its own identity with the least privilege the role needs, and Écluse cannot check these grants. Under `codeArtifact` the mirror worker's role policy allows reads of the mirror repository and package publication only, so the policy sets the scope of the minted token. Under `registry` and `verdaccio` the worker's static token belongs to a dedicated user whose package rights cover the mirror store only. This scoping is defence in depth behind Écluse's endpoint checks. The Dredger's delete grant covers the mirror repository and, where the operator enables cleanup of the private read repository, package-scoped deletion there, with its read and consent permissions granted separately and no permission over the publication target. The Dredger guide documents these permissions. A role-minted credential is preferred over a static secret, and on a store with no access control of its own the Dredger's account is a dedicated user whose package rights cover the mirror store only. Pilot holds `s3:PutObject` on the advisory prefix, the proxy holds `s3:GetObject` only, and the advisory bucket is private. The publisher's credential for the publication target is least privilege too.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000106
      - 0ec10e5e-0000-4000-8000-000000000107
      - b1a6332d-8def-4df9-922e-53718c920155
      - 32d813d8-6bee-4fa3-acb2-d62efe5aff18
      - 0ec10e5e-0000-4000-8000-000000000111
      - c12bddfe-96d4-47c6-92e0-a961abadb5b2
      - 987569ac-0a3a-4b7f-8b0a-7b67ee234097
    appliesToModel: false
  - id: as-queue-access-control
    prose: The mirror queue sits inside the operator's trust boundary and is isolated at the infrastructure level. A job is unauthenticated data that tells the worker to fetch and publish, so the right to send a job is the right to write the trusted store. Écluse relies on the queue's access control for message authenticity, not on signatures, which is the usual pattern for an internal queue with one producer and one consumer. The queue grant lets the serve role send and lets the worker receive and acknowledge. With that grant in place the admission gate is the one sender, so the trusted store holds what the gate admits.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000107
    appliesToModel: false
  - id: as-imds-hardening
    prose: The operator requires IMDSv2 and sets the metadata response hop limit to 1 on hosts that run Écluse. This is defence in depth behind Écluse's own refusal to follow internal locations. The operator does not block the metadata endpoint outright, because role token minting needs it.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000108
    appliesToModel: false
  - id: as-private-origin-trusted
    prose: Écluse trusts the private upstream to hold content it admitted before or first-party content, and a private read does not repeat public admission. When the private and public copies disagree, the disagreement proves neither copy correct, and a damaged private copy can stay served. Écluse keeps no persistent conflict state, does not revalidate the public copy on each read, and does not delete on divergence alone.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010b
      - 0ec10e5e-0000-4000-8000-00000000010d
    appliesToModel: false
  - id: as-trusted-stores-only-aggregation
    prose: "The private upstream, the pull-through read endpoint, unions trusted stores only: the first-party store and Écluse's mirror. It never connects to a public registry, so public content enters through Écluse's gate alone. The registry model and the deployment guide document this configuration, and the operator owns it. Écluse trusts the private upstream by design and cannot see how the registry wires its own upstreams, so it cannot detect a violation."
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010f
    appliesToModel: false
  - id: as-collapsed-topology-operator-choice
    prose: "The deployment guide recommends three registries, each governed on its own: a first-party store, a public-derived mirror store, and a pull-through read endpoint that unions the other two at the registry level. Écluse supports collapsing these roles onto fewer stores, down to one, and the guide discourages it. An operator who collapses them gives up the separation of first-party and public-derived inventory, per-store policy, and the Dredger's automated pruning, and accepts that residual against their own threat tolerance. The collapse weakens auditability and defence in depth. It does not remove the admission gate."
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010a
      - e23cddfe-96d4-47c6-92e0-a961abadb5b3
    appliesToModel: false
  - id: as-registry-server-stamped-fields
    prose: The primary registries stamp the publish time and the server-side integrity fields themselves. A publisher cannot forge the publish time, because it is not part of the publish document. Écluse reads registry metadata, so it trusts the registry operator's honesty, and a hostile registry operator is an adversary this model cannot counter, the same class as a malicious npm. A forged publish time would defeat the quarantine. Écluse does not anchor age to its own first observation of a version, because that anchor needs durable state shared across replicas, which conflicts with Écluse's network-broker design, and it would narrow only a surface that already sits outside what Écluse can treat. The central public registries, npmjs and PyPI among them, are infrastructure every consumer already trusts, and trusting their server-stamped timestamps is the practical choice. The owner accepts this residual risk.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010c
    appliesToModel: false
  - id: as-osv-source-truth
    prose: "Pilot relies on OSV as the source of vulnerability truth. A compromised OSV is a foundational supply-chain compromise that defeats advisory-based rules outright: it can cause false denials and eligible Dredger deletions, or admit a malicious remediation. Transport, parsing, validation, and last-good-database controls handle tampering in transit, malformed payloads, and outages, but they cannot make a hostile source trustworthy. The owner accepts this residual risk."
    status: valid
    threats:
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - c87367bd-fc3f-4792-94b6-8db459011823
    appliesToModel: false
  - id: as-epss-source-truth
    prose: Pilot relies on the configured EPSS feed for the truth of its scores, separately from OSV vulnerability records, and adds no independent check of score accuracy. HTTPS, bounded fetching, parsing, and score validation catch transport faults and malformed input, not plausible wrong scores. The owner accepts this residual risk. The acceptance does not cover completeness, availability, or freshness, which other controls handle.
    status: valid
    threats:
      - 4d309275-cc3c-43d0-a1a2-f024789e9f17
    appliesToModel: false
  - id: as-first-party-publishers-trusted
    prose: A publisher who holds publish rights inside a declared first-party namespace is trusted inside that namespace. Shadowing inside a declared scope, and the precedence of allow rules, are the operator's risk.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000106
    appliesToModel: false
  - id: as-first-party-declaration-review
    prose: Before an operator declares a namespace first-party, they review its existing copies in the mirror and in the private read repository, remove the public-derived versions they do not want, apply the declaration to every role, and check both stores again after older writes finish. Écluse does not hold back, clean up, or override the first-party guard for a newly declared namespace, so copies retained before the declaration stay served and protected from the Dredger.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000126
    appliesToModel: false
  - id: as-verdaccio-development-only
    prose: Verdaccio is a development and test store. Nobody runs a package proxy in front of a package proxy in production, so the exception for the `verdaccio` tag exists on no other tag. Verdaccio serves no marker a protocol read could carry, and no protocol read shows whether the store refills from an uplink, so the operator's `permitDeletion` key is the one evidence of consent and of the store's classification. The owner accepts that a re-pointed `verdaccio` target keeps its consent.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000127
    appliesToModel: false
  - id: as-cold-start-s3-dependency
    prose: "A proxy may depend on S3 to load advisories at cold start, without durable local advisory storage or recovery from a retained file. The owner accepts this for availability only. It does not accept stale advisory evidence: past the maximum advisory age, the CVE-blocking path refuses even under `onUnavailable: skip`."
    status: valid
    threats:
      - 6a368fa6-e4c8-446e-8e24-0685bb0980ef
    appliesToModel: false
  - id: as-policy-rollout-convergence
    prose: "Roles adopt a policy change by eventual consistency, with no coordinated pause and no shared policy authority. The operator follows the documented rollout order: when tightening policy, update admission and writer roles before the Dredger, and when relaxing a deny, update the Dredger before writers rely on the new permission. The operations guide also describes the risk of leaving an old Dredger active during a relaxation. Repeated sweeps remove eligible denied copies once roles agree and older writes finish, subject to backend availability and consent, not at once. The owner assesses the loss of the only copy of a version during a rollout as unlikely, without a measured deployment frequency, and accepts it. The acceptance covers rollout disagreement only, not deletion bugs, poisoned advisories, or unauthorised targets."
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010d
      - 1780db57-6b2f-456c-a393-e4e6b8b532f3
      - f2e4bd60-86cc-4a3d-b94a-5e971c29ae08
    appliesToModel: false
  - id: as-transfer-timing
    prose: A mirror transfer takes seconds, while new advisory evidence can take hours to reach the proxy. This is the owner's operational expectation, not a measured bound. Admission before advisory evidence exists is a known limit of the model. Écluse adds no last-moment rule check, cancellation barrier, or distributed write coordination for the window between the worker's check and its publish, and later Dredger sweeps reconcile late copies. The owner accepts this window. The acceptance does not promise immediate revocation and does not waive integrity verification, rule precedence, consent, or first-party protection.
    status: unconfirmed
    threats:
      - 1780db57-6b2f-456c-a393-e4e6b8b532f3
      - bd6136ad-e767-424b-bda4-53144a8a7f10
    appliesToModel: false
  - id: as-no-secrets-in-endpoint-urls
    prose: Operators do not put credentials in configured endpoint URLs, because the boot configuration echo prints them. Artifacts and logs from Pilot builds older than the credential-free source labels can hold advisory source credentials, and the operator reviews them.
    status: valid
    threats:
      - 9d92a448-e04d-46b6-8b8d-bc353dacdb97
    appliesToModel: false
  - id: as-epoch-rollout
    prose: "Operators roll out an advisory artifact format change in order: they publish artifacts at the new schema epoch before they switch consumers, keep old objects for old consumers during the rollout, update exact-key IAM policies, and run the current Pilot build on every publisher. Écluse has no automatic migration or compatibility fallback, and an older Pilot build can republish evidence a newer build excludes."
    status: valid
    threats:
      - 36f3684d-f2b4-4cd4-a017-6b390bc77a46
      - 1da83f8a-f998-4ef8-89bd-61a39b4e22ee
    appliesToModel: false
  - id: as-lookalike-name-review
    prose: People who add or update a dependency read the package names in lockfiles and dependency diffs before they accept the change. Écluse does not detect names that read as another name inside the permitted ASCII set, so this review is what catches a look-alike name.
    status: valid
    threats:
      - 0ec10e5e-0000-4000-8000-000000000124
    appliesToModel: false
