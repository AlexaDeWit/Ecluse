  - id: mit-fail-deny-without-advisories
    title: Absent advisories fail closed on deny rules
    prose: Requests keep their configured trusted-read, allow, skip, and refusal behaviour when advisories are absent. When evaluation reaches an advisory rule that fails closed, an absent database stops public admission.
    status: implemented
    threats:
