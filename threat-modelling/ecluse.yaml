  - id: mit-canonical-advisory-identity
    title: Canonical advisory package identity
    prose: "Pilot canonicalises package names before it stores advisory segments: PyPI by PEP 503, while npm and RubyGems keep their spelling. Denial and remediation consumers query the canonical key, so the Dredger's candidate selection and the shared rules use one identity. Pilot canonicalises configured exports itself and does not rely on the OSV schema's normalisation rule. Schema epoch 4 marks this stored meaning, and consumers refuse any other epoch, epoch 3 included."
