  - id: mit-advisory-overwrite-ordering
    title: Ordered advisory publication
    prose: "Planned in #1222. Pilot will refuse to overwrite a newer advisory artifact with older data, using metadata-only ordering and concurrency protection. A direct restore by the operator stays a permitted rollback. Independent source timestamps and intentional rule precedence stay unchanged."
