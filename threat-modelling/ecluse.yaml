threats:
  - id: 0ec10e5e-0000-4000-8000-000000000101
    number: 1
    title: Forwarded caller credentials aggregated in proxy memory
    category:
      methodology: STRIDE
      category: information-disclosure
    severity: high
    status: mitigated
    description: Under the canonical passthrough strategy the proxy transiently holds every caller's own CodeArtifact bearer token in process memory while it relays reads and publishes. One proxy compromise therefore harvests the credentials of all callers in transit, not one. A heap or memory dump, a log-field leak, and a malicious dependency in Écluse's own supply chain all reach that result. Passthrough spreads credential exposure across every user. A service identity would instead concentrate it in one short-lived token.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000020
  - id: 0ec10e5e-0000-4000-8000-000000000102
    number: 2
    title: Chokepoint exhaustion via pathological client or upstream input
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: medium
    status: mitigated
    description: Écluse is a mandatory chokepoint, so degrading its availability is itself a supply-chain attack. Builds fail, or operators are tempted to bypass the gate. A hostile or compromised upstream registry, or a pathological public package, could return an oversized, version-flooded, or deeply nested packument, and parsing it and evaluating the rules per version could exhaust CPU or memory. A caller who can reach the listener also controls the PyPI distribution filenames parsed during route selection, before edge authentication and metadata admission. Repeated prefix construction and canonicalisation on separator-heavy filenames can cause quadratic allocation and CPU work, and upstream Simple-index filenames reach the same parser.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000020
  - id: 0ec10e5e-0000-4000-8000-000000000103
    number: 3
    title: Off-by-default edge auth assumes a sound network boundary
    category:
      methodology: STRIDE
      category: spoofing
    severity: medium
    status: mitigated
    description: "The edge token, `server.authToken` (`ECLUSE_SERVER__AUTH_TOKEN`), is off by default. If the operator's access edge fails, an unauthenticated caller can drive the proxy. The east-west case is the notable one: a compromised neighbour reaches the pod directly and bypasses an ingress-only IP allow-list."
    elements:
      - 0ec10e5e-0000-4000-8000-000000000040
  - id: 0ec10e5e-0000-4000-8000-000000000104
    number: 4
    title: Caller credential leak to the public upstream
    category:
      methodology: STRIDE
      category: information-disclosure
    severity: high
    status: mitigated
    description: The upstream registry is attacker-influenceable and must never receive a caller's credential. A failure to strip the caller token on the public fetch would disclose a live CodeArtifact token to public npm. So would following a cross-host 3xx with the bearer still attached, to an attacker-chosen redirect target, over the unguarded private manager.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000043
  - id: 0ec10e5e-0000-4000-8000-000000000105
    number: 5
    title: SSRF via crafted identifier or upstream-declared dist.tarball
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: high
    status: mitigated
    description: Écluse builds outbound URLs from client-supplied package identifiers and upstream-declared artifact locations. A traversal, encoded-slash, or absolute-URL name could steer a fetch to an unintended target such as cloud metadata or the private network. So could a dist.tarball that points at an internal or attacker-chosen host.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000043
  - id: 0ec10e5e-0000-4000-8000-000000000106
    number: 6
    title: Package shadowing via first-party publish
    category:
      methodology: STRIDE
      category: tampering
    severity: high
    status: mitigated
    description: A publish reaches the publication target with the caller's credential, or with a static publication token after edge authentication. Every edge-token holder can publish anything the static token permits within the configured first-party scopes. The packument merge serves private versions as trusted, winning collisions over public ones. A compromised CI system or an insider publisher could clear the first-party check, or slip past it when the name the check authorises differs from the name the relay writes. They could then publish a name that the merge serves as a trusted version over the public package. That is a dependency-confusion path through Écluse's own trust model.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000044
  - id: 0ec10e5e-0000-4000-8000-000000000107
    number: 7
    title: Mirror-write credential is a standing privilege over the trusted store
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: high
    status: mitigated
    description: The mirror worker's role identity is the Écluse identity meant to write the mirror store (Registry B), which feeds the trusted read path. A worker compromise, or any bypass of the admission gate, could write attacker-chosen bytes into the trusted store and poison future reads. A mirror job is unauthenticated data that directs the worker to fetch and publish, so whoever can send to the queue can direct that write. On a store whose only control plane is the ecosystem protocol, the same credential also deletes versions, so a worker compromise can empty the mirror as well as poison it. What bounds the poisoning of future reads is the soundness of the admission gate, the role's blast radius, and queue access control, not the integrity check.
    elements:
      - 0ec10e5e-0000-4000-8000-00000000004a
  - id: 0ec10e5e-0000-4000-8000-000000000108
    number: 8
    title: SSRF to the instance-metadata credential endpoint
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: medium
    status: mitigated
    description: Container-role token minting must reach the instance-metadata endpoint (169.254.169.254) and STS. An SSRF that reached metadata could mint the worker's CodeArtifact credential.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000049
  - id: 0ec10e5e-0000-4000-8000-000000000109
    number: 9
    title: Cross-client disclosure of a private package via shared cache
    category:
      methodology: STRIDE
      category: information-disclosure
    severity: high
    status: mitigated
    description: A cache key carries no credential dimension. If the cache held a private-origin document, one caller could warm an entry and a second, differently authorised caller could receive it. That second caller receives the document without the upstream ever authorising their own request.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000030
  - id: 0ec10e5e-0000-4000-8000-00000000010a
    number: 10
    title: Registry collapse erases provenance and per-store policy
    category:
      methodology: STRIDE
      category: repudiation
    severity: medium
    status: mitigated
    description: Écluse supports collapsing its internal registry roles onto as few as one store. The recommended topology keeps the first-party store (A) and the public-derived mirror store (B) separate and unions them into the pull-through read endpoint (C) at the registry level. The degenerate floor is a mirror target set equal to the private upstream. Collapse loses the physical separation between first-party and public-derived inventory, so the operator can no longer apply distinct storage-level rule sets or scanning per provenance. Collapse also muddies incident scoping after a disclosure ("which mirrored public packages did we hold?"), which weakens a response that should be arithmetic, not forensics.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000034
  - id: 0ec10e5e-0000-4000-8000-00000000010b
    number: 11
    title: Undetected artifact substitution across upstreams
    category:
      methodology: STRIDE
      category: tampering
    severity: high
    status: mitigated
    description: When a version exists on both the private and the public origin, a substituted artifact could pass undetected and reach the client as the trusted copy. A weak-only or absent digest could hide the substitution, and so could a flaw in the divergence key. A backend that masks an authentication failure as a 404 can also send a read on to the public origin, because a 404 does not prove that authentication succeeded.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000032
  - id: 0ec10e5e-0000-4000-8000-00000000010c
    number: 12
    title: Upstream registry forges its own server-asserted metadata (e.g. a backdated publish time)
    category:
      methodology: STRIDE
      category: tampering
    severity: high
    status: accepted-risk
    description: Écluse's quarantine and integrity reasoning consume fields the upstream registry asserts, notably the per-version publish time and server-side integrity. A registry that asserted forged values could admit content the age and integrity gates would otherwise hold back. A backdated time defeats the quarantine, and a manufactured digest defeats the integrity check. This threat concerns the fields the registry itself asserts, not the tarball contents or the author-supplied fields, which the rules engine and the integrity floor gate.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000011
  - id: 0ec10e5e-0000-4000-8000-00000000010d
    number: 13
    title: Mirrored versions remain trusted until eligible pruning succeeds
    category:
      methodology: STRIDE
      category: tampering
    severity: medium
    status: open
    description: "Private reads trust previously mirrored versions without repeating public admission. Later advisory changes, removal of an allow, or an upstream yank do not themselves remove those copies. An advisory rule set to `onUnavailable: skip` can let another allow mirror a version during an advisory outage, and recovery alone does not revoke that copy. CodeArtifact can retain a serving copy in the private read repository (C) after the version leaves the mirror (B). Without working, authorised pruning, retained content can stay served indefinitely, and a serve-only mount can still read trusted private copies without a mirror target of its own."
    elements:
      - 0ec10e5e-0000-4000-8000-000000000034
  - id: 0ec10e5e-0000-4000-8000-00000000010e
    number: 14
    title: SSRF via the worker back-fill fetch (a blind sink)
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: low
    status: mitigated
    description: "The mirror worker fetches the approved artifact from an upstream-declared `dist.tarball` location to replicate it. Like the serve-path public fetch, this is untrusted egress to a target an attacker can influence, and it carries the same SSRF surface: a `dist.tarball` steered at an internal or cloud-metadata address. The fetch is a blind sink, because the worker publishes the bytes to the mirror and never returns them to a caller."
    elements:
      - 0ec10e5e-0000-4000-8000-000000000047
  - id: 0ec10e5e-0000-4000-8000-00000000010f
    number: 15
    title: Private-upstream aggregation admits the public registry, bypassing the gate
    category:
      methodology: STRIDE
      category: tampering
    severity: high
    status: transferred
    description: "The recommended topology unions the trusted stores, first-party A and the mirror B, into the pull-through read endpoint C at the registry level, and CodeArtifact upstream relationships are one such mechanism. If that aggregation also holds a direct connection to the public registry, raw public packages reach clients through C as a trusted source. They skip Écluse's gate entirely: the public admission rules, the public integrity floor, and the quarantine. Private metadata meets only the trusted integrity floor, and a private npm artifact hit applies no floor at serve time. The upstream merge that makes the recommended topology work also makes this the natural misconfiguration: a CodeArtifact repository's default npm-store upstream to npmjs has exactly this shape. The misconfiguration shows in Écluse's own signals: a private hit rate near 100%, few public fetches and few mirror jobs, and versions still inside the quarantine window served from the private side."
    elements:
      - 0ec10e5e-0000-4000-8000-000000000032
  - id: 0ec10e5e-0000-4000-8000-000000000110
    number: 16
    title: Connect-time reachability/timing oracle for an attacker-controlled allowlisted DNS
    category:
      methodology: STRIDE
      category: information-disclosure
    severity: low
    status: accepted-risk
    description: An attacker who controls the DNS for an allowlisted host can repoint it at internal addresses. Certificate validation makes the TLS handshake fail, so Écluse sends no request and leaks no data. The success or failure and the timing of the TCP connect and the TLS handshake still form a coarse internal-reachability or port-scan oracle. The oracle covers only allowlisted hosts whose DNS the attacker already controls. The owner accepts this residual.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000043
  - id: b1a6332d-8def-4df9-922e-53718c920155
    number: 17
    title: Pilot container-role privilege escalation
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: high
    status: mitigated
    description: An attacker who compromises Pilot could use its role identity's container credentials.
    elements:
      - f1646094-9885-422a-b7e7-7888c72905ef
  - id: 32d813d8-6bee-4fa3-acb2-d62efe5aff18
    number: 18
    title: Proxy compromised via tampered OSV database
    category:
      methodology: STRIDE
      category: tampering
    severity: high
    status: mitigated
    description: An attacker who can write to the S3 bucket could supply a tampered osv.db and bypass the vulnerability gates. Worse, they could exploit memory-corruption bugs in the underlying C SQLite engine when the proxy runs a query. A Magellan-style exploit or a malicious trigger is the vector.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000020
  - id: 3735906e-a06a-4e0f-ba45-894ba5400ce8
    number: 20
    title: Pathological OSV Payload (DoS)
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: medium
    status: mitigated
    description: OSV.dev, or a compromised upstream, could serve an oversized, deeply nested, or malformed JSON file, whether crafted to attack the parser or unexpectedly large. Parsing it could exhaust CPU or memory and crash Pilot.
    elements:
      - f1646094-9885-422a-b7e7-7888c72905ef
  - id: 0c922ee5-3ac6-4a85-89de-91feecf0f9f7
    number: 21
    title: Massive Purge DoS
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: medium
    status: mitigated
    description: A bug in Dredger, or a malicious rule configuration, could fire thousands of deletion requests at once. That exhausts the registry API limits and denies service to the private mirror.
    elements:
      - f66e2ffa-c6bf-4b45-8aad-a23ced3a97ff
  - id: 0ec10e5e-0000-4000-8000-000000000111
    number: 22
    title: Mirror-write credential can be sent to a misconfigured registry target
    category:
      methodology: STRIDE
      category: information-disclosure
    severity: medium
    status: mitigated
    description: A mirror-write credential is a live bearer token. Under the minting tag it is minted and scoped to a domain, and under the others it is the operator's static token. If an operator could choose the write credential and the mirror-target endpoint independently, the two could diverge. They could point the mirror target at one registry while the token was minted for another. That would disclose the bearer to an endpoint that could log or replay it.
    elements:
      - 0ec10e5e-0000-4000-8000-00000000004a
  - id: 0ec10e5e-0000-4000-8000-000000000123
    number: 23
    title: Package-name spoofing via invisible characters
    category:
      methodology: STRIDE
      category: spoofing
    severity: medium
    status: mitigated
    description: A requested or published package name can impersonate another package to a human reader. Unicode format characters (zero-width and bidirectional controls) render invisibly or reorder glyphs, so two distinct names look identical in a lockfile, a log line, or a review diff. A name can arrive from an upstream fetch as well as from a first-party publish, so the boundary applies to both directions.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000040
  - id: 0ec10e5e-0000-4000-8000-000000000124
    number: 24
    title: Package-name typosquatting within the permitted character set
    category:
      methodology: STRIDE
      category: spoofing
    severity: medium
    status: accepted-risk
    description: "A name built only from permitted ASCII characters can read as another name to a human: a capital I in place of a lowercase l, rn in place of m, a swapped or doubled letter, a hyphen moved or dropped. The upstream npm namespace already contains such look-alike names, and a first-party publish can introduce one. A reader of a lockfile, a log line, or a review diff resolves the wrong package. No safe look-alike detection can be designed now, because any similarity rule also flags legitimate packages. The owner accepts this risk. The ASCII allowlist keeps every name visible and comparable, first-party namespaces keep the deployment's own names off the public leg, and people review the names in lockfiles and dependency diffs."
    elements:
      - 0ec10e5e-0000-4000-8000-000000000040
  - id: 43f60aec-7a7c-4450-8992-ae2b42d20b0f
    number: 25
    title: Dredger inappropriately purges valid packages
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: medium
    status: mitigated
    description: A misconfiguration in Dredger, or poisoned OSV data, could delete legitimate, needed packages from Registry B. That causes cache misses or upstream fetch failures.
    elements:
      - f66e2ffa-c6bf-4b45-8aad-a23ced3a97ff
  - id: c12bddfe-96d4-47c6-92e0-a961abadb5b2
    number: 26
    title: Dredger container-role privilege escalation
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: high
    status: mitigated
    description: Dredger holds a standing privilege to delete from the mirror store (Registry B). An attacker who compromised Dredger could wipe that store. What bounds the privilege depends on the store. A store with its own access control can grant delete without write. A store whose only control plane is the ecosystem protocol offers no such split, so its delete runs over the same token that writes the mirror.
    elements:
      - f66e2ffa-c6bf-4b45-8aad-a23ced3a97ff
  - id: e23cddfe-96d4-47c6-92e0-a961abadb5b3
    number: 28
    title: First-party data loss from collapsed registries
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: high
    status: mitigated
    description: An operator can point a mount's mirrorTarget at a registry that another role already uses, such as any mount's publicationTarget or privateUpstream. Dredger deletes on a decisive deny against a mirrored public version. First-party packages and privately served packages in that same store then fall inside the blast radius.
    elements:
      - f66e2ffa-c6bf-4b45-8aad-a23ced3a97ff
  - id: 0ec10e5e-0000-4000-8000-000000000125
    number: 29
    title: Publisher credential relayed to a misdirected publication target
    category:
      methodology: STRIDE
      category: information-disclosure
    severity: medium
    status: mitigated
    description: "The publish path sends the caller's credential or a configured static publication token to the operator-declared publication target. A publication target written by mistake, or edited to a wrong value, would send that live bearer credential to an unintended registry. A public registry is the worst case: an operator who points the publication target at the public upstream turns every publish into a credential disclosure to a third party that can log or replay it."
    elements:
      - 0ec10e5e-0000-4000-8000-000000000044
  - id: c87367bd-fc3f-4792-94b6-8db459011823
    number: 101
    title: Oracle Blackout / Supply Chain DoS via OSV.dev compromise
    category:
      methodology: STRIDE
      category: spoofing
    severity: high
    status: accepted-risk
    description: An attacker who gains control of osv.dev can push malicious vulnerability records. Those records trigger false positives, or fast-lane a malicious remediation package. The attack is strongest when the attacker also publishes a malicious package. A hostile oracle defeats advisory-based rules outright.
    elements:
      - f1646094-9885-422a-b7e7-7888c72905ef
  - id: 0b32b3e5-74f1-421c-8c9b-92a24fd2a00b
    number: 102
    title: Accidental permanent deletion of registry data
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: critical
    status: mitigated
    description: Dredger issues permanent hard deletions against the mirror registry. Misconfigured, or pointed at the wrong registry, it destroys data permanently. Plain deletion permits a later publication of the same version, but recovery needs a remaining source of the bytes.
    elements:
      - f66e2ffa-c6bf-4b45-8aad-a23ced3a97ff
  - id: 0ec10e5e-0000-4000-8000-000000000126
    number: 103
    title: Dependency confusion through a first-party namespace on the public upstream
    category:
      methodology: STRIDE
      category: spoofing
    severity: high
    status: mitigated
    description: "A mount declares the namespaces the deployment owns. An attacker registers a package on the public upstream under a name, scope, or prefix inside one of them, choosing a name the private store does not carry, or a version of one it does. Without the privilege the public leg would answer for that name: the packument merge would fold the public document in, the artifact path would stream its bytes after a private miss, and the mirror would write the admitted version into the deployment's own store. A build resolving a first-party dependency would install the attacker's package. That is dependency confusion, and the public leg is where it enters. Each role reads the declaration from its own configuration, so during a rollout an older worker can still apply the earlier predicate. A namespace that is not declared receives no first-party protection."
    elements:
      - 0ec10e5e-0000-4000-8000-000000000043
  - id: 0ec10e5e-0000-4000-8000-000000000127
    number: 104
    title: Configured deletion consent stays valid when the store it names changes
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: medium
    status: accepted-risk
    description: "The `verdaccio` tag carries deletion consent as `permitDeletion: true`, a key in the mount's own configuration, so consent travels with the deployment rather than with the store. An operator who re-points the `verdaccio:` mirror target at a different Verdaccio store keeps a configuration that still says yes, and the Dredger reads consent for a store nobody granted it for. The same key carries the store's classification, so a re-pointed target is also read as standalone. The endpoint collision refusal does not catch a re-pointed target that collides with no other declared endpoint, so the Dredger deletes from it."
    elements:
      - f66e2ffa-c6bf-4b45-8aad-a23ced3a97ff
  - id: 0ec10e5e-0000-4000-8000-000000000128
    number: 105
    title: Store-supplied path components steer a credential-bearing delete
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: medium
    status: mitigated
    description: Removing one version from a protocol-only store is an edit over the store's own package document. Écluse reads that document, takes the revision marker and the artifact's file name out of it, puts the revision into the URLs of a `PUT` and a `DELETE`, and the file name into the `DELETE`, both carrying the mirror-write token. Écluse authored neither value, and a publisher supplies the tarball location the file name is taken from. A component holding a separator, a dot-dot, or a control character could steer either request at another path on the store.
    elements:
      - d5da865d-6e80-44da-a2ee-841f6bebd567
  - id: 6a368fa6-e4c8-446e-8e24-0685bb0980ef
    number: 106
    title: Cold-start advisory availability depends on S3
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: medium
    status: open
    description: A proxy configured to sync advisories from S3 starts without a loaded advisory generation. An S3 outage, a missing object, or a denied read can prevent its first sync. A replaced Kubernetes Pod loses its emptyDir data. A container restart within the same Pod can retain that data, but the proxy does not load a retained database at boot. Readiness alone does not block direct requests.
    elements:
      - c8455307-cef2-4843-a821-ff90db9643d2
  - id: 987569ac-0a3a-4b7f-8b0a-7b67ee234097
    number: 107
    title: Downstream cleanup gains authority over unrelated private versions
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: high
    status: mitigated
    description: Registry C can retain both mirror-derived and first-party versions. Granting Dredger deletion permission there extends its authority beyond Registry B. A misdirected cleanup or compromised process can remove a private version outside the intended mirrored set. A package-level IAM grant covers that package's versions and does not prove their provenance. CodeArtifact's INTERNAL origin does not prove that a version came from the mirror, because its domain entry point records the original publication, not the last upstream hop. Application checks cannot limit a compromised process beyond its IAM grant. Plain deletion permits later publication, but cannot recover bytes when no source remains.
    elements:
      - c9e4d8b4-1234-4d1c-8948-a0ba03f82abd
  - id: 1780db57-6b2f-456c-a393-e4e6b8b532f3
    number: 108
    title: Partial downstream cleanup leaves revoked content available
    category:
      methodology: STRIDE
      category: tampering
    severity: high
    status: mitigated
    description: Cleanup can remove a version from Registry B and fail before removing Registry C's retained copy. A restart can lose the remaining work, and later B listings no longer name the version. A successful private read then continues serving it. CodeArtifact listings are local to one repository, so neither listing alone shows both states. An available upstream or pending writer can also recreate content after a downstream delete. A pre-read or one successful delete cannot establish final removal across the configured targets.
    elements:
      - c9e4d8b4-1234-4d1c-8948-a0ba03f82abd
  - id: f2e4bd60-86cc-4a3d-b94a-5e971c29ae08
    number: 109
    title: An outdated Dredger policy deletes the only remaining package copy
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: medium
    status: accepted-risk
    description: Loss requires a retained version, a policy disagreement that lets an old Dredger deny what the intended policy permits, a deletion during that disagreement, and no remaining usable source of the bytes. The public source can disappear before the rollout, and no new admission during the rollout is required. The residual covers deletions from the mirror (B) and from the private read repository (C). Later policy agreement cannot restore the lost bytes, and repeated sweeps cannot converge while roles keep applying conflicting policies.
    elements:
      - f66e2ffa-c6bf-4b45-8aad-a23ced3a97ff
  - id: bd6136ad-e767-424b-bda4-53144a8a7f10
    number: 110
    title: An admitted mirror transfer can finish after an advisory changes
    category:
      methodology: STRIDE
      category: tampering
    severity: low
    status: accepted-risk
    description: The worker re-evaluates a queued job before it downloads the artifact. An advisory can change after that check. The pending transfer can then publish a version the new evidence denies, including after Dredger removes an earlier copy, if the backend permits recreation. A later private read trusts the resulting copy until eligible cleanup succeeds.
    elements:
      - 0ec10e5e-0000-4000-8000-00000000004a
  - id: 4d309275-cc3c-43d0-a1a2-f024789e9f17
    number: 111
    title: Incorrect EPSS source scores become authoritative policy evidence
    category:
      methodology: STRIDE
      category: spoofing
    severity: high
    status: open
    description: A compromised or incorrect EPSS source can supply plausible scores that pass validation. An overstated score can cause an EPSS denial and an eligible Dredger deletion. An understated score can fail to trigger an EPSS denial. Other configured rules still apply. Loss of EPSS coverage can remove a denial and let another allow admit the version, which does not show that the version is harmless. Transport and schema validity do not establish the accuracy of a predictive score.
    elements:
      - f1646094-9885-422a-b7e7-7888c72905ef
  - id: b74d9df0-8947-4e67-bf50-1c5e688a09f1
    number: 112
    title: Stale or incomplete advisory snapshots remain usable policy evidence
    category:
      methodology: STRIDE
      category: tampering
    severity: medium
    status: open
    description: The maximum advisory age runs from Pilot's last push, not from the source snapshot, and structural acceptance does not order source generations. A reduced but nonempty export still passes. These states can remove effective denial evidence, permit mirroring, or leave outdated advisory facts available to pruning. Compilation and consumer-load timestamps do not establish source freshness.
    elements:
      - c8455307-cef2-4843-a821-ff90db9643d2
  - id: 9d92a448-e04d-46b6-8b8d-bc353dacdb97
    number: 113
    title: Advisory source URL credentials enter artifacts and sync logs
    category:
      methodology: STRIDE
      category: information-disclosure
    severity: medium
    status: mitigated
    description: Custom advisory source URLs can carry userinfo and query credentials. Pilot writes source identities into artifact metadata, and consumer sync writes that metadata into INFO logs, so a complete URL in either place would disclose its credentials. The default public feeds need no credentials.
    elements:
      - f1646094-9885-422a-b7e7-7888c72905ef
  - id: 36f3684d-f2b4-4cd4-a017-6b390bc77a46
    number: 114
    title: Advisory package identity mismatch bypasses policy
    category:
      methodology: STRIDE
      category: tampering
    severity: high
    status: mitigated
    description: Advisory rules can query a package by its display spelling while identity comparisons use its canonical name. A PyPI package displayed as Flask_Thing could then miss an advisory stored as flask-thing, bypassing CVSS and EPSS denials and missing remediation evidence. The Dredger selects the canonical identity, but its shared rule query could miss the same advisory. This is a producer and consumer contract defect, independent of advisory truth or source-score trust.
    elements:
      - 0ec10e5e-0000-4000-8000-000000000020
  - id: 1da83f8a-f998-4ef8-89bd-61a39b4e22ee
    number: 115
    title: Withdrawn OSV records remain active policy evidence
    category:
      methodology: STRIDE
