  - id: mit-source-authority-labels
    title: Credential-free advisory source labels
    prose: Pilot stores each advisory source as its host and port through `authorityLabel`, excluding path, userinfo, query, and fragment, and keeps the complete URL only for fetching. Consumer sync logs fixed fields, such as compile time, row count, push time, source authority, and source dates, and never arbitrary metadata, even from older artifacts. A malformed display value does not change artifact acceptance.
