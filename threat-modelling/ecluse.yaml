    title: Rejected artifact entries return through filename-based assembly
    category:
      methodology: STRIDE
      category: tampering
    severity: high
    status: mitigated
    description: An upstream PyPI index can declare the same filename on admitted and refused entries. Assembly by filename alone could restore a sibling that location or integrity admission removed, return the refused digest fields in the listing, and rebase a foreign URL to the local artifact route. This is a listing-admission mismatch, not direct foreign-host egress, downloaded malicious bytes, or a demonstrated bypass of package-manager verification.
