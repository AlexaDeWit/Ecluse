  - id: mit-ascii-name-allowlist
    title: ASCII package-name allowlist
    prose: Every package-name component parses against an explicit ASCII allowlist before routing, caching, queueing, or publish admission, on the serve path and on the publish path. For npm the allowlist is letters, digits, and `- _ . ! ~ * ' ( )`, with `@` and `/` as scope structure and no leading period, hyphen, or underscore. The parser refuses a non-ASCII or control codepoint. The allowlist keeps every name visible and comparable, but it does not detect look-alike names inside the permitted set.
