    severity: high
    status: mitigated
    description: OSV exports retain withdrawn records and their affected ranges. If Pilot ignores withdrawal, an honest feed causes false advisory denials, invalid remediation exceptions, and eligible Dredger deletions. An existing artifact keeps the old evidence until a successful compile and sync replace it.
