mitigations:
  - id: mit-secret-redaction
    title: Credentials are redacted and request-scoped
    prose: Écluse holds a token in the `Secret` type, whose `Show` instance renders a fixed placeholder, so a token never reaches a log field. A token lives for one request, and the code unwraps it only to attach the bearer to an outbound request. Neither the data-plane nor the WAI span instrumentation records an `Authorization` header, although the WAI layer records benign headers such as `User-Agent`. A regression test keeps the `Authorization` header off the server span.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000101
  - id: mit-attested-image
    title: Attested, reproducible runtime image
    prose: A garbage-collected runtime cannot erase a token from the heap promptly, so the compensating control is the hardening of Écluse's own runtime and supply chain. The release builds a reproducible image with build provenance and SBOM attestations. grype and osv-scanner scan the image closure and report findings to code scanning for triage. The scans report and do not gate a change.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000101
  - id: mit-pypi-filename-parser
    title: Bounded PyPI filename parsing
    prose: PyPI coordinate parsing compares disjoint project-name chunks in bounded passes and keeps the existing filename grammar without a new length cap. Inbound distribution routing and upstream Simple-index projection use the same parser, and unit tests on both entry points assert subquadratic allocation growth for malformed filenames. Route selection runs before authentication and metadata admission, so those controls do not bound total routing work.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000102
  - id: mit-response-limits
    title: Fail-closed document limits
    prose: Fail-closed caps bound an upstream document's body size, version count, artifact count, and nesting depth (`ECLUSE_LIMITS__MAX_RESPONSE_BYTES`, `ECLUSE_LIMITS__MAX_VERSION_COUNT`, `ECLUSE_LIMITS__MAX_ARTIFACT_COUNT`, `ECLUSE_LIMITS__MAX_NESTING_DEPTH`). The bounded read stops mid-stream, and the Dredger reads a store's package document under the same size bound. The merge costs O(n log n) in version count. Écluse still projects the whole document before the version cap rejects it, and advisory-backed rules evaluate each version with no memoisation, so a document near the cap multiplies advisory lookups.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000102
      - 0ec10e5e-0000-4000-8000-000000000128
  - id: mit-request-coalescing
    title: Single-flight cache and request timeout
    prose: The single-flight cache joins concurrent misses for one package onto one computation, and a per-request timeout caps any single request. A document near the cap still costs CPU and heap, and a flood of distinct keys bypasses single-flight.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000102
  - id: mit-metadata-admission
    title: Memory-sized serve admission and cache weights
    prose: Serve admission caps concurrent metadata work at a limit derived from the resident-byte memory model. A separate byte-weighted gate admits publish requests. The selected-version cache charges retained release fields, text backing allocations, variable entry keys, and per-node overhead by conservative accounting rather than exact heap measurement, so shared allocations count more than once. An entry above its store budget, including a saturated weight, is served without retention or eviction. Cached absences carry a smaller charge, and occupancy reports the charged weights.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000102
  - id: mit-edge-token
    title: Optional edge token
    prose: When `server.authToken` is set, clients must present it, and the publish gate refuses a missing or wrong edge credential before any relay. The token is off by default.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000103
  - id: mit-static-publication-token
    title: Static publication token behind the edge token
    prose: A static publication-target token (`mounts.<eco>.publicationTarget.<tag>.token`) requires `server.authToken`, and the boot refuses a configuration with one and not the other. After the relay authenticates the edge token, it replaces that token with the static token, so the edge secret does not reach the publication target. Without a static token, a closed-edge publish forwards the edge token unchanged, and an open-edge publish forwards the caller's own credential.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000103
      - 0ec10e5e-0000-4000-8000-000000000106
      - 0ec10e5e-0000-4000-8000-000000000125
  - id: mit-credential-passthrough
    title: Per-caller credential passthrough
    prose: The read path never substitutes a credential of Écluse's own. It forwards the caller's credential to the private upstream and strips caller credentials from public fetches, which it makes anonymously. The publish path sends credentials only to the operator-declared publication target, and Écluse mints no publication token.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000103
      - 0ec10e5e-0000-4000-8000-000000000104
      - 0ec10e5e-0000-4000-8000-000000000125
  - id: mit-no-redirects
    title: No redirects on any data-plane request
    prose: The shared parse entry pins `redirectCount=0` on every request it returns, and the mirror-write transport pins it again on every request an adapter's codec forms, whether or not the codec routes through credential attachment. No data-plane request, credential-bearing write, or maintenance delete follows a redirect, so no hop can move a credential after the target check, escape the egress allow-list, or downgrade the scheme.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000104
      - 0ec10e5e-0000-4000-8000-000000000105
      - 0ec10e5e-0000-4000-8000-000000000107
      - 0ec10e5e-0000-4000-8000-00000000010e
      - 0ec10e5e-0000-4000-8000-000000000125
      - 0ec10e5e-0000-4000-8000-000000000128
  - id: mit-endpoint-collision-refusal
    title: Endpoint collision refusal at boot
    prose: The boot and check-config compare declared endpoints before any role starts, and each refusal names the keys involved. Registry identity folds the authority to lower case, applies the default port, ignores a trailing slash, and compares the path exactly, so distinct repositories on one host stay distinct, and so do the repositories of one CodeArtifact domain and a repository's per-format endpoints. Every role refuses a private upstream that is the same repository as its own mount's public upstream, a mirror target or publication target on the host of any mount's public upstream, a publication target equal to another mount's private upstream, mirror target, or publication target, and two endpoints that name one registry under different store tags, including a second tag added by an environment layer. The Dredger also refuses a mirror target equal to any mount's private upstream or to its own mount's publication target, and a publication target equal to its own mount's private upstream, because its deletions would reach first-party packages that exist only in the publication target. The proxy and the mirror worker boot on those collapsed pairs and warn once for each. One combinator maps each collision to the outcome of the booting role, so a refusal and a warning come from one rule. The publish relay takes its target as a `VettedPublication`, whose constructor the validation module does not export, so every target the relay receives comes from this boot check. The check adds no restriction for DNS aliases.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000104
      - 0ec10e5e-0000-4000-8000-00000000010a
      - 0ec10e5e-0000-4000-8000-000000000111
      - e23cddfe-96d4-47c6-92e0-a961abadb5b3
      - 0ec10e5e-0000-4000-8000-000000000125
      - 0b32b3e5-74f1-421c-8c9b-92a24fd2a00b
      - 0ec10e5e-0000-4000-8000-000000000127
  - id: mit-identifier-encoding
    title: Canonical identifiers, encoded on build
    prose: Écluse canonicalises a package identifier and percent-encodes it when it builds an outbound URL, so a traversal, encoded-slash, or absolute-URL name does not change the request target.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000105
  - id: mit-egress-allowlist
    title: Outbound host allow-list
    prose: Écluse enforces an outbound host and port allow-list where it builds each request URL. A back-fill location passed the same allow-list at serve time, before its job was enqueued. The allow-list bounds which names can be aimed inward. It does not remove connect-time timing.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000105
      - 0ec10e5e-0000-4000-8000-00000000010e
      - 0ec10e5e-0000-4000-8000-000000000110
  - id: mit-https-only-egress
    title: https-only egress with certificate validation
    prose: Every outbound registry URL passes through `mkRegistryUrl`, which rejects any scheme other than https, and a configured endpoint that is not https fails the boot. The trusted private origin, the publication target, the mirror target, the store a delete goes to, and the back-fill fetch all meet this rule on the validating-TLS data-plane manager. Certificate validation authenticates the dialled host. A name steered to an internal or rebound address cannot present a CA-trusted certificate for the requested host, so the connection fails at the handshake before any request body leaves. This closes the resolve-to-internal and DNS-rebinding classes without a resolved-IP recheck.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000104
      - 0ec10e5e-0000-4000-8000-000000000105
      - 0ec10e5e-0000-4000-8000-00000000010e
      - 0ec10e5e-0000-4000-8000-000000000110
      - 0ec10e5e-0000-4000-8000-000000000125
      - 0ec10e5e-0000-4000-8000-000000000128
  - id: mit-artifact-location-authority
    title: Same-authority artifact locations
    prose: A disallow-by-default same-authority policy applies to every upstream-declared artifact location, matched on host and port, with the hosts an ecosystem serves artifact bytes from as its one equivalence. Écluse upgrades a legacy http location to https on the same host, and drops and records a file whose scheme or authority the policy refuses. The projection and the download gate read one definition of the check, so a refused file is absent from the served listing, and a release drops when none of its files survive.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000105
      - 72ad19e6-3fbf-44c6-a190-8cb074f89ea0
  - id: mit-internal-range-block
    title: Literal internal-range block
    prose: As defence in depth, the artifact-host gate refuses literal addresses in a fixed set of internal ranges. `ECLUSE_EGRESS__ADDITIONAL_BLOCKED_RANGES` adds internal space the module cannot know in advance. The setting only widens the set, and a malformed entry fails the boot.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000105
  - id: mit-first-party-publish-guard
    title: First-party publish guard
    prose: A mount's `firstParty` declaration, for npm a list of scopes, refuses a publish of any name outside the namespaces the deployment owns, before any upstream write. The scope match is exact on the parsed namespace, so `@acme-evil` does not satisfy `@acme`. Écluse checks that the publish document's declared name, its `_id`, and every per-version name equal the scope-guarded name in the URL path, then builds the write URL from that canonical name. The guarded name, the written name, and the merge collision key are therefore one identity.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000106
  - id: mit-store-tag-credentials
    title: Store tag binds credential to endpoint
    prose: An endpoint declares its store as a tag, and the load validates the URL against that tag, so the credential and the endpoint are one declaration. Under `codeArtifact`, Écluse mints the write token from the container or task role, parses the mint identity from the target's own host, and admits no static token. The token carries the role's own permissions, and CodeArtifact caps its life at 12 hours. Under `registry` and `verdaccio`, the tag requires the operator's static token and mints nothing. The schema refuses a token under the minting tag and a missing token under the others, so the configuration cannot state a divergent pair. Validation refuses a `codeArtifact` URL whose host is not a CodeArtifact endpoint, and a mirror target whose path is not the repository endpoint for the mount's own ecosystem, so a token minted for one domain reaches no other. Each refusal names the key.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000107
      - 0ec10e5e-0000-4000-8000-000000000111
  - id: mit-serve-only-mount
    title: Serve-only mounts carry no write surface
    prose: A mount with no `mirrorTarget` holds and mints no write credential and enqueues no back-fill job. When no mount declares a mirror target, the process builds no mirror queue and starts no worker. When some mounts mirror and others do not, the process builds the queue and the worker for the mirroring mounts only.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000107
      - 0ec10e5e-0000-4000-8000-00000000010e
      - 0ec10e5e-0000-4000-8000-000000000111
  - id: mit-worker-opaque-bytes
    title: Worker forwards bytes unparsed
    prose: The mirror worker hashes the fetched bytes and forwards them unchanged, with no decompression and no tarball parsing, so a malicious artifact has little code-execution surface in the worker.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000107
  - id: mit-worker-integrity-check
    title: Worker integrity verification
    prose: The worker verifies the fetched bytes against the upstream's `dist.integrity` before it publishes them, and it never returns them to a caller. The check fails closed when the strongest digest present uses an algorithm it cannot compute, and it never falls back to a weaker digest. An internal or metadata response cannot match the asserted digest, so such a job fails and drops. The check proves that the bytes match the upstream's assertion. It catches tampering in transit and downgrade, not a hostile upstream or a worker compromise, which the admission gate, the role's grant, and queue access control bound.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000107
      - 0ec10e5e-0000-4000-8000-00000000010d
      - 0ec10e5e-0000-4000-8000-00000000010e
      - bd6136ad-e767-424b-bda4-53144a8a7f10
  - id: mit-worker-reevaluation
    title: Worker re-evaluation before mirroring
    prose: Public admission applies the configured rules before a version is queued, and the worker applies them again, with its current first-party predicate, before it downloads the artifact. A winning named deny stops new admission when its evidence is available, and the worker drops a queued job for a first-party name.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010d
      - 0ec10e5e-0000-4000-8000-000000000126
      - bd6136ad-e767-424b-bda4-53144a8a7f10
  - id: mit-metadata-endpoint-isolation
    title: No data-plane path to instance metadata
    prose: Écluse follows an internal-resolving location only on the trusted private origin, never on a target a client or an upstream can influence, so client and upstream input does not steer the data plane at the metadata endpoint. Token minting uses amazonka's own HTTP client, separate from the guarded data-plane manager.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000108
  - id: mit-private-origin-uncached
    title: Private origin bypasses the shared cache
    prose: The composition wires the private-origin path to an uncached metadata fetch, and wires the shared cache to the anonymous, gated public origin. Écluse re-consults the private origin on every request with the caller's own forwarded token, so the shared cache holds no private document.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000109
  - id: mit-integrity-floors
    title: Integrity floors
    prose: Public admission requires the configured integrity floor, which cannot go below SHA-256. Private metadata must meet the trusted integrity floor, which the operator can loosen. Invalid, absent, unsupported, or below-floor evidence does not bypass admission to reach the divergence comparison.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010b
  - id: mit-divergence-warning
    title: Cross-origin divergence warning
    prose: "When a version exists on both origins, Écluse compares the digests in their shared algorithms and logs a conflict at WARNING with both digests, and it increments a bounded-cardinality metric. The private version and its tags stay listed, and private artifact GET, HEAD, and conditional requests keep private preference. Conflict evidence that passed package identity, artifact-location, and integrity admission survives a public rule denial: when a named rule denies the public copy and both digests are fixed, the warning and the metric still fire, and the denied public entries stay out of served metadata. The load refuses the listing-only fail-closed divergence setting with migration guidance. A single-origin mount has no cross-origin comparison."
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010b
  - id: mit-private-refusal-stops-read
    title: Private refusal stops the read
    prose: A 401 or 403 from the private upstream stops a metadata or artifact read with a local 403 before Écluse reads the error body, even when public content would pass admission, so no public copy substitutes. A genuine private 404 still falls back to the public origin for a package that is not first-party.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010b
  - id: mit-first-party-private-routing
    title: First-party names resolve privately only
    prose: A declared first-party name resolves only through the private upstream. Metadata does not fetch or merge the public origin, and an artifact read does not fall back to the public origin after a private miss. npm scopes match exactly, and PyPI declarations name canonical project names or prefixes bounded by a separator. The load refuses an empty declaration.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000126
  - id: mit-dredger-named-deny
    title: Deletion only on a named decisive deny
    prose: "The Dredger deletes a version only when a named rule denies it decisively. Deny-by-default and unvettable results keep the version. Identity-only evidence, a listed version with no readable metadata, goes to the full rule set: any rule that decides from name and version can condemn the version, such as a bare-name `DenyByIdentity`, `DenyIfCve`, or `DenyIfEpss`, and a rule that needs a fact the evidence lacks keeps the version. Rule precedence and every deletion guard still apply. If removing an allow exposes a winning deny, normal pruning applies, and later cycles reconcile eligible late publications under current evidence."
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010d
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - 0b32b3e5-74f1-421c-8c9b-92a24fd2a00b
      - f2e4bd60-86cc-4a3d-b94a-5e971c29ae08
  - id: mit-dredger-first-party-protection
    title: First-party names are outside deletion
    prose: The Dredger skips names under a first-party declaration before any rule runs, so no deny, including an identity deny, deletes them. This protection also covers public-derived copies retained before the declaration.
    status: implemented
    threats:
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - e23cddfe-96d4-47c6-92e0-a961abadb5b3
      - 0ec10e5e-0000-4000-8000-000000000126
      - f2e4bd60-86cc-4a3d-b94a-5e971c29ae08
  - id: mit-dredger-vetted-mirror-only
    title: Deletion from vetted targets
    prose: The Dredger deletes from mirror targets that passed the boot vetting pass. The composition wires the backend that pass clears into the code that builds the delete capability. A refusal from any vetting rule fails the whole pass, so an overlapping configuration does not reach a delete. Deletion is format-scoped and uses plain version deletion (`DeletePackageVersions` on CodeArtifact), never disposal.
    status: implemented
    threats:
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - e23cddfe-96d4-47c6-92e0-a961abadb5b3
      - 0b32b3e5-74f1-421c-8c9b-92a24fd2a00b
      - f2e4bd60-86cc-4a3d-b94a-5e971c29ae08
  - id: mit-deletion-consent
    title: Per-target deletion consent
    prose: The Dredger checks explicit consent on its target at the start of every sweep cycle. On CodeArtifact, consent is the repository tag `ecluse-dredger-consent=true`, read through maintenance permissions, and removing the tag takes effect on the next cycle. On Verdaccio, consent is `permitDeletion` in boot configuration, so a change needs a restart. The boot refuses a backend that has no form of consent. Consent is separate from the credential's capability, so holding the credential is not permission to delete, and pointing the Dredger at a store that carries no consent marker fails the check.
    status: implemented
    threats:
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - c12bddfe-96d4-47c6-92e0-a961abadb5b2
      - 0b32b3e5-74f1-421c-8c9b-92a24fd2a00b
      - 0ec10e5e-0000-4000-8000-000000000127
      - f2e4bd60-86cc-4a3d-b94a-5e971c29ae08
  - id: mit-deletion-cap
    title: Per-cycle deletion cap with a latched halt
    prose: The Dredger counts deletions per cycle, from zero at the start of each cycle. Reaching the cap latches a halt for the life of the process, sets readiness false, and leaves liveness healthy, so the cap does not cause a restart and does not simply wait for the next cycle's fresh count. A restart clears the latch and separate processes count separately, so the cap is not a lifetime or store-wide quota.
    status: implemented
    threats:
      - 0c922ee5-3ac6-4a85-89de-91feecf0f9f7
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - 0b32b3e5-74f1-421c-8c9b-92a24fd2a00b
      - f2e4bd60-86cc-4a3d-b94a-5e971c29ae08
  - id: mit-dredger-dry-run
    title: Dry run without delete capability
    prose: A dry run holds no delete capability, writes no cursor, and needs no consent. It reports consent, unmet prerequisites for a real sweep, and incomplete counts separately, and it cannot grant consent or acquire a delete capability.
    status: implemented
    threats:
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - 0b32b3e5-74f1-421c-8c9b-92a24fd2a00b
  - id: mit-paced-candidate-sweep
    title: Paced candidate-driven sweeps
    prose: A sweep considers the names that advisories cover and the names that identity-deny rules name, not every stored package, unless the operator selects a full walk. Work runs in paced chunks, and a store failure that survives its bounded retry halts the cycle.
    status: implemented
    threats:
      - 0c922ee5-3ac6-4a85-89de-91feecf0f9f7
  - id: mit-dredger-probe-only
    title: Dredger takes no request ingress
    prose: The Dredger takes no ingress beyond its liveness and readiness probes and, when the operator sets `OTEL_METRICS_EXPORTER=prometheus`, a metrics scrape listener.
    status: implemented
    threats:
      - c12bddfe-96d4-47c6-92e0-a961abadb5b2
  - id: mit-store-delete-component-gate
    title: Gated path components on store deletes
    prose: Before a delete on a protocol-only store, the Dredger passes the revision marker and the artifact file name from the store's package document through the component gate the serve path uses. The gate refuses an empty component, `.` or `..`, and any component that holds a slash, a backslash, or a control character. A file name that fails falls back to the conventional name built from the package and the version, and a revision marker that fails refuses that one version. The build then percent-encodes every component and keeps only the unreserved set verbatim, so safety rests on encoding as well as on the gate. The gate is structural, so a valid component that is not the version's own artifact still forms a delete, bounded to the one mirror store the credential reaches.
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-000000000128
  - id: mit-max-advisory-age
    title: Maximum advisory age
    prose: "Consumers refuse advisory evidence older than the maximum advisory age, measured from Pilot's last push. An explicit `advisories.maxAgeSeconds` overrides the default, which is the shortest period the quarantine holds a version on that mount, minus 24 hours and never under 3 days, or 3 days when the mount has no quarantine rule. A seven-day hold in the quarantine gives six days, so a failure surfaces before the next cohort leaves the quarantine. Past the maximum age, the CVE and EPSS deny paths refuse even under `onUnavailable: skip`, and the maximum age applies separately from any rule's skip setting. An undated artifact refuses, and the Dredger withholds advisory-based deletions."
    status: implemented
    threats:
      - 0ec10e5e-0000-4000-8000-00000000010d
      - 43f60aec-7a7c-4450-8992-ae2b42d20b0f
      - 6a368fa6-e4c8-446e-8e24-0685bb0980ef
      - 4d309275-cc3c-43d0-a1a2-f024789e9f17
      - b74d9df0-8947-4e67-bf50-1c5e688a09f1
  - id: mit-role-separation
    title: Pilot runs as its own role
    prose: Pilot runs in its own process and container with its own identity, apart from the proxy, and its only S3 call is the artifact upload. A Pilot failure, memory exhaustion included, delays advisory updates and does not stop the proxy.
    status: implemented
    threats:
      - b1a6332d-8def-4df9-922e-53718c920155
      - 3735906e-a06a-4e0f-ba45-894ba5400ce8
  - id: mit-advisory-artifact-acceptance
    title: Hardened advisory database acceptance
    prose: The proxy opens the advisory database with `PRAGMA query_only = ON` and `PRAGMA trusted_schema = OFF`, so an attacker-controlled trigger or view does not run. Before the proxy serves from an artifact, acceptance checks the schema epoch stamp, runs `PRAGMA quick_check` (which also checks stored values against each STRICT table's declared column types), requires real STRICT tables with the required columns, and checks the ecosystem and the EPSS record. Acceptance returns a failing artifact as a rejection value and remembers its ETag.
    status: implemented
    threats:
      - 32d813d8-6bee-4fa3-acb2-d62efe5aff18
  - id: mit-last-good-advisories
    title: Last-good advisory database
    prose: The proxy swaps in a new advisory database atomically, so no read sees a partial file. A rejected artifact, a failed fetch, or a failed Pilot run leaves the last-good database serving in a warm process.
    status: implemented
    threats:
      - 32d813d8-6bee-4fa3-acb2-d62efe5aff18
      - 3735906e-a06a-4e0f-ba45-894ba5400ce8
      - 6a368fa6-e4c8-446e-8e24-0685bb0980ef
  - id: mit-pilot-ingest-limits
    title: Bounded advisory ingestion
    prose: Pilot streams the OSV archive and bounds each advisory as it unzips. It drains an entry past the 8 MiB per-advisory cap to its boundary and drops it before decoding, drops an entry whose JSON does not decode, and logs and counts both, so a few poisoned records do not halt ingestion. It logs an advisory with an anomalous range fan-out at WARNING and still ingests it. The per-entry cap bounds nesting depth and holds decode cost to a constant multiple of the input, and Pilot runs under the boot-resolved heap ceiling (`ECLUSE_RUNTIME__MAX_HEAP_BYTES`, else the cgroup `memory.max`). A small but deeply nested payload therefore ends in a bounded, clean process exit instead of exhausting the machine. That exit is a Pilot crash, not a per-record drop.
    status: implemented
    threats:
      - 3735906e-a06a-4e0f-ba45-894ba5400ce8
  - id: mit-pilot-systemic-drop-abort
    title: Systemic drop rate aborts the compile
    prose: Pilot reads its own drop count for the run. When at least 16 entries drop and the drops are at least a tenth of the run, Pilot aborts the compile without publishing, so the proxy keeps its last-good database. That rate marks a mostly unusable feed, the shape of a compromised or truncated export.
    status: implemented
    threats:
      - 3735906e-a06a-4e0f-ba45-894ba5400ce8
      - b74d9df0-8947-4e67-bf50-1c5e688a09f1
  - id: mit-pilot-zero-output-refusal
    title: Zero-output refusal
    prose: After ecosystem filtering, Pilot counts the persisted advisory ranges. When none remain, including for an empty or wrong-ecosystem export, it logs ERROR and publishes nothing, before it writes success metadata. A rejected compile keeps the last-good bytes and timestamps, and a first rejection leaves no artifact. A nonempty but reduced export still passes.
    status: implemented
    threats:
