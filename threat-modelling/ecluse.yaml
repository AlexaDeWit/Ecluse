      - kind: actor
        id: 0ec10e5e-0000-4000-8000-000000000011
        name: Public npm registry
        description: The upstream registry. Its tarball bytes and author-supplied manifest fields are untrusted. The rules engine and the integrity floor gate them, and Écluse never serves them blindly. Écluse trusts the fields the registry itself asserts only to the floor that the registry operator is honest. The per-version publish time is server-stamped, and so is server-side integrity. npm, PyPI, and RubyGems record the publish time server-side, and it is absent from the publish document, so a publisher cannot backdate it. A compromised or malicious registry operator that forged those fields sits below this necessary trust floor and is out of scope. Écluse queries the registry anonymously, with the caller credential stripped.
