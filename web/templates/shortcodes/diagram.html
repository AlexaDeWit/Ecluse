{%- set asset = get_url(path="diagrams/" ~ name ~ ".svg") -%}
<figure class="diagram">
  <a href="{{ asset }}" aria-label="Open full-size diagram: {{ alt }}">
    <img src="{{ asset }}" alt="{{ alt }}" loading="lazy" />
  </a>
  <figcaption>{% if caption is defined %}{{ caption }} {% endif %}<a href="{{ asset }}">Open full-size diagram</a></figcaption>
</figure>
